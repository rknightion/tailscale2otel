# Fixture: a well-formed Grafana provisioning rules file (apiVersion 1).
apiVersion: 1
groups:
  - orgId: 1
    name: "fixture-health"
    folder: "fixture"
    interval: "1m"
    rules:
      - uid: "fx-exporter-down"
        title: "Exporter down"
        condition: "C"
        data:
          - refId: "A"
            datasourceUid: "grafanacloud-prom"
            model:
              expr: "tailscale2otel_up_ratio"
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              expression: "A"
              reducer: "last"
              type: "reduce"
              refId: "B"
          - refId: "C"
            datasourceUid: "__expr__"
            model:
              expression: "B"
              type: "threshold"
              refId: "C"
      - uid: "fx-logs"
        title: "Log volume"
        condition: "B"
        data:
          - refId: "A"
            datasourceUid: "grafanacloud-logs"
            model:
              expr: 'sum(count_over_time({service_name="tailscale2otel"}[5m]))'
              refId: "A"
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              expression: "A"
              type: "threshold"
              refId: "B"

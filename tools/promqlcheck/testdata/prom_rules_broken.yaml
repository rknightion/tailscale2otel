# Fixture: one unparseable expr, plus one leaking a Grafana dashboard variable
# (a rule file has no dashboard to declare it, so any $var is a bug).
groups:
  - name: fixture.broken
    rules:
      - alert: BadSyntax
        expr: rate(tailscale_network_io_bytes_total[5m]
        for: 5m
      - alert: LeakedDashboardVariable
        expr: sum(rate(tailscale_network_io_bytes_total[$__rate_interval])) > $topn
        for: 5m

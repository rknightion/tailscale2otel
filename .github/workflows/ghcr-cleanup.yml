# Weekly GHCR retention. Keeps every stable release forever, the newest 10 RCs,
# and 7 days of main-<sha> edge images; sweeps orphaned cosign signatures and
# stale buildcache layers.
name: ghcr-cleanup

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report what would be deleted without deleting it."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Never cancel a retention sweep halfway through; serialize overlapping runs.
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  prune:
    permissions:
      contents: read
      packages: write # delete package versions
    uses: rknightion/.github/.github/workflows/ghcr-cleanup.yml@ff43f62eaec9f41d49b9a208d86b2eb932c97056 # v1.18.1
    with:
      packages: "tailscale2otel,charts/tailscale2otel"
      # Scheduled runs prune for real; a manual dispatch defaults to dry-run.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

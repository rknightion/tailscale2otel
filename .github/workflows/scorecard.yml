name: Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 7 * * 3'
permissions: {}
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    permissions:
      security-events: write
      id-token: write
    uses: rknightion/.github/.github/workflows/scorecard.yml@5a2b8d059084a79d11c9675f2fd07abd7003f915 # v1.13.0

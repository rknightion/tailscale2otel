name: Scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 7 * * 3'
permissions: {}
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scorecard:
    permissions:
      security-events: write
      id-token: write
    uses: rknightion/.github/.github/workflows/scorecard.yml@7be903bd193f76b1a590cbe54943a9bf9592ce45 # v1.18.0

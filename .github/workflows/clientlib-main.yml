name: Client-lib tracking

on:
  schedule:
    - cron: "31 6 * * 1" # Mondays 06:31 UTC
  workflow_dispatch:

# No pull-requests:write and the Anthropic key is deliberately NOT provided to this
# lane: it builds/tests against tailscale-client-go@main — i.e. it executes UNTRUSTED
# upstream code. Withholding the secret means it never shares an environment with that
# code (no exfil), and Claude enrichment is skipped here (no automated PR from an
# attacker-influenced build log). The tracking issue is still filed.
permissions:
  contents: read

concurrency:
  group: clientlib-main
  cancel-in-progress: false

jobs:
  # The matrix legs DELIBERATELY do not touch the tracking issue (#435).
  #
  # They used to: each leg called report-drift directly, and report-drift upserts
  # by reading `gh issue list --label ... --state open` and then creating if the
  # read came back empty. That is a check-then-act race with no lock, and this is
  # the only lane whose matrix shares a single label — so when both legs failed in
  # the same run (the common case, since a genuine upstream break usually breaks
  # both `main` and `latest`), both could read "no open issue" before either had
  # created one, and file two.
  #
  # Each leg now records its own verdict as an artifact and stays silent. Exactly
  # one downstream job reads them and speaks, so there is no interleaving to race.
  build-against:
    timeout-minutes: 20
    permissions:
      contents: read # no issues:write — this job no longer files anything
    strategy:
      fail-fast: false
      matrix:
        ref: [main, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Bump client lib (ephemeral; not committed)
        id: bump
        env:
          REF: ${{ matrix.ref }}
        run: |
          set +e
          baseline=$(go list -m -f '{{.Version}}' github.com/tailscale/tailscale-client-go/v2 2>/dev/null)
          baseline_code=$?
          if [ "$baseline_code" -ne 0 ]; then
            baseline=unresolved
          fi

          # A non-resolving @main/@latest ref must surface as a failure, not silently
          # fall through to a build against the unchanged pinned version.
          go get "github.com/tailscale/tailscale-client-go/v2@${REF}" > /tmp/cl.log 2>&1
          get_code=$?
          code=$get_code
          {
            if [ "$get_code" -eq 0 ]; then
              go mod tidy
              code=$?
            fi
            if [ "$code" -eq 0 ]; then
              go build ./...
              code=$?
            fi
            if [ "$code" -eq 0 ]; then
              go vet ./...
              code=$?
            fi
            if [ "$code" -eq 0 ]; then
              go test -race ./...
              code=$?
            fi
          } >> /tmp/cl.log 2>&1

          candidate=$(go list -m -f '{{.Version}}' github.com/tailscale/tailscale-client-go/v2 2>/dev/null)
          candidate_code=$?
          if [ "$candidate_code" -ne 0 ]; then
            candidate=unresolved
          fi
          {
            echo "code=${code}"
            echo "get_code=${get_code}"
            echo "baseline=${baseline}"
            echo "candidate=${candidate}"
          } >> "$GITHUB_OUTPUT"

      # Every completed leg publishes an explicit verdict. Artifact absence is
      # therefore inconclusive, rather than an implicit pass. This is important
      # when checkout, setup, or artifact publication itself fails before a
      # measured build can produce its result.
      - name: Capture verdict
        run: |
          set -uo pipefail
          mkdir -p /tmp/verdict
          {
            if [ "${CODE}" = "0" ]; then
              echo "verdict=pass"
            elif [ "${GET_CODE}" = "0" ] && [ "${BASELINE}" = "${CANDIDATE}" ]; then
              # The requested ref resolved to what this checkout already pins.
              # A failing test still needs attention, but cannot prove a client-lib
              # regression, so fail closed without filing a false drift issue.
              echo "verdict=inconclusive"
            else
              echo "verdict=fail"
            fi
            echo "### \`${REF}\`"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| requested ref | \`${REF}\` |"
            echo "| baseline module | \`${BASELINE}\` |"
            echo "| candidate module | \`${CANDIDATE}\` |"
            echo "| go get exit code | \`${GET_CODE}\` |"
            echo "| toolchain | \`$(go version)\` |"
            echo "| runner | \`${RUNNER_OS}/${RUNNER_ARCH}\` |"
            echo "| exit code | \`${CODE}\` |"
            if [ "${CODE}" != "0" ]; then
              echo
              echo "<details><summary>Last 8000 bytes of the build log</summary>"
              echo
              echo '```'
              tail -c 8000 /tmp/cl.log
              echo '```'
              echo
              echo "</details>"
            fi
          } > "/tmp/verdict/${REF}.md"
        env:
          REF: ${{ matrix.ref }}
          CODE: ${{ steps.bump.outputs.code }}
          GET_CODE: ${{ steps.bump.outputs.get_code }}
          BASELINE: ${{ steps.bump.outputs.baseline }}
          CANDIDATE: ${{ steps.bump.outputs.candidate }}

      - name: Publish verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clientlib-verdict-${{ matrix.ref }}
          path: /tmp/verdict/${{ matrix.ref }}.md
          if-no-files-found: error
          retention-days: 14

  # The single writer. `if: always()` so it runs whatever the legs did, because
  # the "everything is green again, close the issue" path is just as important as
  # the failure path and must be decided from the SAME view of all legs.
  #
  # Aggregating here also fixes what the per-leg version got wrong even when it
  # did not race: two failing legs produced two issues with two different titles
  # under one label, and resolve-drift closes every open issue carrying the label,
  # so the duplicate was only ever cleaned up by a later fully-green run.
  report:
    timeout-minutes: 10
    needs: build-against
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the only job in this lane that writes to the tracker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Collect verdicts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/verdicts
          pattern: clientlib-verdict-*
          merge-multiple: true
        # download-artifact exits non-zero when an earlier job died before it
        # could publish. The assembler classifies the missing verdict as
        # inconclusive; letting collection continue is not a green decision.
        continue-on-error: true

      - name: Assemble one report
        id: assemble
        run: |
          bash .github/actions/report-drift/scripts/assemble-clientlib-verdicts.sh \
            --verdict-dir /tmp/verdicts \
            --legs-result "${LEGS_RESULT}" \
            --report-path /tmp/cl.md \
            --run-url "${RUN_URL}"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LEGS_RESULT: ${{ needs.build-against.result }}

      # One call, one issue, whichever legs failed — so the title no longer varies
      # per leg and the dedup label always has exactly one issue to find.
      - name: Report + fail
        if: steps.assemble.outputs.outcome == 'failure'
        uses: ./.github/actions/report-drift
        with:
          lane-label: clientlib-drift
          title: "tailscale-client-go/v2 breaks our build"
          report-path: /tmp/cl.md

      # Only close when EVERY leg is green, which is now a property of this job's
      # own view rather than of `needs` + a default success() condition.
      - name: Resolve tracking issue on clean run
        if: steps.assemble.outputs.outcome == 'green'
        uses: ./.github/actions/resolve-drift
        with:
          lane-label: clientlib-drift

name: Helm

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - "config.example.yaml"
      - "internal/config/**"
      - "tools/configcheck/**"
      - ".github/workflows/helm.yml"
  # No path filter here on purpose: "helm lint + template + schema + docs" is a
  # required status check on `main`, so it must report on EVERY pull request. A
  # paths filter would skip the workflow on non-helm PRs, leaving them blocked on
  # a required check that never reports. The push trigger above stays path-scoped.
  pull_request:

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_DIR: deploy/helm/tailscale2otel

jobs:
  lint-template:
    timeout-minutes: 15
    name: helm lint + template + schema + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      # Asserts the credential-routing contract (#470) and the rollout-trigger contract
      # (#469): no credential value reaches any ConfigMap, pod annotation, label or arg;
      # credential-free configs keep the ConfigMap; an unsafe combination fails the
      # render. Pure `helm template` + yq, no cluster. yq is preinstalled on
      # ubuntu-latest runners.
      - name: helm lint, template, and chart render contracts
        run: just helm-lint

      # Regenerate values.schema.json (draft-07; Helm only validates draft-07) and
      # fail if the committed copy drifts. The committed file is the baseline.
      #
      # NOTE: this action installs helm-values-schema-json v2.5.0 (the tool version
      # is baked into the action's dist/index.js and is NOT the action's own
      # version). scripts/regen-generated.sh pins the same tool version so local
      # regeneration is byte-identical. If you bump this action, re-check the tool
      # version it installs and update HELM_SCHEMA_VERSION in that script to match.
      - name: values.schema.json is in sync (losisin/helm-values-schema-json)
        uses: losisin/helm-values-schema-json-action@9f555986124362af978a9861cf0f81e1956300ad # v3.1.0
        with:
          values: ${{ env.CHART_DIR }}/values.yaml
          output: ${{ env.CHART_DIR }}/values.schema.json
          draft: 7
          # Root-level strictness, so a typo'd TOP-level key (the classic
          # `--set secrets.foo=...`, which renders no credential) is rejected.
          # It has no values.yaml annotation equivalent, so it must be set here
          # AND as --schema-root.additional-properties=false in
          # scripts/regen-generated.sh, or local regeneration drifts from CI.
          additionalProperties: false
          fail-on-diff: true

      # Regenerate the chart README from README.md.gotmpl + value annotations and
      # fail if it drifts from the committed copy.
      #
      # NOTE: this action installs helm-docs v1.14.2 (an upstream release binary,
      # whose version ldflag is set — that ldflag is what renders the README's
      # version footer). scripts/regen-generated.sh pins the same version AND
      # passes the ldflag, so local regeneration is byte-identical. If you bump
      # this action, update HELM_DOCS_VERSION in that script to match.
      - name: helm-docs is in sync (norwoodj/helm-docs)
        uses: losisin/helm-docs-github-action@3a4528e97c49a5e83de6b78c50c61c8ee5c9f944 # v2
        with:
          chart-search-root: ${{ env.CHART_DIR }}
          fail-on-diff: true

  configcheck:
    timeout-minutes: 15
    name: config.Load validates example + rendered config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: tools/configcheck/go.sum

      # Render the chart and extract the ConfigMap's config.yaml so config.Load
      # exercises the cross-field rules JSON Schema draft-07 cannot express.
      - name: Validate example + rendered config
        run: just config-check

  # This chart published to GHCR with no schema validation against the real
  # Kubernetes API schemas at all — `just helm-lint` above only checks helm's
  # own lint rules and this repo's render contracts, never that the rendered
  # manifests are schema-valid. No kubeVersion floor is declared in Chart.yaml,
  # so this validates against the reusable's own default floor (1.29.0).
  helm-schema-validate:
    name: helm schema validate (kubeconform)
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/helm-validate.yml@79a72d215e806c12876526ff30fbd524250e1bf9 # v1.17.1
    with:
      # This chart renders CRD kinds (ServiceMonitor) that kubeconform has no
      # built-in schema for. Give it the schema rather than reaching for
      # -ignore-missing-schemas: that flag skips EVERY unschema'd kind
      # silently, so the check passes while validating nothing. sf2loki
      # carried it for exactly that reason and its ExternalSecret and
      # SecretStore had therefore never once been validated.
      schema-locations: >-
        default
        https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
      chart-path: deploy/helm/tailscale2otel
      kubernetes-versions: "1.29.0"

  # Single required status check for this workflow. Branch protection on `main` requires this
  # (alongside ci.yml's `ci-success`), so helm legs can be added or renamed without re-touching
  # protection. The pull_request trigger above has no path filter on purpose, so this always reports
  # on every PR. Fails if any leg failed or was cancelled. Renovate's automerge waits for it to go green.
  helm-success:
    timeout-minutes: 5
    name: helm-success
    runs-on: ubuntu-latest
    if: always()
    needs: [lint-template, configcheck, helm-schema-validate]
    steps:
      - name: Fail if any required job did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "A required job failed or was cancelled: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All required jobs passed
        run: echo "helm-success — ${{ join(needs.*.result, ', ') }}"

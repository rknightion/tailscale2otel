name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 3 * * 2'
permissions: {}
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@40b04a8393537f0aaf610e9286a5d4af44f98455 # v1.32.2
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
      timeout-minutes: 30

name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
permissions: {}
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@81fc55183265da0b21e92e690f70d679b20ed822 # v1.21.0
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'

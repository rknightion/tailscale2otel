name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
permissions: {}
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@e17f6f1a010f50cf878b310cf90820f14c0bbbf6 # v1.25.2
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'

name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
permissions: {}
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@36b5178e7fac9278288b7a5ded0f1fc4c9deb7f5 # v1.30.24
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'

name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
permissions: {}
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    uses: rknightion/.github/.github/workflows/codeql.yml@658b37ea0def29f579ec5d9acb3d67d49bfe37f1 # v1.25.29
    with:
      languages: '[{"language":"go","build-mode":"autobuild"},{"language":"python","build-mode":"none"},{"language":"actions","build-mode":"none"}]'

name: Release

# Releases are driven by release-please from Conventional Commits (the repo's
# commit convention). On every push to main, the `release-please` job maintains
# a "release PR" that accumulates the changelog + the next version. Merging that
# PR makes release-please create the GitHub Release + a `vX.Y.Z` tag and sets
# `release_created=true`, which unlocks the GoReleaser + Helm jobs below.
#
# Everything runs in ONE workflow gated on that output, so the default
# GITHUB_TOKEN is enough: we never depend on a token-created tag/release to
# trigger a SECOND workflow (events raised by GITHUB_TOKEN don't chain, which is
# the usual release-please footgun). No PAT / GitHub App is required.
#
# Images + the Helm chart are published by the `publish`/`edge` jobs via the shared
# rknightion container-publish reusable (native matrix, cosign, provenance, SBOM,
# Trivy). GoReleaser (`--skip=docker`) now ONLY builds the cross-compiled binaries +
# checksums + archive SBOMs and uploads them to the release release-please created;
# it does NOT overwrite the release body, so release-please stays the single owner of
# the changelog/notes. Snapshot ("edge") :main images + charts come from the `edge`
# job on every non-release push to main (replaces the old main-publish.yml).
on:
  push:
    branches: [main]

# Least-privilege default; each job widens this as needed.
permissions:
  contents: read

concurrency:
  # Serialize releases; never cancel one mid-flight.
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    timeout-minutes: 10
    name: release-please (maintain release PR / cut release)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + tag
      pull-requests: write # open/maintain the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      # Pinned to the immutable commit for release-please-action v4.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # PAT (not GITHUB_TOKEN): bot-authored release PRs need a non-default-token author for CI to run without manual approval
          #
          # zizmor's `secrets-outside-env` audit (auditor persona only; not raised under the
          # persona CI runs) wants this moved into a deployment environment. DELIBERATELY NOT
          # DONE: this job has no `if:` gate, so it runs on EVERY push to main to maintain the
          # release PR — not just when cutting a release. An environment with protection rules
          # would put a manual approval in front of every push, which is exactly what this PAT
          # exists to avoid; one without protection rules is naming ceremony and no security.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Build + push the image + Helm chart for the freshly-created tag via the shared
  # rknightion container-publish reusable. Same run as the merge that created the release.
  publish:
    name: publish (image + helm)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write        # attach SBOMs + third-party notices to the GitHub Release
      packages: write        # push the image + Helm chart to GHCR
      id-token: write        # cosign keyless signing + provenance attestation
      attestations: write    # SLSA build provenance for the image
      security-events: write # Trivy SARIF upload
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}

  # Edge build on every non-release push to main: publishes the :main multi-arch image
  # + a main-snapshot Helm chart via the shared reusable (replaces main-publish.yml).
  # release_created gates this vs publish, so they never both run on one push.
  edge:
    name: edge (:main image + helm)
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    uses: ./.github/workflows/publish.yml
    permissions:
      # Same grants as `publish` above: one reusable, one code path, only release_tag differs.
      # A reusable's job-level permissions cap against the caller's, so granting less than the
      # reusable declares fails the call — these cannot be trimmed for the edge path alone.
      # contents: write is genuinely unused here: both `gh release upload` steps in
      # container-publish are gated on `release-tag != ''`, which is empty on this path.
      contents: write        # (unused on the edge path — see above)
      packages: write        # push the :main image + main-snapshot Helm chart to GHCR
      id-token: write        # cosign keyless signing + provenance attestation
      attestations: write    # SLSA build provenance for the image
      security-events: write # Trivy SARIF upload
    with:
      release_tag: ""

  # Binaries via the shared GoReleaser reusable: cross-compiled binaries + checksums +
  # archive SBOMs + cosign signatures, uploaded to the release-please release. Images +
  # THIRD_PARTY_NOTICES are published by the `publish` job (container-publish reusable),
  # so this skips docker. pre-cmd waits for the just-created tag to be visible on the Go
  # module proxy (see below), then installs the pinned syft (archive SBOMs) + go-licenses
  # and regenerates the notices that .goreleaser.yaml bakes into the archives (extra_files).
  #
  # The proxy wait is NOT optional: .goreleaser.yaml sets `gomod.proxy: true`, so GoReleaser
  # rebuilds from proxy.golang.org + sum.golang.org rather than the checked-out tree, and this
  # job starts in the same second release-please creates the tag. v3.0.0 hit a sumdb 500 for a
  # tag 40s old and failed the release (#254); a re-run minutes later was green, unchanged.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # upload release assets
      id-token: write # keyless cosign signing
      # Declared by the reusable, so dropping it fails the call — but nothing uses it here.
      packages: write # required by the reusable; unused (--skip=docker; images are `publish`'s job)
      attestations: write # SLSA build provenance (.intoto.jsonl) attached to the release
    # v1.5.0 is the first shared release containing the checksums-locate fix (the attest step was
    # nondeterministically handed the cosign .sigstore.json bundle instead of SHA256SUMS — #176),
    # so this is no longer pinned to a floating @main SHA. Renovate maintains the bump from here.
    uses: rknightion/.github/.github/workflows/binaries.yml@a4182f2ed573c3b5015e195b797d1e96cf09a8bf # v1.5.0
    with:
      release-tag: ${{ needs.release-please.outputs.tag_name }}
      install-cosign: true
      goreleaser-args: "release --clean --skip=docker"
      # The tag is passed explicitly rather than left to the script's `git describe` fallback:
      # the reusable's checkout does not guarantee tags are fetched, and a guard that silently
      # no-ops is worse than no guard. Same value already passed as release-tag above.
      pre-cmd: "bash scripts/wait-for-module-proxy.sh '${{ needs.release-please.outputs.tag_name }}' && go install github.com/anchore/syft/cmd/syft@v1.18.1 && go install github.com/google/go-licenses@v1.6.0 && bash scripts/notices.sh"

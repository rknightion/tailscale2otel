name: grafana-sync

# Keep the m7kni Grafana stack in step with this repository's generated Grafana
# artifacts. Two deliberately different delivery paths:
#
#   dashboard -> a commit into rknightion/gc-gitsync-m7kni, because that repo is a
#                Grafana GitSync source and Grafana writes UI saves back into it. A
#                direct API push would create out-of-band edits and make the repo and
#                the stack diverge with no way to tell which is right.
#   rules     -> `gcx resources push`, because GitSync does not manage alert or
#                recording rules at all.
#
# Prune runs before push: `gcx resources push` is create-or-update only, so a rule
# deleted from the generator would otherwise keep evaluating forever.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/grafana/**'
      - 'deploy/alerts/**'
      - 'scripts/grafana-prune-rules.py'
      - '.github/workflows/grafana-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two syncs write the stack at once; never cancel one mid-write.
concurrency:
  group: grafana-sync
  cancel-in-progress: false

env:
  GCX_VERSION: '1.0.0'
  GCX_SHA256: 'c88c65958d19d83dc3a192a2a5037e08307a9c776019f24249b89f369c9c4d41'
  RULES_FOLDER: tailscale2otel

jobs:
  dashboards:
    name: publish dashboard to GitSync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # exchanged for a tailnet identity and an OpenBao token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The default GITHUB_TOKEN cannot write to another repository. This used to be
      # GITSYNC_PAT; that PAT was revoked in the 2026-08-08 secret sweep and this lane
      # was the one consumer the sweep missed, so it failed with `Bad credentials` for
      # two days while every other gate stayed green (gc-gitsync-m7kni#17).
      #
      # The minted token carries contents:write on gc-gitsync-m7kni ONLY — not on this
      # repository — and expires in an hour. contents:write is what a `git push` needs;
      # note this lane pushes commits rather than firing a repository_dispatch.
      - name: Mint a scoped GitSync token
        id: bao
        uses: rknightion/.github/.github/actions/broker-token@06d6727487515cd6628e01696af6f886f1421e04
        with:
          permission-set: gitsync
          # One shared permission set — all three publisher repos target the same hub
          # repo — but a role per repo to pin repository_id, so these names diverge and
          # `role` MUST be passed. Omitting it defaults the role to `gitsync`, which
          # does not exist, and auth/gha/login answers 400.
          role: gitsync-tailscale2otel
          tailscale-client-id: ${{ secrets.TS_WIF_CLIENT_ID }}
          tailscale-audience: ${{ secrets.TS_WIF_AUDIENCE }}

      - name: check out the GitSync repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rknightion/gc-gitsync-m7kni
          token: ${{ steps.bao.outputs.token }}
          path: gitsync

      # Each destination filename encodes that dashboard's UID, which is also its
      # `uid` in deploy/grafana/gen/dashboards.py. Renaming either side breaks the
      # GitSync identity and orphans the live dashboard.
      #
      # #526 split the single `tailscale2otel-overview` artifact into this pair.
      # Retiring the old live dashboard therefore means DELETING
      # networking/tailscale2otel-overview.json from the GitSync repo — a `gcx
      # dashboards delete` alone is undone by the next sync, which would simply
      # re-create it from the file still sitting there.
      # Publishes the CURRENT SET and removes any tailscale2otel-*.json that is no
      # longer in it, so retiring a dashboard is just deleting it from
      # deploy/grafana/. Without the prune, #526's rename would have left the old
      # `tailscale2otel-overview` file here forever, and GitSync would keep
      # re-creating the orphaned dashboard from it no matter how often it was
      # deleted through the API.
      - name: copy the generated dashboards into place
        run: |
          set -euo pipefail
          for src in deploy/grafana/tailscale2otel-*.json; do
            cp "$src" "gitsync/networking/$(basename "$src")"
          done
          for existing in gitsync/networking/tailscale2otel-*.json; do
            if [ ! -f "deploy/grafana/$(basename "$existing")" ]; then
              echo "retiring $(basename "$existing") — no longer generated"
              rm -f "$existing"
            fi
          done

      - name: commit and push
        working-directory: gitsync
        run: |
          set -euo pipefail
          # Stage FIRST, then diff the index. A bare `git diff` is blind to UNTRACKED
          # files, so when #526 renamed the single artifact into a pair the two new
          # filenames were invisible to it. This step reported "already matches" and
          # exited 0 on three consecutive runs while publishing nothing at all — a
          # green workflow that silently stopped doing its job. `git add -A` is
          # required for the same reason: `commit -am` stages modifications only.
          git add -A
          if git diff --cached --quiet; then
            echo "dashboards already match the stack source"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync tailscale2otel dashboards from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          # Grafana commits UI saves into this repo on its own, so a push can lose a
          # race with the stack. Rebase and retry rather than failing the sync.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "::error::could not push the dashboard to gc-gitsync-m7kni after 3 attempts"
          exit 1

  rules:
    name: publish alert and recording rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAFANA_SERVER: ${{ vars.GRAFANA_SERVER }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      GRAFANA_STACK_ID: ${{ vars.GRAFANA_STACK_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install gcx
        run: |
          set -euo pipefail
          curl -fsSL -o gcx.tgz \
            "https://github.com/grafana/gcx/releases/download/v${GCX_VERSION}/gcx_${GCX_VERSION}_linux_amd64.tar.gz"
          echo "${GCX_SHA256}  gcx.tgz" | sha256sum -c -
          tar -xzf gcx.tgz gcx
          sudo install -m 0755 gcx /usr/local/bin/gcx
          rm -f gcx gcx.tgz
          gcx version

      # The committed manifests are the shipped "recommended" profile — pushed as-is,
      # not regenerated, so what deploys is exactly what CI's drift gate checked.
      - name: list the rules this repository defines
        run: |
          set -euo pipefail
          python3 - > expected-rules.txt <<'PY'
          import glob, json
          for path in sorted(glob.glob("deploy/alerts/grafana-managed/*.json")):
              with open(path, encoding="utf-8") as fh:
                  doc = json.load(fh)
              if doc.get("kind") in ("AlertRule", "RecordingRule"):
                  print(doc["metadata"]["name"])
          PY
          echo "this repository defines $(wc -l < expected-rules.txt) rules"

      - name: prune rules the repository no longer defines
        run: |
          python3 scripts/grafana-prune-rules.py \
            --folder "${RULES_FOLDER}" \
            --keep-file expected-rules.txt

      # No --omit-manager-fields. The live rules already carry managedBy=kubectl /
      # managerId=gcx from how they were first pushed; stripping the manager fields
      # sends provenance '' against a stack that holds 'api' and 409s every rule.
      - name: push rules
        run: gcx resources push -p deploy/alerts/grafana-managed --on-error abort

name: Dependency review
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    uses: rknightion/.github/.github/workflows/dependency-review.yml@0e56520d848f5fda8cbfa0bda17797ef41f2a5a7 # v1.9.8

name: Dependency review
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    uses: rknightion/.github/.github/workflows/dependency-review.yml@5a2b8d059084a79d11c9675f2fd07abd7003f915 # v1.13.0

name: Dependency review
on:
  pull_request:
    branches: [main]
permissions: {}
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    permissions:
      contents: read
      pull-requests: write
    uses: rknightion/.github/.github/workflows/dependency-review.yml@658b37ea0def29f579ec5d9acb3d67d49bfe37f1 # v1.25.29

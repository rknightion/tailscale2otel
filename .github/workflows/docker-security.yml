name: Docker Security
on:
  push:
    branches: [main]
  schedule:
    - cron: '33 5 * * 2'
  workflow_dispatch:
permissions: {}
concurrency:
  group: docker-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-security:
    permissions:
      contents: read
      security-events: write
    uses: rknightion/.github/.github/workflows/docker-security.yml@8d14adaa295c4a7670b1d4e744b070955b710598 # v1.24.0

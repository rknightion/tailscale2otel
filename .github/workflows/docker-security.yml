name: Docker Security
on:
  push:
    branches: [main]
  schedule:
    - cron: '33 5 * * 2'
  workflow_dispatch:
permissions: {}
concurrency:
  group: docker-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-security:
    permissions:
      contents: read
      security-events: write
    uses: rknightion/.github/.github/workflows/docker-security.yml@d5995d27ca2ffc697f06e312c69541b149ab2fd7 # v1.25.27

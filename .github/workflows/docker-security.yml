name: Docker Security
on:
  push:
    branches: [main]
  schedule:
    - cron: '33 5 * * 2'
  workflow_dispatch:
permissions: {}
concurrency:
  group: docker-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-security:
    permissions:
      contents: read
      security-events: write
    uses: rknightion/.github/.github/workflows/docker-security.yml@f460d96cfd777d8e01066df655f4c157d4cf9332 # v1.31.1

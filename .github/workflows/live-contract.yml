name: Live API contract

on:
  schedule:
    - cron: "45 6 * * *" # Daily 06:45 UTC
  workflow_dispatch:

# AUTH: Workload Identity Federation. No Tailscale secret is stored in GitHub at all (#355).
#
# A header here previously said "there is no published OIDC->Tailscale-API action". That was
# WRONG, and it is why this lane carried a stored OAuth client for months. Tailscale supports
# federated identities directly: POST /api/v2/oauth/token-exchange takes a provider OIDC token
# and returns a short-lived API token. The federated identity is pinned to this repo by its
# issuer and `sub` claim, so possession of the client ID grants nothing on its own.
#
# TS_WIF_CLIENT_ID and TS_WIF_AUDIENCE are IDENTIFIERS, not credentials. They live in repo
# secrets only to keep tailnet identifiers out of tracked files; leaking either grants nothing
# without a GitHub-signed OIDC token whose `sub` matches
# repo:rknightion/tailscale2otel:ref:refs/heads/main.
#
# The lane stays schedule + workflow_dispatch only. That is no longer about protecting a stored
# secret, but the subject pin is anchored on refs/heads/main, so a fork-reachable trigger would
# simply fail the exchange — and `issues: write` below is still worth keeping away from forks.
#
# This also deliberately replaces an earlier design that kept creds off GitHub in the env of a
# dedicated self-hosted runner. That runner was never provisioned, so the lane queued forever
# and was auto-cancelled at 24h every week — it produced no signal at all between 413b314 and
# the fix (see #160). Standing a self-hosted runner up on a PUBLIC repo is also a risk GitHub
# warns against, since a fork PR can target it.
permissions:
  contents: read
  issues: write
  id-token: write # mint the GitHub OIDC token exchanged for a Tailscale API token

concurrency:
  group: live-contract
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # NEGATIVE CASE FIRST, so a broken exchange cannot be mistaken for a working one.
      #
      # Note what this can and cannot assert, and note that the status code depends on WHICH
      # thing is wrong — a distinction that only showed up once a real identity existed:
      #
      #   unknown client_id, or a malformed request  -> 400 "invalid request"
      #   valid client_id, token it must refuse      -> 403        (observed here)
      #
      # So the response does NOT leak which property of an otherwise-valid token failed, but it
      # does separate "no such client" from "this client refuses that token". What it will not
      # do is tell a wrong audience from a wrong issuer from an expired token, so #355's "wrong
      # audience/issuer/expired token fail predictably" is ONE assertion, not four: a token
      # this identity must refuse is refused, and no access_token comes back.
      - name: A wrong-audience token must be rejected
        env:
          TS_WIF_CLIENT_ID: ${{ secrets.TS_WIF_CLIENT_ID }}
        run: |
          set -euo pipefail
          [ -n "${TS_WIF_CLIENT_ID:-}" ] || { echo "secrets.TS_WIF_CLIENT_ID is unset" >&2; exit 1; }
          bad=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api.tailscale.com/not-this-identity" | jq -r '.value')
          echo "::add-mask::$bad"
          # Deliberately an `if`, not `A && B || C` — that idiom runs C when B is false as well
          # as when A is, so it is not if-then-else (shellcheck SC2015). Here the distinction
          # would be harmless, but a negative-case guard is the last place to leave a
          # control-flow shape that reads as something it is not.
          if [ -z "$bad" ] || [ "$bad" = "null" ]; then
            echo "GitHub did not mint the negative-case token" >&2
            exit 1
          fi

          code=$(curl -s -o /tmp/neg.json -w '%{http_code}' -X POST \
            'https://api.tailscale.com/api/v2/oauth/token-exchange' \
            --data-urlencode "client_id=${TS_WIF_CLIENT_ID}" --data-urlencode "jwt=${bad}")
          if [ "$code" = "200" ]; then
            echo "SECURITY: the exchange ACCEPTED a token minted for a different audience." >&2
            exit 1
          fi
          if jq -e '.access_token // empty' /tmp/neg.json >/dev/null 2>&1; then
            echo "SECURITY: a rejected exchange still returned an access_token." >&2
            exit 1
          fi
          echo "wrong-audience token rejected with HTTP $code, no access_token issued"

      - name: Exchange the GitHub OIDC token for a short-lived API token
        # Missing config is a misconfiguration of this lane, not a reason to pass quietly:
        # fail here rather than self-skipping, or the lane reports green having checked nothing.
        env:
          TS_WIF_CLIENT_ID: ${{ secrets.TS_WIF_CLIENT_ID }}
          TS_WIF_AUDIENCE: ${{ secrets.TS_WIF_AUDIENCE }}
          TS_TAILNET: ${{ vars.TS_TAILNET }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${TS_WIF_CLIENT_ID:-}" ] || missing="$missing secrets.TS_WIF_CLIENT_ID"
          [ -n "${TS_WIF_AUDIENCE:-}" ] || missing="$missing secrets.TS_WIF_AUDIENCE"
          [ -n "${TS_TAILNET:-}" ] || missing="$missing vars.TS_TAILNET"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || missing="$missing id-token:write"
          if [ -n "$missing" ]; then
            echo "live contract is misconfigured — unset:$missing" >&2
            exit 1
          fi

          # The audience is what binds this token to this federated identity; a token minted
          # for any other audience is refused by the exchange (proven by the step above).
          aud=$(jq -rn --arg a "$TS_WIF_AUDIENCE" '$a|@uri')
          jwt=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${aud}" | jq -r '.value')
          echo "::add-mask::$jwt"
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "GitHub returned no OIDC token — is id-token: write set on this job?" >&2
            exit 1
          fi

          token=$(curl -fsSL -X POST 'https://api.tailscale.com/api/v2/oauth/token-exchange' \
            --data-urlencode "client_id=${TS_WIF_CLIENT_ID}" \
            --data-urlencode "jwt=${jwt}" | jq -r '.access_token')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Workload identity exchange returned no access_token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "TS_API_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      # A token that mints is not a token that can READ. Rotating the federated identity on
      # 2026-08-08 produced one carrying only auth-key and tailnet-settings read, and the lane
      # reported that as 15 ops "live decode failed" with 403 — indistinguishable, at a glance,
      # from real API drift, and it filed a drift issue saying so every day (#552).
      #
      # So assert read scope BEFORE the contract runs, and fail with the actual cause. A 403
      # here is never drift: the endpoint answered, it just refused this identity. Devices is
      # the probe because `all:read` (and every narrower grant this lane needs) includes it,
      # and it is the resource ResolveLiveArgs needs to address the path-parameterized ops.
      - name: The minted token must carry read scope
        env:
          TS_TAILNET: ${{ vars.TS_TAILNET }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TS_API_ACCESS_TOKEN}" \
            "https://api.tailscale.com/api/v2/tailnet/${TS_TAILNET}/devices?fields=all")
          if [ "$code" = "200" ]; then
            echo "minted token can read tailnet devices (HTTP 200)"
            exit 0
          fi
          if [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "404" ]; then
            echo "The workload identity minted a token that cannot read this tailnet (HTTP ${code})." >&2
            echo "This is a MISCONFIGURED FEDERATED IDENTITY, not Tailscale API drift: grant the" >&2
            echo "identity behind secrets.TS_WIF_CLIENT_ID read scope (all:read) in the admin" >&2
            echo "console. Failing here rather than letting the contract report it as drift." >&2
            exit 1
          fi
          echo "unexpected HTTP ${code} probing tailnet devices" >&2
          exit 1

      - name: Run live contract
        id: live
        env:
          TS_TAILNET: ${{ vars.TS_TAILNET }}
        run: |
          set +e
          go test -tags live -run TestLiveContract ./internal/tsapi/contract/live/ -v > /tmp/live.log 2>&1
          code=$?
          set -e
          # The test t.Skip()s when the token or tailnet is empty, and a skip still exits 0.
          # The step above makes that unreachable, but if it ever happens again, a skip must
          # never look clean — "Resolve tracking issue" would close the drift issue on nothing.
          #
          # This grep stays a blunt "any --- SKIP fails the run" on purpose. The ops that
          # legitimately cannot run — the path-parameterized ones, when the tailnet holds no
          # device or Service to address them with (#424) — do NOT call t.Skip and so emit no
          # --- SKIP marker; they log NOT-APPLICABLE instead, which the next step surfaces in
          # the summary. So "--- SKIP" still means exactly one thing: this lane is misconfigured.
          if grep -q -- '--- SKIP' /tmp/live.log; then
            echo "live contract skipped despite passing preflight — refusing to report it clean." >&2
            code=1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Summarize which ops were exercised
        # A bare green tells you nothing about coverage: if an op silently stopped being
        # exercised, the lane would still pass. List what actually ran, on pass and on fail.
        if: steps.live.outputs.code != ''
        run: |
          set -euo pipefail
          {
            echo "## Live Tailscale API contract — tailnet \`${TS_TAILNET}\`"
            echo
            echo "| op | result | time |"
            echo "| --- | --- | --- |"
            # e.g. "    --- PASS: TestLiveContract/listUsers (0.02s)"
            sed -nE 's#^ +--- (PASS|FAIL|SKIP): TestLiveContract/([A-Za-z0-9_]+) \((.*)\)$#| \2 | \1 | \3 |#p' \
              /tmp/live.log
            echo
            n=$(grep -cE '^ +--- (PASS|FAIL|SKIP): TestLiveContract/' /tmp/live.log || true)
            echo "${n} op(s) exercised against the live API."

            # Ops that could not run because this tailnet holds no resource to address
            # them with (#424). These deliberately emit no "--- SKIP" marker, so without
            # this section they would vanish silently — which is the same "green having
            # checked nothing" failure the SKIP guard above exists to prevent.
            na=$(grep -cE 'NOT-APPLICABLE: ' /tmp/live.log || true)
            if [ "${na}" -gt 0 ]; then
              echo
              echo "### Skipped: no suitable resource"
              echo
              echo "| op | reason |"
              echo "| --- | --- |"
              sed -nE 's#^.*NOT-APPLICABLE: ([A-Za-z0-9_]+) :: (.*)$#| \1 | \2 |#p' /tmp/live.log
              echo
              sed -nE 's#^.*NOT-APPLICABLE-RESOURCE: ([a-z-]+) :: (.*)$#- **\1** — \2#p' /tmp/live.log
              echo
              echo "${na} op(s) skipped: no suitable resource in this tailnet."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TS_TAILNET: ${{ vars.TS_TAILNET }}

      - name: Build report
        if: steps.live.outputs.code != '0' && steps.live.outputs.code != ''
        env:
          TS_TAILNET: ${{ vars.TS_TAILNET }}
        run: |
          set -euo pipefail
          # The test already routes every error through contract.SanitizeEvidence, but this
          # report goes into a PUBLIC issue, so strip the tailnet name from anything the Go
          # test harness itself printed (panics, file:line banners) as a second line of
          # defence. Literal replacement via python3 — no regex metacharacter escaping to
          # get wrong, and the tailnet name is read from the environment, never interpolated
          # into the script.
          python3 -c 'import os,sys; t=os.environ.get("TS_TAILNET","").strip(); d=sys.stdin.read(); sys.stdout.write(d.replace(t,"[redacted]") if t else d)' \
            < /tmp/live.log > /tmp/live.sanitized.log
          {
            echo "## Live Tailscale API contract failures"
            echo
            echo '```'
            tail -c 8000 /tmp/live.sanitized.log
            echo '```'
          } > /tmp/live.md

      - name: Report + fail
        if: steps.live.outputs.code != '0' && steps.live.outputs.code != ''
        uses: ./.github/actions/report-drift
        with:
          lane-label: live-contract
          title: "Live Tailscale API contract failing"
          report-path: /tmp/live.md
          # This lane executes only our own code (read-only API calls), so enrichment is safe.
          # Provide EITHER ANTHROPIC_API_KEY (pay-per-use) or CLAUDE_CODE_OAUTH_TOKEN (Max sub).
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Resolve tracking issue on clean run
        # Only when the contract actually ran and passed. A failed mint step leaves code empty,
        # and a skipped test is forced to code=1 above — neither proves anything.
        if: steps.live.outputs.code == '0'
        uses: ./.github/actions/resolve-drift
        with:
          lane-label: live-contract

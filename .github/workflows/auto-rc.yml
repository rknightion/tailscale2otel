# Automatic release candidates. When CI concludes green on main, cut
# vX.Y.Z-rc.N against the version release-please is already staging in its open
# release PR, then publish the image, chart and binaries for it.
#
# The stable release path (release-please.yml) is untouched: it still opens and
# maintains the release PR, and a stable release still requires an explicit
# merge. The RC path never writes to the changelog or the release PR.
name: auto-rc

# Fires off CI's completion rather than the push itself. The old `push:` trigger
# started this workflow immediately and then burned a runner slot in
# `rc / wait-for-ci` polling for a CI run that was still queued behind it —
# measured fleet-wide at 20.6 runner-hours of pure polling, and 5 of 17 in-flight
# jobs at one sample. workflow_run fires only once CI has a verdict, so there is
# nothing to wait for.
#
# `workflows:` matches CI's `name:` field, not its filename. If ci.yml is ever
# renamed, this silently stops firing and RCs stop being cut with no error.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancel a half-published RC; serialize instead.
  group: auto-rc
  cancel-in-progress: false

jobs:
  rc:
    # workflow_run fires for FAILED and cancelled runs too, so the conclusion
    # check is what actually gates the RC on green CI.
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write      # create the RC tag and the GitHub prerelease
      pull-requests: read  # find the open release-please PR
      # Still required even though wait-for-ci is skipped in this mode: GitHub
      # validates a reusable workflow's job permissions at STARTUP, before any
      # `if:` is evaluated. The reusable keeps wait-for-ci for push-triggered
      # callers, so dropping this here is a startup_failure with zero jobs.
      checks: read
    uses: rknightion/.github/.github/workflows/auto-rc.yml@ff43f62eaec9f41d49b9a208d86b2eb932c97056 # v1.18.1
    with:
      # Under workflow_run, github.sha is the DEFAULT BRANCH HEAD, not the
      # commit CI ran on — it races ahead on rapid pushes. head_sha is the
      # commit the triggering run actually tested.
      sha: ${{ github.event.workflow_run.head_sha }}
      image-ref: ghcr.io/rknightion/tailscale2otel

  # Same image + chart path a stable release takes, just with an RC tag.
  # container-publish suppresses `latest` for any tag containing '-', so an RC
  # can never steal Latest from a stable release.
  publish:
    needs: rc
    if: needs.rc.outputs.tag != ''
    permissions:
      contents: write        # attach SBOMs + notices to the RC release
      packages: write        # push the image and chart to GHCR
      id-token: write        # cosign keyless signing
      attestations: write    # SLSA build provenance
      security-events: write # Trivy SARIF upload
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.rc.outputs.tag }}

  # Proxy-ingestion gate. It exists so an RC whose tag proxy.golang.org has not
  # ingested yet is SKIPPED rather than failed.
  #
  # .goreleaser.yaml sets gomod.proxy: true, so the build downloads the module
  # from proxy.golang.org and verifies it against sum.golang.org instead of
  # using the checked-out tree. That makes every RC race sumdb ingestion of a
  # tag created seconds earlier, and ingestion latency is not something this
  # repository controls: v5.0.0-rc.10 landed inside wait-for-module-proxy.sh's
  # 300s default and rc.11, cut 29 minutes later, took about 14 minutes and
  # failed the binaries job. A plain re-run went green with no code change.
  #
  # Why a gate and not `continue-on-error`. actionlint rejects that key on a
  # job that calls a reusable workflow with `uses:` - only name, uses, with,
  # secrets, needs, if and permissions are allowed there - so the decision has
  # to be made before the call. The gate is also the better shape: infrastructure
  # lag skips, while a genuine goreleaser or cosign regression still turns the
  # run red, which is signal worth keeping.
  #
  # This is a cheap job polling in place of an expensive one. The binaries job
  # ran the same wait inside the goreleaser matrix, so this holds no more runner
  # time than before at the same timeout, and it is the job to lengthen if the
  # window ever needs to grow.
  #
  # release-please.yml's binaries job is deliberately UNCHANGED: it still hard
  # fails, because a real release missing its archives is the failure that
  # actually costs something (#174 lost every v2.0.0 archive that way).
  proxy:
    needs: rc
    if: needs.rc.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.wait.outputs.ready }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for the RC tag on the module proxy
        id: wait
        env:
          TAG: ${{ needs.rc.outputs.tag }}
        run: |
          if bash scripts/wait-for-module-proxy.sh "$TAG"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$TAG is not on the module proxy yet, so the RC binaries were skipped. Re-run this workflow once it is; no code change is needed."
          fi

  # goreleaser-args and pre-cmd are copied VERBATIM from release-please.yml's
  # binaries job (tag reference adapted to this workflow's `rc` job output).
  # .goreleaser.yaml sets gomod.proxy: true, so GoReleaser rebuilds from
  # proxy.golang.org/sum.golang.org rather than the checked-out tree; the
  # wait-for-module-proxy.sh guard keeps this job from racing sumdb ingestion of
  # the RC tag the same way it does for stable releases.
  #
  # `proxy` below decides whether this job runs at all, so an RC whose tag the
  # module proxy has not ingested SKIPS rather than fails.
  binaries:
    needs: [rc, proxy]
    if: needs.rc.outputs.tag != '' && needs.proxy.outputs.ready == 'true'
    permissions:
      contents: write     # upload binaries + checksums to the RC release
      id-token: write     # cosign keyless signing
      packages: write     # goreleaser reads the registry for existing artifacts
      attestations: write # SLSA build provenance on the archives
    uses: rknightion/.github/.github/workflows/binaries.yml@ff43f62eaec9f41d49b9a208d86b2eb932c97056 # v1.18.1
    with:
      release-tag: ${{ needs.rc.outputs.tag }}
      install-cosign: true
      goreleaser-args: "release --clean --skip=docker"
      pre-cmd: "bash scripts/wait-for-module-proxy.sh '${{ needs.rc.outputs.tag }}' && go install github.com/anchore/syft/cmd/syft@v1.18.1 && go install github.com/google/go-licenses@v1.6.0 && bash scripts/notices.sh"

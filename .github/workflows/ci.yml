name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The acceptance-evidence check reads the pull request body, so it runs in pr-metadata.yml;
    # a body edit does not re-run this workflow.
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    timeout-minutes: 20
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - name: Check justfile formatting
        run: just --fmt --check

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: just vet .

      - name: go build
        run: just build .

      - name: go test -race
        run: just test

      - name: Render configuration reference
        run: just config-reference-render

      # The root module gets the same tidy-diff as the tool modules (#437): three
      # of its requirements were marked `// indirect` while being imported
      # directly, which nothing caught. `go mod tidy` is a pure function of the
      # source, so any diff is drift. It does NOT move versions — the OTEL
      # lockstep pins in CLAUDE.md are unaffected by it.
      - name: go mod tidy leaves no diff
        run: just tidy-check .

  # All five modules in one job (#1145). Every lint step runs after an earlier
  # module fails, so one run reports every module. gofmt/goimports are enforced
  # here via the `formatters` block in .golangci.yml. The root step owns the
  # shared lint cache; internal/ci guards each module root.
  lint:
    timeout-minutes: 20
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/configcheck/go.sum
            tools/metricscatalog/go.sum
            tools/apidrift/go.sum
            tools/promqlcheck/go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - id: pins
        run: |
          version=$(just --evaluate golangci_version)
          if [[ -z "${version//[[:space:]]/}" ]]; then
            echo "golangci version pin is empty" >&2
            exit 1
          fi
          echo "golangci=$version" >> "$GITHUB_OUTPUT"

      - name: golangci-lint (.)
        if: ${{ !cancelled() && steps.pins.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.pins.outputs.golangci }}
          working-directory: .

      - name: golangci-lint (tools/configcheck)
        if: ${{ !cancelled() && steps.pins.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.pins.outputs.golangci }}
          working-directory: tools/configcheck
          skip-cache: true

      - name: golangci-lint (tools/metricscatalog)
        if: ${{ !cancelled() && steps.pins.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.pins.outputs.golangci }}
          working-directory: tools/metricscatalog
          skip-cache: true

      - name: golangci-lint (tools/apidrift)
        if: ${{ !cancelled() && steps.pins.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.pins.outputs.golangci }}
          working-directory: tools/apidrift
          skip-cache: true

      - name: golangci-lint (tools/promqlcheck)
        if: ${{ !cancelled() && steps.pins.outcome == 'success' }}
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.pins.outputs.golangci }}
          working-directory: tools/promqlcheck
          skip-cache: true

  # Per-module verification for the CI-only tool modules, packed into one job (#1145).
  #
  # There is no go.work, ON PURPOSE: each tool module is a separate go.mod so it
  # never affects the main module's `go build ./...`. Nothing run from the
  # repository root reaches them, so this job names each one. The root module has
  # its own build-test and govulncheck jobs.
  #
  # Each module runs in its own scratch worktree because a failed `go mod tidy`
  # rewrites go.mod in place. Tidy runs last in each step, every command runs even
  # after an earlier failure, and internal/ci guards every module and command.
  module-verify:
    timeout-minutes: 30
    name: verify (tool modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            tools/configcheck/go.sum
            tools/metricscatalog/go.sum
            tools/apidrift/go.sum
            tools/promqlcheck/go.sum

      - name: install govulncheck (pinned)
        run: go install "golang.org/x/vuln/cmd/govulncheck@$(just --evaluate govulncheck_version)"

      - name: create one scratch worktree per module
        id: scratch
        run: |
          for module in configcheck metricscatalog apidrift promqlcheck; do
            git worktree add --detach "$RUNNER_TEMP/verify/$module" HEAD
          done

      - name: verify tools/configcheck
        if: ${{ !cancelled() && steps.scratch.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/verify/configcheck
        run: |
          status=0
          just test-modules tools/configcheck || status=1
          just vet tools/configcheck || status=1
          just vuln tools/configcheck || status=1
          just tidy-check tools/configcheck || status=1
          exit "$status"

      - name: verify tools/metricscatalog
        if: ${{ !cancelled() && steps.scratch.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/verify/metricscatalog
        run: |
          status=0
          just test-modules tools/metricscatalog || status=1
          just vet tools/metricscatalog || status=1
          just vuln tools/metricscatalog || status=1
          just tidy-check tools/metricscatalog || status=1
          exit "$status"

      - name: verify tools/apidrift
        if: ${{ !cancelled() && steps.scratch.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/verify/apidrift
        run: |
          status=0
          just test-modules tools/apidrift || status=1
          just vet tools/apidrift || status=1
          just vuln tools/apidrift || status=1
          just tidy-check tools/apidrift || status=1
          exit "$status"

      - name: verify tools/promqlcheck
        if: ${{ !cancelled() && steps.scratch.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/verify/promqlcheck
        run: |
          status=0
          just test-modules tools/promqlcheck || status=1
          just vet tools/promqlcheck || status=1
          just vuln tools/promqlcheck || status=1
          just tidy-check tools/promqlcheck || status=1
          exit "$status"

  docs-catalog:
    timeout-minutes: 10
    name: docs/metrics.md is generated from the code catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: tools/metricscatalog/go.sum

      # Fail if the generated metric/log tables in docs/metrics.md drift from the
      # in-code telemetry catalog. Regenerate with `go run ./tools/metricscatalog
      # -write` (from the repo root) and commit the result.
      # Every --set key and TS2OTEL_* variable in a documented install command
      # must resolve against the chart schema and the env-var reference (#445).
      # Helm accepts an unknown --set path silently and the config loader ignores
      # an unknown variable, so a typo in the quick start does not fail — it
      # installs something subtly different and surfaces later as a confusing
      # runtime error. The README shipped exactly that for months: `secrets.*`
      # against a chart whose key is `secret`, which installed with no
      # credentials at all.
      - name: generated catalog and documented commands are in sync
        run: just docs-check

  # deploy/grafana/tailscale2otel.json and deploy/alerts/tailscale2otel.grafana-rules.yaml
  # are GENERATED from their stdlib-Python generators, and were the only generated
  # artifacts in the repository with no drift gate — the four under docs/ and the
  # chart have had one for a while (#438). Both generators are deterministic (no
  # time, random or set-ordering source), so regenerating on a clean tree is a
  # no-op and any diff here is real drift.
  #
  # Nothing under deploy/grafana or deploy/alerts is hand-maintained any more: the
  # four legacy classic-schema dashboards and the Prometheus-ruler rules file were
  # both deleted (#394), precisely because being excluded from this gate let them
  # rot unnoticed for months.
  dashboards-drift:
    timeout-minutes: 15
    name: generated dashboards and rules are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # For promqlcheck, below. It is a separate module, so it needs its own
      # go.sum for the cache key.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: tools/promqlcheck/go.sum

      # The two Python generators ship real unittest suites that CI never ran:
      # nothing in .github/, scripts/ or .githooks/ referenced them, so they only
      # executed if someone happened to invoke them by hand (#481). They run before
      # the drift check on purpose — a generator logic regression should fail on its
      # own terms with a named assertion, not as an opaque 1 MB artifact diff.
      #
      # scripts/ joined them for the release-completeness gate (#442): that gate
      # only ever executes during a release, so without a PR-time test its own
      # logic would be exercised for the first time at the exact moment it is
      # relied upon.
      - name: generator unit tests
        run: just test-python

      - name: generated dashboard and rule artifacts are in sync
        run: just gen-check

      # promtool parses every PromQL expression and validates the rule structure,
      # which no Go-side check does: the reference tests in internal/catalog check
      # that the metric NAMES exist, not that the expressions are syntactically
      # valid PromQL. Only the Prometheus-format file is checkable this way —
      # promtool does not understand Grafana's provisioning schema.
      # promtool cannot be `go install`ed (the prometheus module carries replace
      # directives, which go install refuses), so `just install-promtool` fetches the
      # release tarball and verifies it against that release's own published
      # sha256sums.txt rather than a checksum copied into a file. The version pin
      # lives in the justfile (`promtool_version`), the one place `just setup` also
      # reads, so CI and a contributor's machine cannot drift apart.
      - name: install promtool (pinned)
        run: |
          just install-promtool
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # promtool only understands the plain Prometheus rules file. promqlcheck
      # parses the dashboard's 400+ panel queries and the Grafana provisioning
      # rules with the same Prometheus parser, and additionally fails on a
      # reference to an undeclared template variable — a typo class no regex or
      # name-existence check can see (#407). It cannot validate LogQL or TraceQL
      # syntax: Loki's parser package pulls 583 modules and does not compile
      # outside its own repo, so those are counted and reported unparsed rather
      # than silently skipped.
      - name: promqlcheck (dashboard + rule expressions)
        run: just promql

      # `check rules` only proves the expressions parse. These execute them
      # against synthetic series and assert what actually fires — the only way to
      # catch a rule that is valid PromQL and semantically wrong (#407). The cases
      # that matter are the ones a syntax check cannot reach: absent() coverage,
      # counter resets across a restart, multi-tailnet label preservation, and
      # "healthy zero" versus "absent" on a feature probe.
      - name: promtool check and test rules
        run: just rules-check

  govulncheck:
    timeout-minutes: 10
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck (pinned)
        run: go install "golang.org/x/vuln/cmd/govulncheck@$(just --evaluate govulncheck_version)"

      - name: govulncheck
        run: just vuln .

  goreleaser-snapshot:
    timeout-minutes: 20
    name: goreleaser build (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # Cross-compile every target + build archives/checksums. .goreleaser.yaml has
      # no docker pipeline (the real image build is deploy/Dockerfile via
      # publish.yml/container-publish.yml), so no docker/qemu/syft is needed here;
      # the image is smoke-tested by docker-build below and fully built, pushed,
      # and signed by the `publish` job in release-please.yml.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.20.3"
          args: release --snapshot --clean --skip=publish,sign,sbom

  docker-build:
    timeout-minutes: 25
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Lives in this job on purpose: it already has a checkout, Docker and buildx, and
      # the job is already in ci-success's `needs`, so the gate becomes blocking WITHOUT
      # editing the branch ruleset (a renamed required check has stalled every bot PR in
      # this repo before). Safe ahead of the image build: the probe plants disposable
      # sentinels removed by an EXIT trap, and runs --no-cache -o type=cacheonly with no
      # cache-to, so it cannot pollute the layer cache below.
      - name: repository secret-hygiene gate (.gitignore + Docker build context)
        env:
          HYGIENE_REQUIRE_DOCKER: "1"
        run: just hygiene

      # Nothing in CI ever resolved the Compose assets — this job builds from the
      # Dockerfile directly, so a broken docker-compose.yaml could not fail
      # anything. It shipped broken: the file told operators to uncomment a
      # SECOND `volumes:` key for file-backed config, which Compose rejects
      # outright (#333). Lives in this job for the same reason the hygiene gate
      # above does — it already has a checkout and Docker, and is already in
      # ci-success's `needs`, so the gate is blocking without a ruleset edit.
      # --self-test mutates the resolved documents to prove the assertions can
      # fail; a checker never shown to fail proves nothing.
      - name: Compose assets resolve in both default and file-backed modes
        run: just compose-check

      # Resolves the same Go version other jobs get from go-version-file: go.mod,
      # for use in the cache key below. cache: false — this job never runs `go`
      # directly, so there is no module cache to save here.
      - name: Determine Go version
        id: goversion
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      # The Dockerfile's `go build` step uses a BuildKit cache mount for the Go
      # build cache (/root/.cache/go-build). type=gha layer cache does NOT carry
      # cache-mount contents across runs, so restore/save it via actions/cache and
      # let buildkit-cache-dance inject it into (and extract it from) the build.
      # Keyed on content (Go version + go.sum) rather than github.sha, so a run
      # with an unchanged dependency set restores the previous run's cache exactly
      # instead of always missing and re-saving the full cache.
      - name: Restore Go build cache for Docker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: go-build-cache
          key: ${{ runner.os }}-docker-go-build-${{ steps.goversion.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-docker-go-build-${{ steps.goversion.outputs.go-version }}-
            ${{ runner.os }}-docker-go-build-
      - name: Inject Go build cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "go-build-cache": "/root/.cache/go-build"
            }

      - name: build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: tailscale2otel:ci
          load: true
          # Layer cache (base image, go.mod copy, go mod download) across runs.
          # cache-to only on push to main — a PR run reads the trunk cache but
          # never writes it, so an untrusted PR build can't poison it.
          cache-from: type=gha,scope=ci-smoke
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=ci-smoke' || '' }}
          build-args: |
            VERSION=ci-${{ github.sha }}

      # Mirrors container-publish's Trivy scan policy (publish.yml passes trivy-ignore-unfixed: true);
      # both steps must move together.
      - name: Scan image with publish vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNORE_UNFIXED: "true"
        with:
          image-ref: tailscale2otel:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          cache: false
          format: table

      # The render guard above catches Compose-asset drift. This starts the
      # actual Compose service against the image just built, local stdout
      # delivery and disposable file secrets, then waits for its binary health
      # check; it proves the supported deployment path starts rather than only
      # parsing it.
      - name: Compose stack starts healthy with file-based secrets
        run: just smoke tailscale2otel:ci

  # Test coverage -> Codacy. Deliberately NOT in ci-success's `needs`: coverage reporting is
  # informational, so a Codacy outage — or a fork PR with no secret — must never block merges or
  # Renovate automerge. Builds a coverage profile over the root module and uploads it via the
  # pinned official reporter action (no curl|bash, which zizmor flags as a remote-script hazard).
  coverage:
    # push-only, for the same reason as `fuzz` below: informational, outside
    # ci-success, and one more job competing for the account-wide 20-slot cap on
    # every PR. Codacy's project coverage is a trunk number anyway — reporting it
    # once per merge is the signal, not once per Renovate bump.
    if: github.event_name == 'push'
    timeout-minutes: 15
    name: coverage (Codacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # zizmor: ignore[cache-poisoning] - no artifacts published or credentials held while cached or dependency code runs
          cache: true

      - name: go test (coverage profile)
        run: just coverage

      - name: Check for a Codacy upload token
        id: codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [[ -n "$CODACY_PROJECT_TOKEN" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codacy
        if: steps.codacy.outputs.present == 'true'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.out
          force-coverage-parser: go

  # Bounded exploratory fuzzing of the untrusted-input decode paths: the HEC receiver's
  # envelope parser (its body is attacker-reachable — the token is optional), the flow/audit
  # record decoders, whose wire format is polymorphic by design, the webhook batch decode and
  # its dedup digest, and the OpenAPI parser/classifier — which reads the LIVE spec fetched
  # from api.tailscale.com, so that document is untrusted input too (#434).
  #
  # 120s per target finds shallow crashers and nothing else. The deeper search is
  # fuzz-scheduled.yml, weekly, where a nondeterministic finding costs nobody a blocked merge.
  #
  # Runs on push to main only. Being outside ci-success means no merge can wait on it, so on a
  # pull request it was pure draw against the account-wide 20-job cap — 9 legs on each of a
  # Renovate batch's PRs, starving the very queue automerge needed to drain.
  #
  # Deliberately NOT in ci-success. Each target's SEED corpus already runs inside the normal
  # `go test -race ./...` leg, so a known crasher always gates a merge; this job only explores
  # for NEW ones, which is nondeterministic. Gating on it would let an unrelated PR randomly trip
  # a latent crasher and block Renovate automerge. A failure here is a real bug — read the log.
  fuzz:
    # push-only. This gates nothing (see the note above), and on GitHub Free the
    # whole fleet shares ONE pool of 20 concurrent runner jobs — a 9-leg matrix on
    # every Renovate PR starved the queue that automerge needs in order to drain it.
    # Post-merge is where an advisory signal belongs; the deep search is weekly.
    # internal/ci.TestNonGatingCILanesDoNotRunOnPullRequests holds this.
    if: github.event_name == 'push'
    timeout-minutes: 15
    name: fuzz (${{ matrix.package }} ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/stream
            target: FuzzExtractRecords
          - package: ./internal/stream
            target: FuzzParseHECTime
          - package: ./internal/flowlog
            target: FuzzProcessorProcessAll
          - package: ./internal/audit
            target: FuzzProcessorProcessAll
          - package: ./internal/webhook
            target: FuzzDecodeAcceptedBatch
          - package: ./internal/webhook
            target: FuzzCanonicalDigest
          - package: ./internal/oas
            target: FuzzParseSpec
          - package: ./internal/oas
            target: FuzzClassifySelfDiff
          - package: ./internal/oas
            target: FuzzClassifyAgainstVendored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # zizmor: ignore[cache-poisoning] - test-only job, does not publish artifacts
          cache: true

      - name: go test -fuzz ${{ matrix.target }}
        env:
          PKG: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: |
          # Steps run under `bash -eo pipefail`, so guard the failure with `|| code=$?` —
          # a bare `go test` failure would otherwise abort the step before we can classify it.
          code=0
          go test "$PKG" -run '^$' -fuzz "^${TARGET}\$" -fuzztime=120s 2>&1 | tee /tmp/fuzz.log || code=$?
          [ "$code" -eq 0 ] && exit 0

          # A genuine finding ALWAYS writes the input out and says so. Check this first, so a
          # crasher can never be swallowed by the tolerance below.
          if grep -q "Failing input written to" /tmp/fuzz.log; then
            echo "::error::${TARGET}: fuzzing found a crasher — see the uploaded corpus artifact"
            exit 1
          fi

          # Upstream Go race, benign: on -fuzztime expiry the coordinator calls stop(ctx.Err())
          # with DeadlineExceeded, which internal/fuzz suppresses only if it == fuzzCtx.Err().
          # A parent context closes its own done channel BEFORE propagating cancellation to its
          # children, so if the coordinator wakes in that window fuzzCtx.Err() is still nil, the
          # comparison misses, and a clean timeout is reported as a test failure. Nothing was
          # found — the run simply ran out its clock. Contended runners widen the window.
          if grep -qE '^[[:space:]]*context deadline exceeded[[:space:]]*$' /tmp/fuzz.log; then
            echo "::warning::${TARGET}: benign -fuzztime shutdown race in Go's fuzzing runtime (no crasher found) — not failing"
            exit 0
          fi

          exit "$code"

      # A crasher is written to testdata/corpus/<target>/ — surface it so the failing input can be
      # committed as a regression seed rather than being lost with the runner.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ matrix.target }}-${{ strategy.job-index }}
          path: ${{ matrix.package }}/testdata/corpus/**
          if-no-files-found: ignore

  # The lines a pull request adds carry no identifier, email address, public address or credential
  # shape. Pull requests only. Check run: `privacy-sweep / Privacy sweep`.
  privacy-sweep:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/privacy-sweep.yml@2408a41ab6687e377b7988063a6ed2c30b91e61d # v1.32.9

  # The Backlog.md board is retired: issues are the queue. A pull request may delete files under
  # backlog/ or move them out, never add or change one there. Reads the file list from the API, so
  # no pull request code is checked out.
  backlog-freeze:
    name: backlog/ is frozen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Refuse additions and changes under backlog/
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error title=backlog freeze::the pull request number or file count is malformed"
            exit 1
          fi
          # The pull request files API lists at most 3000 files; refuse rather than check part of a change.
          if (( CHANGED_FILES > 3000 )); then
            echo "::error title=backlog freeze::${CHANGED_FILES} changed files is more than the API lists; split the pull request"
            exit 1
          fi
          offending="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[] | select(.status != "removed") | select(.filename | startswith("backlog/")) | "\(.status) \(.filename | @json)"')"
          if [[ -n "$offending" ]]; then
            echo "::error title=backlog freeze::this pull request adds or changes files under backlog/; the board is retired, so file the work as an issue"
            printf '  %s\n' "$offending"
            exit 1
          fi
          echo "No file under backlog/ is added or changed."

  actionlint:
    permissions:
      contents: read
    uses: rknightion/.github/.github/workflows/actionlint.yml@2408a41ab6687e377b7988063a6ed2c30b91e61d # v1.32.9

  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: rknightion/.github/.github/workflows/dependency-review.yml@2408a41ab6687e377b7988063a6ed2c30b91e61d # v1.32.9

  # zizmor fails a pull request on any finding (enforce); push runs upload SARIF instead.
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rknightion/.github/.github/workflows/zizmor.yml@2408a41ab6687e377b7988063a6ed2c30b91e61d # v1.32.9
    with:
      enforce: true

  # Single required status check for this workflow. Branch protection on `main` requires this
  # (alongside helm.yml's `helm-success`), so CI legs can be added or renamed without re-touching
  # protection. Fails if any leg failed, was cancelled or was skipped. Renovate's automerge waits for this to go green.
  ci-success:
    timeout-minutes: 5
    name: ci-success
    runs-on: ubuntu-latest
    if: always()
    needs: [build-test, lint, module-verify, docs-catalog, dashboards-drift, govulncheck, goreleaser-snapshot, docker-build, privacy-sweep, backlog-freeze, actionlint, dependency-review, zizmor]
    steps:
      - name: Fail unless every required job succeeded
        id: gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failures=$(jq -r --arg event "$EVENT_NAME" '
            to_entries[]
            | select(.value.result != "success" and (.value.result != "skipped" or $event == "pull_request" or (.key != "privacy-sweep" and .key != "backlog-freeze" and .key != "dependency-review")))
            | "\(.key)=\(.value.result)"
          ' <<< "$NEEDS_JSON")
          if [[ -n "$failures" ]]; then
            printf '%s\n' "$failures"
            exit 1
          fi
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ', ') }}
        run: echo "ci-success - ${RESULTS}"

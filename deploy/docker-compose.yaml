# Minimal docker-compose for tailscale2otel.
#
# Usage:
#   1. Put your secrets in deploy/.env — the file next to THIS compose file, e.g.:
#        TS2OTEL_TAILSCALE__TAILNET=example.com
#        TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_ID=...
#        TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_SECRET=...
#        TS2OTEL_OTLP__GRAFANA_CLOUD__INSTANCE_ID=...
#        TS2OTEL_OTLP__GRAFANA_CLOUD__TOKEN=...
#   2. docker compose -f deploy/docker-compose.yaml up
#
# deploy/.env is the ONE canonical credential file for Compose. Compose loads its
# env file from the PROJECT directory — the directory holding the compose file —
# not from your shell's cwd, so `docker compose -f deploy/docker-compose.yaml`
# reads deploy/.env whichever directory you run it from. A `.env` at the
# repository root is NOT read on that command line; point at one explicitly with
# `--env-file` if you keep credentials elsewhere.
#
# deploy/.env is git-ignored (.gitignore) AND excluded from the Docker build
# context (.dockerignore). Those are two separate boundaries — Docker never reads
# .gitignore — and scripts/check-secret-hygiene.sh gates both.
#
# The container runs from built-in defaults + TS2OTEL_* environment variables.
# No config file is required — secrets are injected purely via env vars.
#
# To use a config file instead (or in addition), add the override file:
#   docker compose -f deploy/docker-compose.yaml \
#                  -f deploy/docker-compose.config.yaml up
# See deploy/docker-compose.config.yaml for why it is a separate file.
services:
  tailscale2otel:
    # The PUBLISHED image, pinned to a real release. Deliberately no `build:`
    # here: with both, `up` pulls the published image while `up --build` tags a
    # working tree as that same name, and nothing afterwards can tell the two
    # apart — the shipped header said `up --build` while the docs said `up`
    # (#335). Local builds live in docker-compose.dev.yaml.
    # Override the tag with TS2OTEL_VERSION (e.g. TS2OTEL_VERSION=latest, or a
    # digest-pinned ref). The default tracks the current release automatically:
    # release-please rewrites the line below on every release.
    image: ghcr.io/rknightion/tailscale2otel:${TS2OTEL_VERSION:-4.0.1} # x-release-please-version
    restart: unless-stopped
    # Shutdown is STAGED and each stage is separately bounded in the binary:
    # the receivers drain already-ACKed requests (10s), the ingress WAL does one
    # final drain (10s), then the OTLP pipeline flushes and shuts down (10s), and
    # the flow stores close concurrently under one shared wait budget (10s) —
    # 40s worst case, plus headroom. Compose's default is 10s, which SIGKILLs
    # the process partway through the first stage and loses the final flow
    # rollup, the WAL backlog and the last export (#332). Running the image with
    # plain `docker run` instead? Pass --stop-timeout 55; its default is also 10.
    # internal/app fails the build if this stops covering the drain.
    stop_grace_period: 55s
    # Hard memory ceiling (matches the Helm chart default). GOMEMLIMIT below sits
    # ~10% under this so the Go GC backs off before the cgroup OOM-kills the process.
    mem_limit: 256m
    # Image is distroless+nonroot already; these enforce it at the daemon level.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The binary itself is the health check (#337): the runtime image is
    # distroless (no shell, no curl), so this has to be the exec form calling
    # the binary directly, never CMD-SHELL. -healthcheck probes THIS
    # container's own admin /readyz over loopback and exits 0/1/2 (ready/
    # unready/unreachable), which Docker maps to healthy/unhealthy.
    # This block and TS2OTEL_ADMIN__ENABLED below move TOGETHER: admin.enabled
    # is what serves /readyz at all, so setting that env var to false removes
    # the readiness surface -healthcheck depends on — the check would then
    # report unhealthy forever even though the exporter is working fine. If
    # you disable admin, also disable this healthcheck (add a
    # `healthcheck: { disable: true }` override), or Compose will keep
    # restarting/flagging a container that was never unhealthy to begin with.
    healthcheck:
      test: ["CMD", "/usr/local/bin/tailscale2otel", "-healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    environment:
      TS2OTEL_TAILSCALE__TAILNET: ${TS2OTEL_TAILSCALE__TAILNET:-}
      TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_ID: ${TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_ID:-}
      TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_SECRET: ${TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_SECRET:-}
      TS2OTEL_TAILSCALE__AUTH__APIKEY: ${TS2OTEL_TAILSCALE__AUTH__APIKEY:-}
      TS2OTEL_OTLP__GRAFANA_CLOUD__INSTANCE_ID: ${TS2OTEL_OTLP__GRAFANA_CLOUD__INSTANCE_ID:-}
      TS2OTEL_OTLP__GRAFANA_CLOUD__TOKEN: ${TS2OTEL_OTLP__GRAFANA_CLOUD__TOKEN:-}
      # Used by deploy/docker-compose.prometheus.yaml. The empty defaults keep
      # non-Prometheus routes on the config file's safe loopback posture.
      TS2OTEL_PROMETHEUS__LISTEN: ${TS2OTEL_PROMETHEUS__LISTEN:-}
      TS2OTEL_PROMETHEUS__AUTH__ALLOW_UNAUTHENTICATED: ${TS2OTEL_PROMETHEUS__AUTH__ALLOW_UNAUTHENTICATED:-false}
      # Optional receiver WAL. The existing named state volume below holds both
      # checkpoints and WAL data; keep enabled=false for stateless receiver ACKs.
      TS2OTEL_INGRESS_WAL__ENABLED: ${TS2OTEL_INGRESS_WAL__ENABLED:-false}
      TS2OTEL_INGRESS_WAL__DIRECTORY: ${TS2OTEL_INGRESS_WAL__DIRECTORY:-/var/lib/tailscale2otel/ingress-wal}
      TS2OTEL_INGRESS_WAL__MAX_BYTES: ${TS2OTEL_INGRESS_WAL__MAX_BYTES:-268435456}
      TS2OTEL_INGRESS_WAL__MAX_ENTRIES: ${TS2OTEL_INGRESS_WAL__MAX_ENTRIES:-10000}
      TS2OTEL_INGRESS_WAL__CORRUPTION: ${TS2OTEL_INGRESS_WAL__CORRUPTION:-fail}
      # Optional persistent flow store. Empty (the default) keeps /flows on the
      # bounded in-memory ring, which is lost on restart. Point this at the same
      # named state volume below to keep multi-day history across restarts; size
      # the volume for it (see docs/flow-view.md) since it holds one row per
      # connection. Rows carry user identities and land in backups — pii_filter
      # is applied before writing, unlike the in-memory path.
      TS2OTEL_FLOWS__STORE__DIRECTORY: ${TS2OTEL_FLOWS__STORE__DIRECTORY:-}
      TS2OTEL_FLOWS__STORE__RETENTION: ${TS2OTEL_FLOWS__STORE__RETENTION:-720h}
      # Gates the admin status page (/ and /api/status.json) and pprof when
      # admin.enabled. With NO token the page is served only on a loopback
      # admin.listen — any other bind is refused with HTTP 403 — so set this
      # whenever you publish the port or move the bind off 127.0.0.1. Required
      # outright if you enable profiling.pprof. /healthz and /readyz are never
      # gated.
      TS2OTEL_ADMIN__AUTH__TOKEN: ${TS2OTEL_ADMIN__AUTH__TOKEN:-}
      # Pinned true so the healthcheck: block above always has a /readyz to
      # probe (#337) — see the comment on that block for what breaks if you
      # override this to false without also disabling the healthcheck.
      TS2OTEL_ADMIN__ENABLED: ${TS2OTEL_ADMIN__ENABLED:-true}
      # Go runtime GC tuning. This is a near-idle poller with a tiny live heap, so the
      # default GOGC=100 fires frequent (individually cheap) collections; GOGC=200
      # halves that frequency. GOMEMLIMIT is a soft backstop ~10% below mem_limit.
      GOGC: ${GOGC:-200}
      GOMEMLIMIT: ${GOMEMLIMIT:-230MiB}
    # Process state: poll cursors, ACL semantic evidence, and an enabled receiver WAL survive
    # container recreation via the existing named volume. Docker copies the image
    # directory (owned by uid 65532) on first creation, so the nonroot user can
    # write without extra chmod.
    # Alternative: bind-mount a host directory pre-chowned to uid 65532, e.g.:
    #   - ./checkpoints:/var/lib/tailscale2otel
    # A mounted config may independently choose memory poll cursors and file-backed
    # evidence; do not force those keys here because environment values override YAML.
    # If it is not writable, each configured file store WARNS and falls back to memory; an enabled
    # ingress WAL fails closed instead of accepting data without durability.
    volumes:
      - checkpoints:/var/lib/tailscale2otel
    # File-based config (optional) lives in docker-compose.config.yaml, applied
    # as a second -f. It CANNOT be a commented block here: a service map may
    # carry only one `volumes:` key, so uncommenting a second one is a parse
    # error rather than a merge, and the form this file used to suggest took
    # the checkpoint volume above with it (#333). Across two -f files Compose
    # merges the volume lists, so checkpoints survive:
    #   docker compose -f deploy/docker-compose.yaml \
    #                  -f deploy/docker-compose.config.yaml up
    # Streaming (HEC) + webhook receivers, only if enabled in config:
    # ports:
    #   - "8088:8088"
    #   - "8089:8089"
    # Prometheus publishing lives in docker-compose.prometheus.yaml. Container
    # loopback cannot receive a published host port, so that override is paired
    # with TS2OTEL_PROMETHEUS__LISTEN=:2112 and an explicit auth posture.

# Existing named volume for checkpoints plus an enabled receiver WAL. Created
# once by Docker and inherits the /var/lib/tailscale2otel directory ownership
# from the image (uid 65532).
volumes:
  checkpoints: {}

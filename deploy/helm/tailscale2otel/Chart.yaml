apiVersion: v2
name: tailscale2otel
description: Tailscale exporter for OpenTelemetry and Prometheus — device fleet, network flow logs and audit logs over OTLP. Grafana Cloud ready. Headscale supported.
type: application
# Chart version — bump on chart changes.
# 0.33.3: expose explicit PAM tailnet selection and opt-in session logs.
# 0.33.2: add the name-scoped Lease list/watch grant required by the reusable
# Lease watcher; the observer supplies metadata.name field selectors.
# 0.33.1: default the coordination Lease and checkpoint ConfigMap namespace to
# the Helm release namespace, while retaining explicit DNS-1123 overrides.
# 0.33.0: add optional Kubernetes Lease coordination for active-passive replicas.
# `replicaCount` stays at one unless `config.coordination.mode=kubernetes`, which
# permits up to three replicas and switches the Deployment to RollingUpdate. The
# coordinated pod receives a least-privilege Role/RoleBinding for its configured
# Lease and mounts its ServiceAccount token for the in-cluster client.
# 0.32.0: add `extraContainers` — sidecar containers appended to the pod spec verbatim, for a
# companion process that must share the exporter's network namespace or volumes. The motivating
# case is a `tailscale` sidecar giving the pod real tailnet membership, which is the only way
# config.collectors.node_metrics.discovery can reach devices on 100.64.0.0/10: no Kubernetes
# egress mechanism expresses "every address in the tailnet", and a per-target ExternalName
# Service does not scale to a discovered target set. Rendered with NOTHING added — no
# securityContext, resources, probes or env — so a sidecar needing capabilities the exporter
# drops (kernel-mode tailscale wants NET_ADMIN and /dev/net/tun) declares them in its own
# container securityContext, which overrides podSecurityContext; the pod default is not
# weakened, so the exporter container keeps runAsNonRoot, readOnlyRootFilesystem and drop:ALL.
# New helper tailscale2otel.validateExtraContainers rejects a missing name or image and a name
# colliding with the exporter's own container, at template time rather than at admission.
# 0.24.0: BREAKING BEHAVIOUR — a metrics monitor over an unauthenticated, network-reachable
# /metrics now FAILS to render (#315). The app refuses /metrics with 403 when
# config.prometheus.listen is a network bind and config.prometheus.auth.token is empty, so a
# PodMonitor/ServiceMonitor aimed at it would scrape a 403 forever and report "no data" — which
# reads as a broken exporter, not a chart misconfiguration. Three ways out, all rendered in the
# error: set config.prometheus.auth.token (plus the monitor's bearerTokenSecret), set the new
# config.prometheus.auth.allow_unauthenticated=true to acknowledge scraping it unauthenticated
# behind a NetworkPolicy, or bind the listener to loopback. Existing releases running a monitor
# with no token must add one of those.
# 0.23.0: values.schema.json strictness (#304) — every chart-authored object gained
# additionalProperties:false via `# @schema` annotations in values.yaml (config.*, the
# per-listener service/ingress/gateway/networkPolicy blocks, probes, image, secret, etc.),
# so a typo'd or unknown key now fails `helm lint`/`helm template` instead of silently
# rendering nothing for it. Free-form maps stay open on purpose: labels/annotations,
# otlp.headers, profiling.pyroscope.tags, nodeSelector, resources.requests/limits, and
# the extraEnv/extraEnvFrom item shapes. Root-level keys are strict too, so the issue's
# own repro `--set secrets.foo=...` (a plausible typo that rendered NO credential and no
# error) is now rejected by name. Root strictness is the one part of the schema with no
# values.yaml annotation — a `# @schema` comment at the top of the file attaches to the
# first key, not the root mapping — so it lives in just gen
# (--schema-root.additional-properties=false) and .github/workflows/helm.yml
# (additionalProperties: false). Those two must move together or local regeneration
# drifts from CI; render-tests case Z is what notices.
# 0.22.0: three independent hardening additions (#349/#350/#351).
#   #349 image.digest — pin the image by immutable digest instead of a tag; when set it wins
#   deterministically over image.tag/appVersion (repository@digest, never repo:tag@digest).
#   values.schema.json enforces the sha256:<64 hex> shape; a template `fail` covers the same input
#   for a schema-less render path (--skip-schema-validation). New helper tailscale2otel.image is
#   the one place that decides the rendered reference.
#   #350 probes.{liveness,readiness,startup} — the previously-hardcoded probe timings
#   (initialDelaySeconds 5, periodSeconds 15) are now values, each independently enabled/disabled,
#   plus a new opt-in (default off) startupProbe targeting /readyz. The default rendered
#   liveness/readiness manifest is byte-identical to before: timeoutSeconds/failureThreshold/
#   successThreshold render ONLY when set away from Kubernetes' own probe defaults (1/3/1).
#   successThreshold is schema-enforced to exactly 1 on liveness/startup (Kubernetes rejects any
#   other value there); a template guard (tailscale2otel.validateProbes) covers null inputs the
#   schema's minimum/enum do not reject. TLS scheme stays automatic from config.admin.tls, not a
#   value. All probes still require config.admin.enabled, as before.
#   #351 networkPolicy — new opt-in (default off) templates/networkpolicy.yaml. Ingress opens one
#   rule per ENABLED listener/consumer (admin when any probe is on, prometheus when a
#   Service/PodMonitor/ServiceMonitor consumes it, streaming/webhook when their Service is on) —
#   derived from the same enablement templates/service.yaml already uses, so a disabled listener
#   can never gain a hole. Egress defaults to allowAll: true — NetworkPolicy has no hostname
#   selector, so the Tailscale control-plane API and an operator's OTLP endpoint cannot be
#   expressed portably; this resource's real value is its ingress half. See the values.yaml
#   comments for the full reasoning and the documented escape hatch (a CNI-specific policy CRD).
# 0.21.0: add opt-in Ingress (templates/ingress.yaml) and Gateway API HTTPRoute
# (templates/httproute.yaml) for the streaming and webhook receiver listeners ONLY (#346).
# admin and prometheus never get one, at any value. Each requires a backing
# service.<listener>.enabled, the listener's own credential, a host (Ingress) or at least one
# parentRef (HTTPRoute), and — for Ingress — either a tls.secretName or an annotation
# (e.g. cert-manager.io/cluster-issuer) when tls.enabled (the default). New values.yaml
# `ingress:`/`gateway:` blocks; new _helpers.tpl `tailscale2otel.validateIngress` /
# `tailscale2otel.validateGateway`.
# 0.14.7: add collectors.auditlogs.objectstore — Tailscale's CONFIGURATION-log export as an
# ingestion source, a destination of its own with nothing inherited from the flow block. Its three
# credential keys join tailscale2otel.credentialPaths, so setting one inline routes the rendered
# config to the Secret exactly as the flow keys do.
# 0.14.6: add collectors.flowlogs.objectstore.layout (partitioned | flat) for reading a copied or
# mirrored export whose self-contained basenames sit directly under the prefix.
# 0.14.5: add opt-in bounded ingress-WAL configuration and process-state
# persistence guidance for durable local receiver acceptance.
# 0.14.4: expose configurable per-object and per-cycle object-store ingestion bounds.
# 0.14.3: add native webhook TLS and flow reporter-trust configuration.
# 0.14.2: add bounded flow replay/future-skew controls and file-only multi-tailnet
# HEC/webhook routes; document fail-closed webhook authentication.
# 0.14.1: GHSA-825f-hph6-x65w — remove every pod-template annotation that hashed secret
# material. The Deployment used to publish `checksum/secret` (a SHA-256 of the inline
# `secret:` map) and `checksum/config` unconditionally (including when the rendered
# config.yaml was Secret-backed, e.g. multi-tailnet or any inline credential). Both let
# a principal with workload-read but no Secret-read verify offline guesses against the
# real value. `checksum/config` now renders ONLY when the config stays credential-free
# (ConfigMap-backed); `checksum/secret` is removed outright. `rolloutTrigger` (already
# the documented path for a rotated `existingSecret`, SEC-06 / #469) is now also the
# documented path for an inline `secret:` change and a secret-backed config.yaml change
# — Stakater Reloader (watching the Secret object server-side, never its contents) is
# the automated alternative for all three cases. No values keys added or removed.
# 0.14.0: credentials set inline under `config:` no longer land in a ConfigMap (SEC-07 / #470).
# When any credential-bearing key is set inline — oauth client_secret, apikey, headscale api_key,
# grafana_cloud token, otlp.headers, the objectstore keys, streaming/webhook/prometheus/admin
# tokens, pyroscope password, any tailnets[] entry, or a node_metrics target with a
# bearer_token/headers — the whole rendered config.yaml moves into Secret <fullname>-config
# (the same mechanism multi-tailnet mode already used) and the pod mounts it from there.
# Credential-free configs keep the ConfigMap. New `configStorage.mode` (auto|secret|configmap)
# overrides the choice; `configmap` + an inline credential makes `helm template` fail, naming the
# keys. Also adds `rolloutTrigger` (SEC-06 / #469): an opaque operator-chosen value surfaced as the
# pod annotation tailscale2otel.m7kni.io/rollout-trigger, so rotating an externally managed
# existingSecret has a supported way to force a rollout — Kubernetes never refreshes env vars in a
# running container, so envFrom credentials are otherwise stale until the pod is replaced.
# 0.13.0: BREAKING — removes config.cardinality.flow.destination_service. tailscale.dst.service is
# now emitted unconditionally on BOTH flow metric families; it was already ungated on the rollup
# families, so the toggle only ever governed the raw ones and the same dimension appeared or vanished
# with metrics_mode. An existing `destination_service:` under `config:` is silently ignored (the app
# ignores unknown YAML keys); a stale TS2OTEL_CARDINALITY__FLOW__DESTINATION_SERVICE env var raises
# the unknown-variable advisory at startup. Also documents the metrics_mode precondition on
# source_port/destination_port (inert under the default rollup) and the node_dims requirement on
# identity_dims.
# 0.12.0: re-sync `config:` with the app's config surface — it had drifted 42 keys behind
# config.Default(). Adds collectors.oauth_apps, collectors.node_metrics.discovery.* and its
# max_samples/max_response_bytes caps, admin.tls.*, admin.status_refresh_interval,
# prometheus.tls.*, webhook.tolerance/max_body_bytes, cardinality.flow.identity_dims,
# collectors.devices.posture_log_mode, otlp.tls.insecure_skip_verify,
# tailscale.auth.workload_identity.* (keyless OIDC) and every *_file secret-from-path variant.
# Corrects two stale values that contradicted the app: profiling.mutex_profile_fraction 0->5 and
# block_profile_rate 0->100000 (the app defaulted contention profiling ON in app 2.0.0; the chart
# was silently disabling it), and fixes the otlp.tls.insecure description, which described a
# certificate-verification skip when the flag disables TLS entirely. A new Go guard test
# (TestHelmValuesCoverEveryKey) now fails CI if this block drifts from config.Default() again.
# 0.9.1: correct the long-stale appVersion (was 0.1.0, tracked nothing) and add
# artifacthub.io/* annotations + icon so the OCI chart renders properly on Artifact Hub.
# 0.7.6: add podSecurityContext.fsGroup (65532, OnRootMismatch) so the opt-in PVC
# persistence path is reliably writable regardless of the CSI driver's default
# ownership; add extraVolumes/extraVolumeMounts so operators can mount arbitrary
# files (e.g. a streaming.tls or webhook.tls cert/key Secret) without forking the chart.
# 0.7.5: default GOMEMLIMIT to ~90% of resources.limits.memory (computed in the
# deployment template) when goRuntime.memLimit is left empty, mirroring the
# docker-compose GOMEMLIMIT backstop so the Helm-deployed pod gets the same
# soft memory ceiling.
# 0.7.4: add conditional liveness/readiness probes (/healthz, /readyz on the admin
# port), rendered only when config.admin.enabled — addresses Snyk IaC SNYK-CC-K8S-41.
# 0.7.2: security hardening — digest-pin base images, checksum/secret annotation,
# NOTES.txt key-name fix, tailnets credential warning.
# 0.5.1: checkpoint.store defaults to `file` (mirrors app default); add persistence.*
# values to create a PVC for durable checkpoint storage (off by default, uses emptyDir).
# The Dockerfile pre-seeds /var/lib/tailscale2otel owned by nonroot (65532) and
# docker-compose gains a named `checkpoints` volume so persistence works out of the box.
# 0.5.0: BREAKING — switch to layered config (defaults < file < env vars). Secret
# keys renamed to systematic TS2OTEL_* convention (e.g. TS_OAUTH_CLIENT_SECRET ->
# TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_SECRET). ${VAR} placeholders removed from
# config.yaml (secrets injected via env override, never in the ConfigMap). Cardinality
# restructured: cardinality.flow.* and cardinality.per_entity.* replace the flat keys;
# flow_rollup_top_n moved from collectors.flowlogs to cardinality.flow.rollup_top_n.
# 0.4.8: remove the legacy cardinality.flow_include_ports toggle (superseded by the
# granular flow_source_port / flow_destination_port).
# 0.4.5: add goRuntime.{gogc,memLimit} -> GOGC/GOMEMLIMIT container env (Go GC tuning;
# GOGC defaults to 200 to halve GC frequency on this near-idle poller).
# 0.4.1: set container securityContext runAsUser/runAsGroup to 65532 (distroless
# nonroot uid/gid > 10000) to satisfy hardened-cluster policy (trivy KSV-0020/0021).
# 0.4.0: add admin.auth.token (shared-secret gate for the status page + pprof)
# and the ADMIN_TOKEN secret key.
# 0.4.3: flow metrics default to the bounded rollup (cardinality.flow_metrics_mode,
# default rollup) + collectors.flowlogs.flow_rollup_top_n.
# 0.3.0: add admin.landing_page (status page) and the profiling section
# (pprof + Pyroscope push, opt-in) plus PYROSCOPE_* secret keys.
# 0.2.0: BREAKING — the full app config now lives under values.yaml `config:`
# (single source of truth, no chart<->config drift). See CHANGELOG.md.
# 0.30.0: re-sync `config:` with the app's config surface for the OTLP-hardening /
# tracing-samplers / Resource-enrichment features (#360-#362, #366, #370, #372, #373, #380, #384) —
# it had drifted 85 keys behind config.Default(). Adds otlp.compression/timeout/max_request_size/
# grpc_reconnection_period, otlp.retry.*, otlp.batch.{logs,traces}.*, otlp.stdout.*,
# otlp.credential_reload.*, the three per-signal blocks otlp.{metrics,logs,traces}.*,
# profiling.pyroscope.span_profiles.enabled, profiling.pyroscope.credential_reload.*,
# profiling.pyroscope.tailnet_label, tracing.remote_parent, tracing.samplers.*, and the new
# top-level resource: block (service_namespace/deployment_environment/attributes/from_env).
# 0.28.0: add config.flows.capacity_profile (#329).

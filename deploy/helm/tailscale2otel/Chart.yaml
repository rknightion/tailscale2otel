apiVersion: v2
name: tailscale2otel
description: Tailscale exporter for OpenTelemetry and Prometheus — device fleet, network flow logs and audit logs over OTLP. Grafana Cloud ready. Headscale supported.
type: application
# Chart version — bump on chart changes.
# 0.14.3: add native webhook TLS and flow reporter-trust configuration.
# 0.14.2: add bounded flow replay/future-skew controls and file-only multi-tailnet
# HEC/webhook routes; document fail-closed webhook authentication.
# 0.14.1: GHSA-825f-hph6-x65w — remove every pod-template annotation that hashed secret
# material. The Deployment used to publish `checksum/secret` (a SHA-256 of the inline
# `secret:` map) and `checksum/config` unconditionally (including when the rendered
# config.yaml was Secret-backed, e.g. multi-tailnet or any inline credential). Both let
# a principal with workload-read but no Secret-read verify offline guesses against the
# real value. `checksum/config` now renders ONLY when the config stays credential-free
# (ConfigMap-backed); `checksum/secret` is removed outright. `rolloutTrigger` (already
# the documented path for a rotated `existingSecret`, SEC-06 / #469) is now also the
# documented path for an inline `secret:` change and a secret-backed config.yaml change
# — Stakater Reloader (watching the Secret object server-side, never its contents) is
# the automated alternative for all three cases. No values keys added or removed.
# 0.14.0: credentials set inline under `config:` no longer land in a ConfigMap (SEC-07 / #470).
# When any credential-bearing key is set inline — oauth client_secret, apikey, headscale api_key,
# grafana_cloud token, otlp.headers, the objectstore keys, streaming/webhook/prometheus/admin
# tokens, pyroscope password, any tailnets[] entry, or a node_metrics target with a
# bearer_token/headers — the whole rendered config.yaml moves into Secret <fullname>-config
# (the same mechanism multi-tailnet mode already used) and the pod mounts it from there.
# Credential-free configs keep the ConfigMap. New `configStorage.mode` (auto|secret|configmap)
# overrides the choice; `configmap` + an inline credential makes `helm template` fail, naming the
# keys. Also adds `rolloutTrigger` (SEC-06 / #469): an opaque operator-chosen value surfaced as the
# pod annotation tailscale2otel.m7kni.io/rollout-trigger, so rotating an externally managed
# existingSecret has a supported way to force a rollout — Kubernetes never refreshes env vars in a
# running container, so envFrom credentials are otherwise stale until the pod is replaced.
# 0.13.0: BREAKING — removes config.cardinality.flow.destination_service. tailscale.dst.service is
# now emitted unconditionally on BOTH flow metric families; it was already ungated on the rollup
# families, so the toggle only ever governed the raw ones and the same dimension appeared or vanished
# with metrics_mode. An existing `destination_service:` under `config:` is silently ignored (the app
# ignores unknown YAML keys); a stale TS2OTEL_CARDINALITY__FLOW__DESTINATION_SERVICE env var raises
# the unknown-variable advisory at startup. Also documents the metrics_mode precondition on
# source_port/destination_port (inert under the default rollup) and the node_dims requirement on
# identity_dims.
# 0.12.0: re-sync `config:` with the app's config surface — it had drifted 42 keys behind
# config.Default(). Adds collectors.oauth_apps, collectors.node_metrics.discovery.* and its
# max_samples/max_response_bytes caps, admin.tls.*, admin.status_refresh_interval,
# prometheus.tls.*, webhook.tolerance/max_body_bytes, cardinality.flow.identity_dims,
# collectors.devices.posture_log_mode, otlp.tls.insecure_skip_verify,
# tailscale.auth.workload_identity.* (keyless OIDC) and every *_file secret-from-path variant.
# Corrects two stale values that contradicted the app: profiling.mutex_profile_fraction 0->5 and
# block_profile_rate 0->100000 (the app defaulted contention profiling ON in app 2.0.0; the chart
# was silently disabling it), and fixes the otlp.tls.insecure description, which described a
# certificate-verification skip when the flag disables TLS entirely. A new Go guard test
# (TestHelmValuesCoverEveryKey) now fails CI if this block drifts from config.Default() again.
# 0.9.1: correct the long-stale appVersion (was 0.1.0, tracked nothing) and add
# artifacthub.io/* annotations + icon so the OCI chart renders properly on Artifact Hub.
# 0.7.6: add podSecurityContext.fsGroup (65532, OnRootMismatch) so the opt-in PVC
# persistence path is reliably writable regardless of the CSI driver's default
# ownership; add extraVolumes/extraVolumeMounts so operators can mount arbitrary
# files (e.g. a streaming.tls or webhook.tls cert/key Secret) without forking the chart.
# 0.7.5: default GOMEMLIMIT to ~90% of resources.limits.memory (computed in the
# deployment template) when goRuntime.memLimit is left empty, mirroring the
# docker-compose GOMEMLIMIT backstop so the Helm-deployed pod gets the same
# soft memory ceiling.
# 0.7.4: add conditional liveness/readiness probes (/healthz, /readyz on the admin
# port), rendered only when config.admin.enabled — addresses Snyk IaC SNYK-CC-K8S-41.
# 0.7.2: security hardening — digest-pin base images, checksum/secret annotation,
# NOTES.txt key-name fix, tailnets credential warning.
# 0.5.1: checkpoint.store defaults to `file` (mirrors app default); add persistence.*
# values to create a PVC for durable checkpoint storage (off by default, uses emptyDir).
# The Dockerfile pre-seeds /var/lib/tailscale2otel owned by nonroot (65532) and
# docker-compose gains a named `checkpoints` volume so persistence works out of the box.
# 0.5.0: BREAKING — switch to layered config (defaults < file < env vars). Secret
# keys renamed to systematic TS2OTEL_* convention (e.g. TS_OAUTH_CLIENT_SECRET ->
# TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_SECRET). ${VAR} placeholders removed from
# config.yaml (secrets injected via env override, never in the ConfigMap). Cardinality
# restructured: cardinality.flow.* and cardinality.per_entity.* replace the flat keys;
# flow_rollup_top_n moved from collectors.flowlogs to cardinality.flow.rollup_top_n.
# 0.4.8: remove the legacy cardinality.flow_include_ports toggle (superseded by the
# granular flow_source_port / flow_destination_port).
# 0.4.5: add goRuntime.{gogc,memLimit} -> GOGC/GOMEMLIMIT container env (Go GC tuning;
# GOGC defaults to 200 to halve GC frequency on this near-idle poller).
# 0.4.1: set container securityContext runAsUser/runAsGroup to 65532 (distroless
# nonroot uid/gid > 10000) to satisfy hardened-cluster policy (trivy KSV-0020/0021).
# 0.4.0: add admin.auth.token (shared-secret gate for the status page + pprof)
# and the ADMIN_TOKEN secret key.
# 0.4.3: flow metrics default to the bounded rollup (cardinality.flow_metrics_mode,
# default rollup) + collectors.flowlogs.flow_rollup_top_n.
# 0.3.0: add admin.landing_page (status page) and the profiling section
# (pprof + Pyroscope push, opt-in) plus PYROSCOPE_* secret keys.
# 0.2.0: BREAKING — the full app config now lives under values.yaml `config:`
# (single source of truth, no chart<->config drift). See CHANGELOG.md.

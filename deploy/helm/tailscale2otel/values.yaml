# Default values for tailscale2otel.

image: # @schema additionalProperties:false
  # -- Container image repository.
  repository: ghcr.io/rknightion/tailscale2otel
  # -- Image tag. Defaults to .Chart.appVersion when empty. IGNORED entirely when image.digest is
  # set — see digest below.
  tag: ""
  # -- Pin the image by immutable digest instead of a mutable tag, e.g.
  # "sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855". When set, the
  # rendered reference is `repository@digest` and image.tag / .Chart.AppVersion are IGNORED
  # ENTIRELY — digest wins deterministically, never `repo:tag@digest`. Because the reference is
  # then content-addressed, bumping the deployed image becomes an EXPLICIT values change to this
  # field: pullPolicy no longer matters (there is nothing left for Always to re-resolve — the same
  # digest always names the same content) and there is no more "new tag lands, next rollout picks
  # it up automatically" side channel. Rotate this value deliberately, e.g. from the digest the
  # release pipeline publishes alongside each tag.
  digest: "" # @schema pattern:^(sha256:[a-f0-9]{64})?$
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# -- Image pull secrets for private registries.
imagePullSecrets: []

# --- Liveness/readiness/startup probes on the admin HTTP server ---
# All three probes require config.admin.enabled — with admin off there is no HTTP endpoint to
# probe, and (as before this feature) NONE of them render regardless of probes.*.enabled. TLS
# scheme (http vs https) stays automatic, derived from config.admin.tls (#342) — it is not, and
# will never be, a value here. The liveness/readiness DEFAULTS below are unchanged from the
# timings this feature replaces (initialDelaySeconds 5, periodSeconds 15), and
# timeoutSeconds/failureThreshold/successThreshold are Kubernetes' own probe defaults (1/3/1) —
# rendering stays byte-identical to before at these defaults; only a non-default value renders
# those fields explicitly.
probes: # @schema additionalProperties:false
  liveness: # @schema additionalProperties:false
    # -- Enable the liveness probe (GET /healthz).
    enabled: true
    # -- Seconds after container start before the first liveness probe.
    initialDelaySeconds: 5 # @schema minimum:0
    # -- Seconds between liveness probes.
    periodSeconds: 15 # @schema minimum:1
    # -- Seconds before a liveness probe attempt times out.
    timeoutSeconds: 1 # @schema minimum:1
    # -- Consecutive failures before the kubelet restarts the container.
    failureThreshold: 3 # @schema minimum:1
    # -- Consecutive successes required to consider the probe passing again. Kubernetes REJECTS
    # any value other than 1 for a liveness probe — enforced here, not just documented.
    successThreshold: 1 # @schema enum:[1]
  readiness: # @schema additionalProperties:false
    # -- Enable the readiness probe (GET /readyz).
    enabled: true
    # -- Seconds after container start before the first readiness probe.
    initialDelaySeconds: 5 # @schema minimum:0
    # -- Seconds between readiness probes.
    periodSeconds: 15 # @schema minimum:1
    # -- Seconds before a readiness probe attempt times out.
    timeoutSeconds: 1 # @schema minimum:1
    # -- Consecutive failures before the pod is marked NotReady (removed from Service endpoints).
    failureThreshold: 3 # @schema minimum:1
    # -- Consecutive successes required to mark the pod Ready again after a failure. Unlike
    # liveness/startup, Kubernetes allows any value >=1 here.
    successThreshold: 1 # @schema minimum:1
  startup: # @schema additionalProperties:false
    # -- Enable a startup probe (GET /readyz). Off by default: opt in to shield a slow first
    # initialization (e.g. the first poll cycle against a large multi-tailnet fleet) with its own
    # budget, separate from the steady-state liveness timing above — while a startup probe is
    # configured and has not yet succeeded, the kubelet does not run liveness/readiness at all, so
    # a slow startup can never trip liveness before it has had a chance to become healthy.
    enabled: false
    # -- Seconds after container start before the first startup probe.
    initialDelaySeconds: 0 # @schema minimum:0
    # -- Seconds between startup probes.
    periodSeconds: 10 # @schema minimum:1
    # -- Seconds before a startup probe attempt times out.
    timeoutSeconds: 1 # @schema minimum:1
    # -- Consecutive failures before the container is considered to have failed startup and is
    # restarted. Default budget: 30 x periodSeconds(10s) = 300s to become ready.
    failureThreshold: 30 # @schema minimum:1
    # -- Consecutive successes before the startup probe hands off to liveness/readiness.
    # Kubernetes REJECTS any value other than 1 for a startup probe — enforced here.
    successThreshold: 1 # @schema enum:[1]

# -- Replica count. The default `none` coordination mode is a singleton poller:
# values above 1 are rejected because they would double-emit every metric and log.
# Set config.coordination.mode to `kubernetes` to run 2 or 3 active-passive
# replicas behind a Lease. The template guard enforces the mode relationship;
# this schema maximum enforces the Kubernetes-coordination ceiling.
replicaCount: 1 # @schema minimum:1;maximum:3

# -- Override the chart name portion of resource names.
nameOverride: ""
# -- Fully override the generated resource names.
fullnameOverride: ""

serviceAccount: # @schema additionalProperties:false
  # -- Create a ServiceAccount.
  create: true
  # -- ServiceAccount name. Generated when empty.
  name: ""
  # -- Annotations to add to the ServiceAccount.
  annotations: {}
  # -- Automount the ServiceAccount API token into the pod. The exporter makes no Kubernetes API calls, so this defaults to false to drop an unused, attacker-useful credential from the network-facing pod.
  automountServiceAccountToken: false

# -- Extra annotations for the pod.
podAnnotations: {}
# -- Extra labels for the pod.
podLabels: {}

# -- Pod-level security context. Runs as non-root with the RuntimeDefault seccomp
# profile; the app needs no special privileges. fsGroup makes the opt-in PVC
# persistence path (persistence.enabled=true) reliably writable by the uid-65532
# container regardless of the CSI driver's default ownership behavior — a freshly
# provisioned block PVC is typically root:root on many drivers. The default
# emptyDir checkpoint volume already works without this (kubelet chmods emptyDir
# roots 0777, and the image pre-seeds /var/lib/tailscale2otel owned by 65532:65532).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
# -- Container-level security context. Drops all capabilities and runs with a
# read-only root filesystem (the app writes only to the optional checkpoint
# volume). Runs as the distroless `nonroot` uid/gid 65532 (a high, non-system id
# > 10000) to satisfy hardened-cluster policy.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop: ["ALL"]

# -- Resource requests and limits. The defaults suit a few-hundred-device tailnet;
# raise limits if you enable high-volume flow-log streaming or many node-metrics
# targets.
resources: # @schema additionalProperties:false
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Go runtime tuning, injected as container env vars. This is a near-idle poller
# with a tiny live heap, so the Go default GOGC=100 fires frequent (individually
# cheap) collections that dominate the CPU profile; raising GOGC cuts that GC share.
goRuntime: # @schema additionalProperties:false
  # -- GOGC: heap-growth percentage between collections (Go default 100). Empty ("") leaves the Go default.
  gogc: "200"
  # -- GOMEMLIMIT soft memory cap, e.g. "230MiB". Empty ("") auto-computes ~90% of
  # resources.limits.memory (mirrors the docker-compose backstop; e.g. 256Mi -> 230MiB),
  # falling back to unset if that limit is absent or in a unit outside Mi/Gi. Set
  # explicitly to override the computed value.
  memLimit: ""

# -- Node selector for pod scheduling.
nodeSelector: {}
# -- Tolerations for pod scheduling.
tolerations: []
# -- Affinity rules for pod scheduling.
affinity: {}

# -- Extra volumes appended to the pod spec as-is (e.g. a Secret volume holding
# TLS cert/key material for config.streaming.tls or config.webhook.tls, since
# readOnlyRootFilesystem leaves no other place to put arbitrary files). Paired with extraVolumeMounts
# below by volume name. See the chart README for a worked TLS-cert example.
extraVolumes: []
# -- Extra volume mounts appended to the main container's volumeMounts, as-is.
# Paired with extraVolumes above by name.
extraVolumeMounts: []

# -- Extra SIDECAR containers appended to the pod spec as-is, after the exporter. For a
# companion process that has to share the exporter's network namespace or its volumes —
# the motivating case is a `tailscale` sidecar giving the pod tailnet membership, which is
# what config.collectors.node_metrics.discovery needs to reach devices on 100.64.0.0/10
# (no Kubernetes egress mechanism expresses "every address in the tailnet", and a per-target
# ExternalName Service does not scale to a DISCOVERED target set).
#
# Each entry is a standard Kubernetes Container and is rendered VERBATIM — the chart adds no
# securityContext, resources, probes, volumeMounts or env of its own. A sidecar needing what
# the exporter drops must say so in its OWN container securityContext, which overrides
# podSecurityContext; do not weaken podSecurityContext to suit a sidecar, or the exporter
# silently loses the same hardening.
#
# Names must be unique and must not collide with the exporter's own container
# ("tailscale2otel"); rendering FAILS rather than producing a Pod the API server rejects.
#
# TWO WAYS TO RUN A TAILSCALE SIDECAR, and the cheap one is usually enough:
#
#   * USERSPACE (TS_USERSPACE=true, the image default) needs NO capabilities and NO host
#     device. It gives no routes, so the exporter reaches the tailnet through the sidecar's
#     outbound HTTP proxy: set TS_OUTBOUND_HTTP_PROXY_LISTEN and point the exporter's
#     HTTP_PROXY at it via extraEnv. That covers node-metrics scraping, which is plain HTTP.
#     Set HTTP_PROXY only — never HTTPS_PROXY — or the exporter's OTLP, Tailscale API,
#     Pyroscope and MaxMind traffic is also sent at the tailnet, where it has no route.
#   * KERNEL (TS_USERSPACE=false) gives the pod real 100.64.0.0/10 routes, so nothing needs
#     proxy configuration, but it needs NET_ADMIN *and* access to /dev/net/tun — an
#     extraVolumes hostPath plus a matching volumeMount here, or a TUN device plugin.
#     Tailscale's own Kubernetes examples run this container `privileged: true`.
#
# Example (userspace; pair with extraEnv HTTP_PROXY: http://localhost:1055):
#   extraContainers:
#     - name: tailscale
#       image: ghcr.io/tailscale/tailscale:v1.102.3
#       env:
#         - name: TS_AUTHKEY
#           valueFrom:
#             secretKeyRef: {name: my-ts-secret, key: TS_AUTHKEY}
#         - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
#           value: localhost:1055
#       securityContext:
#         capabilities:
#           drop: ["ALL"]
#
# SHUTDOWN ORDER. Kubernetes sends SIGTERM to all containers in a Pod at the
# same time; it does not stop the exporter before these sidecars. The exporter
# has a 45-second staged drain/flush budget (receivers, ingress WAL, OTLP and
# flow stores), while the chart's default terminationGracePeriodSeconds is 55.
# A userspace proxy or Tailscale sidecar must therefore tolerate that window;
# if it must stay available while the exporter drains, give it an appropriate
# preStop/lifecycle policy and keep the Pod grace period long enough for both
# containers. Do not assume sidecar declaration order provides shutdown order.
extraContainers: [] # @schema item: object ; itemProperties: {"name":{"type":"string","minLength":1},"image":{"type":"string","minLength":1}}

# -- Extra environment variables appended to the container's `env`, as-is. Each entry is a
# standard Kubernetes EnvVar: `{name, value}` or `{name, valueFrom: {...}}` (fieldRef,
# resourceFieldRef, configMapKeyRef, secretKeyRef). For proxy settings, custom CA paths,
# downward-API pod metadata, or a variable an external secret operator writes elsewhere.
# Rendering FAILS rather than silently shadowing: an entry is rejected if it has no `name`,
# if two entries share a name, or if the name is one the chart itself sets — a `secret:` key,
# or GOGC/GOMEMLIMIT while goRuntime is setting them. Kubernetes resolves `env` AFTER
# `envFrom`, so an unchecked entry here would quietly replace a credential injected from the
# chart's Secret. Clear the chart's own value (e.g. goRuntime.gogc: "") to take a name over.
# Example:
#   extraEnv:
#     - name: HTTPS_PROXY
#       value: http://proxy.internal:3128
#     - name: POD_NAME
#       valueFrom:
#         fieldRef:
#           fieldPath: metadata.name
# --- Workload Identity Federation (default-off) ---
# Keyless auth to the Tailscale API using a projected ServiceAccount token, so no OAuth
# client secret exists to store or rotate. Enabling this renders a PROJECTED token volume
# scoped to Tailscale's audience only — it does NOT turn on automountServiceAccountToken,
# which would mount a general-purpose Kubernetes API token the exporter has no use for and
# which would be a far more valuable credential to leak.
workloadIdentity: # @schema additionalProperties:false
  # -- Mount a projected, audience-scoped ServiceAccount token and point the exporter at it.
  # Requires config.tailscale.auth.method: workload_identity and a client_id.
  enabled: false
  # -- Token audience. Empty ("") derives Tailscale's required value,
  # `api.tailscale.com/<client id>`. Override only if Tailscale documents a different one.
  audience: ""
  # -- Requested token lifetime in seconds. The kubelet refreshes the file in place at ~80%
  # of this, and the exporter re-reads it on every token exchange, so rotation needs no
  # restart. Kubernetes clamps values below 600.
  expirationSeconds: 3600
  # -- Directory the token is projected into.
  mountPath: /var/run/secrets/tailscale
  # -- Filename within mountPath.
  fileName: token

# --- Prometheus Operator integration (default-off) ---
# Custom resources for kube-prometheus-stack. Nothing here renders unless explicitly
# enabled, so a cluster without the Prometheus Operator CRDs installed is unaffected:
# `helm template` never emits the resource, and there is nothing for the API server to
# reject. The chart cannot detect whether a CRD exists, so this is opt-in by design.
metrics: # @schema additionalProperties:false
  # -- Whether an opaque source (`existingSecret`, `extraEnvFrom`,
  # existingConfigMap, or existingConfigSecret) supplies a Prometheus auth token:
  # `auto` when no opaque source owns it, otherwise declare `present` or `absent`.
  # Helm cannot inspect those resources. A remote Service/monitor fails to render
  # while this remains `auto`, avoiding a silent 401 or an unauthenticated Service.
  externalPrometheusToken: auto # @schema enum:["auto","present","absent"]
  podMonitor: # @schema additionalProperties:false
    # -- Render a PodMonitor. Requires config.prometheus.enabled. A PodMonitor scrapes
    # pods DIRECTLY, so it needs no Service — prefer it over serviceMonitor unless you
    # specifically want the Service in the path.
    enabled: false
    # -- Scrape interval (e.g. 60s). Empty ("") inherits the Prometheus default.
    interval: ""
    # -- Per-scrape timeout. Empty ("") inherits the Prometheus default.
    scrapeTimeout: ""
    # -- Metrics path on the Prometheus listener.
    path: /metrics
    # -- Extra labels on the PodMonitor object (your Prometheus `podMonitorSelector` usually matches one).
    labels: {}
    # -- Bearer token for prometheus.auth.token, read from a Secret you manage. REQUIRED when
    # that listener has a token: a scrape without it gets 401 and the target silently reports
    # no data. Only a reference is rendered — never the value.
    bearerTokenSecret: {}
    # -- TLS settings passed to the scrape config (ca/cert/keySecret, serverName,
    # insecureSkipVerify). Only Secret references, never inline material.
    tlsConfig: {}
    # -- relabel_configs applied before the scrape.
    relabelings: []
    # -- metric_relabel_configs applied to scraped samples.
    metricRelabelings: []
    # -- Cap on samples accepted per scrape; 0 leaves it unset.
    sampleLimit: 0
  serviceMonitor: # @schema additionalProperties:false
    # -- Render a ServiceMonitor. Requires config.prometheus.enabled AND
    # service.prometheus.enabled — a ServiceMonitor selects a Service, so without one it
    # matches nothing and silently reports no data. Prefer podMonitor unless you
    # specifically want the Service in the scrape path.
    enabled: false
    # -- Scrape interval. Empty ("") inherits the Prometheus default.
    interval: ""
    # -- Per-scrape timeout. Empty ("") inherits the Prometheus default.
    scrapeTimeout: ""
    # -- Metrics path on the Prometheus listener.
    path: /metrics
    # -- Extra labels on the ServiceMonitor object (your Prometheus `serviceMonitorSelector` usually matches one).
    labels: {}
    # -- Bearer token for prometheus.auth.token, read from a Secret you manage. REQUIRED
    # when that listener has a token. Only a reference is rendered — never the value.
    bearerTokenSecret: {}
    # -- TLS settings for the scrape (Secret references only, never inline material).
    tlsConfig: {}
    # -- relabel_configs applied before the scrape.
    relabelings: []
    # -- metric_relabel_configs applied to scraped samples.
    metricRelabelings: []
    # -- Cap on samples accepted per scrape; 0 leaves it unset.
    sampleLimit: 0

# --- Per-listener Services (all default-off) ---
# The chart ships NO Service unless you enable one here. tailscale2otel's normal
# traffic is outbound-only, and every inbound listener is itself opt-in, so exposing
# nothing is the safe default. Each entry renders a DISCRETE Service mapping only its
# own port — never an aggregate, which would publish surfaces you did not ask for.
#
# Rendering FAILS if you enable a Service for a listener that is switched off, or for
# one with no credential set (value or its _file sibling). Publishing a listener is
# what turns a local misconfiguration into a cluster-reachable one: `webhook` fails OPEN —
# an empty secret skips HMAC verification entirely — and while `prometheus` and `admin` now
# fail CLOSED, a published Service with no credential just answers HTTP 403 forever, which
# reads as a broken exporter rather than as the refusal it is.
service: # @schema additionalProperties:false
  admin: # @schema additionalProperties:false
    # -- Render a Service for the admin listener. Requires config.admin.auth.token.
    # Probes do NOT need this — the kubelet reaches the pod directly.
    enabled: false
    # -- Service type. ClusterIP unless you have a specific reason; a LoadBalancer puts
    # the listener on your cloud provider's public ingress path.
    type: ClusterIP
    # -- Service port. Empty ("") uses the listener's own port from config.admin.listen.
    port: ""
    # -- Extra annotations on this Service (e.g. cloud LB or ServiceMonitor selectors).
    annotations: {}
  prometheus: # @schema additionalProperties:false
    # -- Render a Service for the Prometheus pull endpoint. Requires config.prometheus.auth.token.
    enabled: false
    # -- Service type.
    type: ClusterIP
    # -- Service port. Empty ("") uses config.prometheus.listen's port.
    port: ""
    # -- Extra annotations on this Service.
    annotations: {}
  streaming: # @schema additionalProperties:false
    # -- Render a Service for the Splunk-HEC receiver. Requires config.streaming.token.
    enabled: false
    # -- Service type.
    type: ClusterIP
    # -- Service port. Empty ("") uses config.streaming.listen's port.
    port: ""
    # -- Extra annotations on this Service.
    annotations: {}
  webhook: # @schema additionalProperties:false
    # -- Render a Service for the webhook receiver. Requires config.webhook.secret.
    enabled: false
    # -- Service type.
    type: ClusterIP
    # -- Service port. Empty ("") uses config.webhook.listen's port.
    port: ""
    # -- Extra annotations on this Service.
    annotations: {}

# --- Ingress for the two RECEIVER listeners only (all default-off) ---
# streaming and webhook are the only listeners offered an Ingress. admin and
# prometheus NEVER get one, at any value: they are introspection/scrape
# surfaces, and publishing either to the internet is never the right default,
# so this chart does not offer that as a one-line mistake. There is no
# `admin`/`prometheus` key here to set — see deploy/CLAUDE.md's "No Kubernetes
# Service" note and templates/ingress.yaml.
#
# Rendering FAILS if you enable an Ingress for a listener with no backing
# Service (service.<listener>.enabled), no credential set, no host, or with
# tls.enabled and neither a secretName nor an annotation to terminate it.
ingress: # @schema additionalProperties:false
  streaming: # @schema additionalProperties:false
    # -- Render an Ingress for the Splunk-HEC receiver. Requires
    # service.streaming.enabled and config.streaming.token (or token_file).
    enabled: false
    # -- IngressClassName. Empty ("") uses the cluster's default IngressClass.
    className: ""
    # -- Extra annotations (e.g. cert-manager.io/cluster-issuer for automated TLS).
    annotations: {}
    # -- Required. The host this Ingress rule routes; a host-less rule is a
    # catch-all that would swallow traffic for unrelated apps on the same controller.
    host: ""
    # -- Path routed to the streaming receiver.
    path: /
    # -- Ingress pathType.
    pathType: Prefix
    tls: # @schema additionalProperties:false
      # -- Terminate TLS at the Ingress (the default). Tailscale streaming/webhook
      # delivery requires HTTPS, so disabling this is only correct when a mesh or
      # sidecar upstream of the controller terminates TLS for you instead.
      enabled: true
      # -- Secret holding the TLS cert/key. Leave empty when relying solely on a
      # cert-manager (or similar) annotation to provision and name it for you —
      # but at least one of secretName or an annotation must be set.
      secretName: ""
  webhook: # @schema additionalProperties:false
    # -- Render an Ingress for the webhook receiver. Requires
    # service.webhook.enabled and config.webhook.secret (or secret_file).
    enabled: false
    # -- IngressClassName. Empty ("") uses the cluster's default IngressClass.
    className: ""
    # -- Extra annotations (e.g. cert-manager.io/cluster-issuer for automated TLS).
    annotations: {}
    # -- Required. Tailscale only delivers webhooks to a public URL on 80/443,
    # so this MUST be the hostname Tailscale is configured to call.
    host: ""
    # -- Path routed to the webhook receiver.
    path: /
    # -- Ingress pathType.
    pathType: Prefix
    tls: # @schema additionalProperties:false
      # -- Terminate TLS at the Ingress (the default). Tailscale webhooks are
      # HTTPS-only, so disabling this only makes sense when a mesh upstream of
      # the controller terminates TLS instead — Tailscale itself will not
      # deliver to a plaintext endpoint.
      enabled: true
      # -- Secret holding the TLS cert/key. Leave empty when relying solely on a
      # cert-manager (or similar) annotation — but at least one of secretName or
      # an annotation must be set.
      secretName: ""

# --- Gateway API HTTPRoute for the two RECEIVER listeners only (all default-off) ---
# Same scope as `ingress:` above and the same reason: streaming and webhook
# only, never admin or prometheus. Requires the Gateway API CRDs installed in
# the cluster (not detected — this stays opt-in, exactly like metrics.podMonitor).
#
# Rendering FAILS if you enable an HTTPRoute for a listener with no backing
# Service, no credential set, or no parentRefs entry naming the Gateway to
# attach to.
gateway: # @schema additionalProperties:false
  streaming: # @schema additionalProperties:false
    # -- Render an HTTPRoute for the Splunk-HEC receiver. Requires
    # service.streaming.enabled and config.streaming.token (or token_file).
    enabled: false
    # -- Required. At least one Gateway API parentRef, e.g.:
    #   parentRefs:
    #     - name: my-gateway
    #       namespace: gateway-system
    #       sectionName: https
    parentRefs: []
    # -- Hostnames this route matches. Empty matches every hostname the parent
    # Gateway listener accepts.
    hostnames: []
    # -- Path routed to the streaming receiver (matched as PathPrefix).
    path: /
    # -- Extra annotations on the HTTPRoute object.
    annotations: {}
  webhook: # @schema additionalProperties:false
    # -- Render an HTTPRoute for the webhook receiver. Requires
    # service.webhook.enabled and config.webhook.secret (or secret_file).
    enabled: false
    # -- Required. At least one Gateway API parentRef — see streaming above for the shape.
    parentRefs: []
    # -- Hostnames this route matches. Tailscale only delivers webhooks to a
    # public URL on 80/443, so this is usually the one hostname Tailscale calls.
    hostnames: []
    # -- Path routed to the webhook receiver (matched as PathPrefix).
    path: /
    # -- Extra annotations on the HTTPRoute object.
    annotations: {}

# --- Optional NetworkPolicy baseline (default-off) ---
# The chart renders NO NetworkPolicy unless you enable this: the default chart render must stay
# completely unaffected, exactly like metrics.podMonitor/serviceMonitor and service.*. Once
# enabled it emits ONE NetworkPolicy selecting this release's pods, with an ingress rule for
# every ENABLED listener/consumer (derived the same way templates/service.yaml is — a listener
# that is off, or a Service/PodMonitor/ServiceMonitor that never got created, can never get a
# matching hole) plus a deliberately honest egress posture — see egress.allowAll below.
networkPolicy: # @schema additionalProperties:false
  # -- Render a NetworkPolicy for this pod.
  enabled: false
  egress: # @schema additionalProperties:false
    # -- Allow DNS (UDP+TCP port 53) egress. Almost always required: the pod resolves the
    # Tailscale API host, the OTLP endpoint host, and (if configured) an S3-compatible
    # object-store endpoint by name. If enrichment.geoip.download.enabled is true, it
    # also needs HTTPS egress to download.maxmind.com (or the hostname in
    # enrichment.geoip.download.endpoint). Only consulted while allowAll is false.
    dns: true
    # -- Allow ALL egress (the default). READ THIS before setting it false. Kubernetes
    # NetworkPolicy has no hostname/DNS-name selector — only podSelector, namespaceSelector and
    # ipBlock — so there is no portable way to express "the Tailscale control-plane API"
    # (Tailscale publishes no stable IP range Tailscale itself commits to) or "an
    # operator-chosen OTLP endpoint" (arbitrary, different per install). CNIs that add
    # hostname-based egress (Cilium's CiliumNetworkPolicy, Calico's GlobalNetworkPolicy) solve
    # this, but are NOT the portable networking.k8s.io/v1 API this chart emits, so this chart
    # does not attempt one and will not invent an IP allowlist that would silently go stale.
    # This policy's real value is its INGRESS half below, which CAN be made portable and
    # correct — egress defaults to allowAll for exactly that reason. Setting this false keeps
    # only egress.dns (if true) plus egress.extra, and WILL BREAK the exporter — it can reach
    # neither the Tailscale API nor your OTLP endpoint — unless egress.extra covers both. If you
    # need a real egress restriction, use your CNI's own policy CRD instead. For example, a
    # CiliumNetworkPolicy can allow MaxMind by hostname (add equivalent rules for the API,
    # OTLP and object-store hosts):
    #
    #   apiVersion: cilium.io/v2
    #   kind: CiliumNetworkPolicy
    #   metadata: {name: tailscale2otel-fqdn-egress}
    #   spec:
    #     endpointSelector: {matchLabels: {app.kubernetes.io/name: tailscale2otel}}
    #     egress:
    #       - toFQDNs: [{matchName: download.maxmind.com}]
    #         toPorts: [{ports: [{port: "443", protocol: TCP}]}]
    # A Calico GlobalNetworkPolicy has the equivalent domain selector:
    #
    #   apiVersion: projectcalico.org/v3
    #   kind: GlobalNetworkPolicy
    #   metadata: {name: tailscale2otel-fqdn-egress}
    #   spec:
    #     selector: "app.kubernetes.io/name == 'tailscale2otel'"
    #     egress:
    #       - action: Allow
    #         destination: {domains: [download.maxmind.com], ports: [443]}
    #         protocol: TCP
    allowAll: true
    # -- Raw NetworkPolicyEgressRule entries appended as-is (e.g. an ipBlock scoped to your OTLP
    # gateway or object-store endpoint). Only consulted while allowAll is false.
    extra: []
  ingress: # @schema additionalProperties:false
    # -- Raw NetworkPolicyIngressRule entries appended as-is, alongside the rules this chart
    # generates automatically for each enabled listener/consumer (see templates/networkpolicy.yaml).
    extra: []

extraEnv: [] # @schema item: object ; itemProperties: {"name":{"type":"string","minLength":1},"value":{"type":"string"},"valueFrom":{"type":"object"}}

# -- Extra `envFrom` sources appended to the container's envFrom, as-is (configMapRef /
# secretRef). The chart's own Secret is always FIRST, so a later source here can deliberately
# override it — which is the documented way to let an external secret operator own a
# TS2OTEL_* value — while the chart can never silently override yours.
# Example:
#   extraEnvFrom:
#     - configMapRef:
#         name: proxy-config
#     - secretRef:
#         name: external-tailscale-creds
extraEnvFrom: [] # @schema item: object ; itemProperties: {"configMapRef":{"type":"object"},"secretRef":{"type":"object"},"prefix":{"type":"string"}}

# --- Secrets ---
# Provide credentials either inline here (rendered into a Secret) OR reference an
# existing Secret via existingSecret. Inline values win only when existingSecret is "".
# -- Name of a pre-created Secret exposing the TS2OTEL_* env keys. When set, no Secret is rendered.
existingSecret: ""

# -- Opaque value surfaced as the pod annotation
# `tailscale2otel.m7kni.io/rollout-trigger`. Changing it changes the pod template and
# forces a Recreate rollout. This is the supported way to pick up ANY secret-bearing
# change: a rotated `existingSecret`, a changed inline `secret:` value, or an edit to
# a secret-backed `config.yaml` (an inline credential under `config:`, a `tailnets[]`
# entry, or a node_metrics target bearer_token/headers). Kubernetes NEVER refreshes
# environment variables or Secret-mounted files in a running container, so credentials
# injected via `envFrom`/`secret.yaml`/`secret-config.yaml` stay stale until the pod is
# replaced. After rotating run e.g. `helm upgrade ... --set rolloutTrigger=$(date +%s)`.
# Pick anything you like (a timestamp, a git SHA, a counter) — it must NOT be a secret
# value or any digest of one, since annotations are readable by anyone who can read
# the Deployment (workload-read), a materially weaker grant than Secret-read
# (GHSA-825f-hph6-x65w: a published checksum of secret material lets that reader
# verify offline guesses against the real value). For an automated path instead, run
# Stakater Reloader in the cluster and set
# `podAnnotations.reloader.stakater.com/auto: "true"` (Reloader watches the Secret
# object's contents server-side and issues the rollout restart itself, so it never
# needs to publish a digest). The chart's own `checksum/config` annotation only ever
# hashes the rendered config when it is credential-free (ConfigMap-backed); a
# secret-backed config (Secret-backed) is never hashed anywhere — use rolloutTrigger
# or Reloader for that case too.
rolloutTrigger: ""

# -- Seconds the kubelet allows for a graceful stop before SIGKILL. Shutdown is STAGED and
# each stage is separately bounded in the binary: the receivers drain already-ACKed requests
# (10s), the ingress WAL performs one final drain (10s), then the OTLP pipeline flushes and
# shuts down (10s), and the flow stores close concurrently under one shared wait budget (10s) —
# 40s worst case, plus headroom. Kubernetes' own default is 30s, which is below the drain, so a
# rollout could SIGKILL the pod mid-flush and lose the final flow rollup, the WAL backlog and
# the last export. Values below the enforced minimum make `helm template` fail rather than
# silently truncating a drain. Raise it if you raise a stage timeout; `internal/app` fails the
# build if the two stop agreeing (#332).
terminationGracePeriodSeconds: 55 # @schema minimum:55

# -- Mount config.yaml from a ConfigMap YOU manage instead of one the chart renders.
# For GitOps/ExternalSecrets/SOPS setups where the config is produced outside Helm.
# Mutually exclusive with existingConfigSecret; either one makes the chart render no
# config object of its own and ignore the whole `config:` tree.
existingConfigMap: ""
# -- Mount config.yaml from a Secret YOU manage. Same as existingConfigMap but for a
# config carrying credentials — this is how multi-tailnet credentials reach the pod
# without ever passing through Helm values (and so without appearing in `helm get values`).
existingConfigSecret: ""
# -- Key inside existingConfigMap/existingConfigSecret holding the config YAML.
existingConfigKey: config.yaml

# Where the rendered config.yaml is stored.
configStorage: # @schema additionalProperties:false
  # -- Storage backend for the rendered `config.yaml`: `auto`, `secret`, or `configmap`.
  # `auto` (default) renders it into a ConfigMap while it is credential-free, and into
  # Secret `<fullname>-config` as soon as any credential-bearing key is set inline under
  # `config:` (`tailscale.auth.oauth.client_secret`, `tailscale.auth.apikey`,
  # `headscale.api_key`, `otlp.grafana_cloud.token`, `otlp.headers`, the three
  # `collectors.flowlogs.objectstore.*` and three `collectors.auditlogs.objectstore.*`
  # credential keys, `pam.token`, `streaming.token`, `webhook.secret`,
  # `prometheus.auth.token`, `admin.auth.token`,
  # `profiling.pyroscope.basic_auth_password`, any `tailnets[]` entry, or a
  # `collectors.node_metrics.targets[]` entry with `bearer_token`/`headers`). A
  # ConfigMap is readable by anyone holding `get configmaps` in the namespace, which is
  # routinely granted far more widely than `get secrets`. `secret` always uses the
  # Secret. `configmap` forces the ConfigMap and makes `helm template` FAIL, naming the
  # offending keys, if a credential is set inline.
  mode: auto # @schema enum:["auto","secret","configmap"]
# -- Inline secret values rendered into a Secret and injected via envFrom. These
# TS2OTEL_* keys override the corresponding fields in the ConfigMap config.yaml at
# runtime — secrets never appear in the ConfigMap. Keys left empty ("") are NOT
# rendered into the Secret: an empty env var would override — and blank — the same
# key set under `config:` (env beats file), silently disabling e.g. receiver auth.
secret: # @schema additionalProperties:false
  # -- Tailnet name (e.g. "example.com"), or "-" for the auth principal's default tailnet.
  TS2OTEL_TAILSCALE__TAILNET: ""
  # -- OAuth client ID (recommended auth; needs the "all:read" scope). Used when config.tailscale.auth.method=oauth.
  TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_ID: ""
  # -- OAuth client secret paired with TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_ID.
  TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_SECRET: ""
  # -- Tailscale API key. Used ONLY when config.tailscale.auth.method=apikey. Prefer OAuth: a
  # personal API key expires in <=90 days and is tied to the user that created it (stops working
  # when that user is removed). The exporter logs a WARN when method=apikey.
  TS2OTEL_TAILSCALE__AUTH__APIKEY: ""
  # -- Headscale Bearer API key. Used ONLY when config.provider=headscale.
  TS2OTEL_HEADSCALE__API_KEY: ""
  # -- Static read-only Border0 service-account bearer token for the optional PAM collector.
  TS2OTEL_PAM__TOKEN: ""
  # -- Grafana Cloud instance/stack ID (the numeric user for OTLP basic auth).
  TS2OTEL_OTLP__GRAFANA_CLOUD__INSTANCE_ID: ""
  # -- Grafana Cloud OTLP token (the password for OTLP basic auth).
  TS2OTEL_OTLP__GRAFANA_CLOUD__TOKEN: ""
  # -- S3 access key for the flow-log export bucket. Set ONLY when
  # config.collectors.flowlogs.source=objectstore AND the bucket has no role to assume (MinIO,
  # Ceph). On EKS leave these empty and annotate the service account for IRSA instead.
  TS2OTEL_COLLECTORS__FLOWLOGS__OBJECTSTORE__ACCESS_KEY_ID: ""
  # -- S3 secret key paired with the access key above.
  TS2OTEL_COLLECTORS__FLOWLOGS__OBJECTSTORE__SECRET_ACCESS_KEY: ""
  # -- S3 session token. Temporary credentials only; usually unnecessary, since the ambient
  # chain refreshes its own.
  TS2OTEL_COLLECTORS__FLOWLOGS__OBJECTSTORE__SESSION_TOKEN: ""
  # -- HEC token the streaming receiver expects ("Authorization: Splunk <token>").
  # Set ONLY when you enable config.streaming. With no token the receiver fails CLOSED:
  # it serves only a loopback config.streaming.listen and refuses every other bind.
  TS2OTEL_STREAMING__TOKEN: ""
  # -- Webhook HMAC-SHA256 secret. Set ONLY when you enable config.webhook. Empty is accepted
  # only on a loopback config.webhook.listen; network-reachable binds refuse every request
  # with HTTP 403 before reading its body.
  TS2OTEL_WEBHOOK__SECRET: ""
  # -- Shared token gating the admin status page (/ and /api/status.json) and pprof. With no token
  # the page is served only on a loopback config.admin.listen and every other bind is refused with
  # HTTP 403 — so a chart install that publishes the admin Service needs one. REQUIRED when you
  # enable config.profiling.pprof. /healthz and /readyz are never gated.
  TS2OTEL_ADMIN__AUTH__TOKEN: ""
  # -- Token gating the Prometheus /metrics endpoint (HTTP Basic password or "Authorization: Bearer <token>").
  # With no token /metrics is refused with HTTP 403 on any network-reachable bind; loopback stays
  # open, and config.prometheus.auth.allow_unauthenticated re-opens a network bind explicitly for an
  # in-cluster scrape behind a NetworkPolicy. Set ONLY when prometheus.enabled.
  TS2OTEL_PROMETHEUS__AUTH__TOKEN: ""
  # -- Pyroscope basic-auth user (Grafana Cloud: the profiles instance ID). Set ONLY when you
  # enable config.profiling.pyroscope.
  TS2OTEL_PROFILING__PYROSCOPE__BASIC_AUTH_USER: ""
  # -- Pyroscope basic-auth password (Grafana Cloud: an access policy token with profiles:write).
  TS2OTEL_PROFILING__PYROSCOPE__BASIC_AUTH_PASSWORD: ""

# --- App config ---
# The FULL application config, rendered verbatim into a ConfigMap as config.yaml.
# This is the single source of truth (kept in sync with config.example.yaml).
# Secrets are injected exclusively via TS2OTEL_* environment variables from the
# Secret above — no ${VAR} placeholders appear in the ConfigMap.
# Helm deep-merges maps, so single-key overrides keep working, e.g.:
#   --set config.log_level=debug
#   --set config.collectors.flowlogs.interval=30s
config: # @schema additionalProperties:false
  # -- Log verbosity: debug | info | warn | error.
  log_level: info
  # -- Operational log encoding: `text` or `json`. JSON is one record per line, for a cluster
  # log pipeline that parses rather than greps.
  log_format: text

  # -- Control-plane backend: tailscale (default) | headscale. Under headscale only the
  # devices/users/keys/acl/nodemetrics collectors run; the Tailscale-only collectors auto-disable.
  provider: tailscale

  # -- Multi-tailnet / MSP list. Optional; mutually exclusive with an explicit tailscale.tailnet
  # (leave it "-" when using this). Each entry observes one tailnet and is self-contained (its own
  # name + auth + http); credentials are NOT inherited from the tailscale block. Tailnet identity is
  # emitted as the tailscale.tailnet OTEL resource attribute (one target_info per tailnet). Set
  # per-tailnet secrets via TS2OTEL_* env is NOT supported for the list (file-only) — provide creds
  # inline here or mount a config file. With more than one entry, streaming/webhook receivers
  # require explicit file-only routes naming tailnets[].name; one entry may use legacy fields.
  # Default empty (single tailnet from the tailscale block below).
  # An entry may also carry its own `objectstore.flow` destination (endpoint/region/bucket/prefix
  # plus the same credential and limit fields as collectors.flowlogs.objectstore). With this list
  # non-empty nothing is inherited from that global block, and when
  # config.collectors.flowlogs.source is `objectstore` EVERY entry must have a complete destination
  # of its own and no two entries may name the same bucket+prefix — otherwise startup fails, naming
  # the tailnet. Use `*_file` credential keys pointing at a mounted Secret to keep per-tailnet S3
  # keys out of this file.
  # When this list is non-empty the chart renders the whole config.yaml into a dedicated
  # Secret (<fullname>-config) instead of a ConfigMap, so the inline per-tailnet credentials
  # never land in a ConfigMap readable by namespace viewers.
  tailnets: []
  # Example per-entry block (the default list stays empty):
  # - name: acme.example.com
  #   cardinality:
  #     metric_limit: 0 # 0 inherits global; negative is unlimited for this tailnet
  #     warning_threshold: 0 # 0 inherits global
  #     critical_threshold: 0 # 0 inherits global; effective critical must be >= warning

  # Headscale control-plane connection. Used only when provider: headscale. The api_key is a
  # Bearer token — set it via the secret TS2OTEL_HEADSCALE__API_KEY (above), not here.
  headscale: # @schema additionalProperties:false
    # -- Headscale origin only (scheme + host, optional port; no path, credentials, query, or
    # fragment), e.g. https://headscale.example.org.
    url: ""
    # -- Bearer API key. Prefer the TS2OTEL_HEADSCALE__API_KEY secret over an inline value.
    api_key: ""
    # -- Read headscale.api_key from this path instead of an inline value (mounted-Secret style).
    # Set the value or the file, not both; the file's content is whitespace-trimmed.
    api_key_file: ""
    # -- Tailnet address CIDRs allocated by this Headscale. Empty preserves the Tailscale
    # defaults. Entries must be canonical and fully inside RFC1918, fc00::/7, or 100.64.0.0/10.
    ip_prefixes: [] # @schema item: string
    # -- Cap on ONE Headscale API response body before it is decoded, in bytes.
    # Sized from a measured ~715 B/node, so 4 MiB covers roughly 5,800 nodes. These
    # endpoints are not paginated, so a larger deployment needs a larger value —
    # raise the container memory limit alongside it, since decoding costs several
    # times the wire size. A value above 64 MiB triggers a startup warning.
    max_response_bytes: 4194304
    http: # @schema additionalProperties:false
      # -- Per-attempt timeout for Headscale API calls; retry/rate-limit queueing is outside it.
      timeout: 30s
      # -- Retry policy for retryable transport errors, HTTP 429 and HTTP 5xx.
      retry: # @schema additionalProperties:false
        max_attempts: 0
        base_delay: 0s
        max_delay: 0s
      rate_limit: 0

  # Tailscale PAM's independent Border0 API connection. The collector is opt-in below.
  pam: # @schema additionalProperties:false
    # -- Static read-only service-account bearer token. Prefer secret.TS2OTEL_PAM__TOKEN.
    token: ""
    # -- Border0 API base URL.
    api_url: https://api.border0.com/api/v1

  tailscale: # @schema additionalProperties:false
    # -- Tailnet name, or "-" for the auth principal's default tailnet (the default,
    # which works out of the box for single-tailnet OAuth). Override with the
    # TS2OTEL_TAILSCALE__TAILNET env var (set via secret above).
    tailnet: "-"
    auth: # @schema additionalProperties:false
      # -- Auth method: oauth (recommended) | apikey | workload_identity. Prefer an OAuth client
      # (short-lived scoped tokens, not user-tied); a personal API key expires in <=90 days and is
      # user-tied, and the exporter logs a WARN when apikey is selected. workload_identity is the
      # keyless OIDC exchange — no stored secret at all, ideal for a Kubernetes ServiceAccount token.
      method: oauth
      oauth: # @schema additionalProperties:false
        # -- OAuth client ID. Set via TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_ID (secret).
        client_id: ""
        # -- OAuth client secret. Set via TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_SECRET (secret).
        client_secret: ""
        # -- Read the OAuth client secret from this path instead of an inline value. Point it at a
        # projected Secret volume to keep the credential out of the pod's environment entirely.
        # Set the value or the file, not both; the file's content is whitespace-trimmed.
        client_secret_file: ""
        # -- OAuth scopes to request. "all:read" covers every read-only collector.
        scopes: ["all:read"]
      # -- API key, used only when method: apikey. Set via TS2OTEL_TAILSCALE__AUTH__APIKEY (secret).
      apikey: ""
      # -- Read tailscale.auth.apikey from this path instead of an inline value.
      # Set the value or the file, not both; the file's content is whitespace-trimmed.
      apikey_file: ""
      # Keyless OIDC token exchange, used only when method: workload_identity. Pair a projected
      # ServiceAccount token volume with a federated OAuth client in the Tailscale admin console
      # and the deployment holds no long-lived Tailscale credential at all.
      workload_identity: # @schema additionalProperties:false
        # -- Federated OAuth client ID from the Tailscale admin console. Required for this method.
        client_id: ""
        # -- Path to the OIDC ID token exchanged for a Tailscale access token. In Kubernetes this
        # is a projected ServiceAccount token, e.g.
        # /var/run/secrets/tokens/tailscale. Re-read on every exchange, so
        # kubelet rotation is picked up without a restart.
        id_token_file: ""
    http: # @schema additionalProperties:false
      # -- Per-request HTTP timeout for Tailscale API calls.
      timeout: 30s
      retry: # @schema additionalProperties:false
        # -- Max attempts per request (incl. the first) before giving up.
        max_attempts: 4
        # -- Initial backoff delay; doubles each retry up to max_delay.
        base_delay: 500ms
        # -- Ceiling on the per-retry backoff delay.
        max_delay: 10s
      # -- Global requests/sec across all collectors (0 = unlimited).
      rate_limit: 0
    # -- Cap on the response body read from a Tailscale snapshot endpoint (devices, keys,
    # dns, services, …) before it is decoded, in bytes (4 MiB). Bounds peak decode memory.
    # Fleet-wide: a tailnets[] entry does NOT override it.
    max_response_bytes: 4194304
    # -- Same ceiling for the bulk log pulls (flow logs, audit logs), which are legitimately
    # multi-MB, in bytes (32 MiB). Decoding costs several times the wire size, so keep both
    # budgets well under resources.limits.memory — above 64 MiB the app raises a startup advisory.
    max_log_response_bytes: 33554432
    # -- Opt in to alpha organization-tailnet roster discovery. Empty keeps the explicit
    # tailscale.tailnet/tailnets configuration authoritative.
    organization: ""

  otlp: # @schema additionalProperties:false
    # -- Export protocol: http | grpc | stdout (stdout = local debug).
    protocol: http
    # -- OTLP endpoint base URL. For Grafana Cloud use the otlp-gateway URL for YOUR region
    # (the /v1/metrics and /v1/logs paths are appended automatically on the http protocol).
    endpoint: "https://otlp-gateway-prod-us-central-0.grafana.net/otlp"
    grafana_cloud: # @schema additionalProperties:false
      # -- Grafana Cloud instance/stack ID. Convenience: expands to an
      # "Authorization: Basic <base64(instance_id:token)>" header.
      # Set via TS2OTEL_OTLP__GRAFANA_CLOUD__INSTANCE_ID (secret).
      instance_id: ""
      # -- Grafana Cloud OTLP token paired with instance_id.
      # Set via TS2OTEL_OTLP__GRAFANA_CLOUD__TOKEN (secret).
      token: ""
      # -- Read the Grafana Cloud token from this path instead of an inline value.
      # Set the value or the file, not both; the file's content is whitespace-trimmed.
      token_file: ""
    # -- Extra raw headers (alternative to grafana_cloud, e.g. for a non-Grafana backend).
    headers: {}
    tls: # @schema additionalProperties:false
      # -- Disable transport security ENTIRELY (plaintext) — this is NOT a certificate-verification
      # skip, see insecure_skip_verify for that. The Authorization header built from grafana_cloud
      # rides on whatever transport this selects, so `true` puts that credential on the wire
      # unencrypted. Only ever for a trusted in-cluster Collector, never across an untrusted network.
      insecure: false
      # -- Keep TLS on but skip server-certificate verification (self-signed / private-CA gateways,
      # testing only). Distinct from `insecure` above; prefer ca_file in production.
      insecure_skip_verify: false
      # -- Path to a CA bundle to verify the server certificate.
      ca_file: ""
      # -- Client certificate for mutual TLS.
      cert_file: ""
      # -- Client private key for mutual TLS.
      key_file: ""
    # -- How often metrics are pushed (the metric export interval).
    metric_interval: 60s
    # -- Maximum datapoints per OTLP metric request. Serialized bytes vary with labels; lower values trade more requests for smaller payloads.
    metric_export_batch_size: 10000
    # -- Metric aggregation temporality: cumulative (Grafana Cloud default) or delta.
    metric_temporality: cumulative # @schema enum:["cumulative","delta"]
    # -- Re-summary cadence while an OTLP delivery outage continues.
    outage_summary_interval: 5m
    limits: # @schema additionalProperties:false
      # -- Cap one log record's body before export. A receiver's request-body limit bounds a whole
      # inbound request, but a valid request can still carry one enormous record that dominates a
      # batch or breaches the backend's per-record limit. Truncation is UTF-8 safe, runs AFTER
      # redaction so a secret can never be half-redacted, and leaves an explicit marker. Minimum 64;
      # there is deliberately no unlimited setting.
      log_body_bytes: 32768
      # -- Cap each individual string-valued log attribute. Never applied to metric labels, which
      # must stay byte-exact or the series splits. Minimum 64.
      log_attribute_value_bytes: 4096
    # -- Request compression: gzip | none. Empty defers to
    # OTEL_EXPORTER_OTLP[_<SIGNAL>]_COMPRESSION, then the exporter default.
    compression: ""
    # -- Per-request export timeout. 0 defers to OTEL_EXPORTER_OTLP[_<SIGNAL>]_TIMEOUT, then the
    # exporter's 10s default.
    timeout: 0s
    # -- Bytes; a client-side REJECTION guard, not a splitter — it fails an oversized request
    # instead of shipping it into a backend 413. Use metric_export_batch_size to actually stay
    # under an ingest limit. 0 = no cap.
    max_request_size: 0
    # -- Force a fresh gRPC connection attempt after this long. gRPC only; 0 = the gRPC client
    # default. A rotated client certificate takes effect on both transports immediately, but a
    # rotated CA bundle on gRPC only takes effect on the NEXT new connection — this bounds that.
    grpc_reconnection_period: 0s
    retry: # @schema additionalProperties:false
      # -- An explicit false genuinely disables retry (distinct from omitting this whole block,
      # which keeps the exporter's own default of retry-on). Unset (null) here means "leave the
      # exporter default".
      enabled: null
      # -- First backoff delay.
      initial_interval: 5s
      # -- Backoff ceiling.
      max_interval: 30s
      # -- Give up after this long.
      max_elapsed_time: 1m
    batch: # @schema additionalProperties:false
      logs: # @schema additionalProperties:false
        # -- Records buffered before new ones are dropped (non-blocking by design). 0 = SDK default.
        max_queue_size: 0
        # -- Records per export; must be <= max_queue_size when both are set. 0 = SDK default.
        export_max_batch_size: 0
        # -- How often a partial batch is flushed. 0 = SDK default.
        export_interval: 0s
        # -- Bound on one export attempt. 0 = SDK default.
        export_timeout: 0s
      traces: # @schema additionalProperties:false
        # -- Spans buffered before new ones are dropped. 0 = SDK default.
        max_queue_size: 0
        # -- Spans per export; must be <= max_queue_size when both are set. 0 = SDK default.
        export_max_batch_size: 0
        # -- How often a partial batch is flushed. 0 = SDK default.
        export_interval: 0s
        # -- Bound on one export attempt. 0 = SDK default.
        export_timeout: 0s
    stdout: # @schema additionalProperties:false
      # -- Metric push cadence when otlp.protocol is stdout — a short cadence so a debug run
      # doesn't wait 60s for a metric. Logs and spans are emitted synchronously regardless. 0 =
      # the stdout exporter's own default.
      metric_interval: 5s
      # -- Indent the emitted JSON.
      pretty: false
    credential_reload: # @schema additionalProperties:false
      # -- Governs only the background poller; last-known-good validation is always retained for
      # a configured file regardless of this flag.
      enabled: false
      # -- Poll period; minimum 5s. Ignored when enabled is false.
      interval: 30s
    # -- Send ONE signal (metrics) somewhere else — a different collector, tenant, credential or
    # protocol. Every field here inherits the matching otlp.* value above when left empty/null,
    # EXCEPT headers, which REPLACES otlp.headers rather than merging — a credential never
    # crosses a signal boundary.
    metrics: # @schema additionalProperties:false
      # -- null inherits (the signal is on); false stops exporting this signal without disturbing the others.
      enabled: null
      # -- Empty inherits otlp.protocol.
      protocol: ""
      # -- Empty inherits otlp.endpoint.
      endpoint: ""
      # -- REPLACES otlp.headers for this signal rather than merging.
      headers: {}
      tls: # @schema additionalProperties:false
        # -- null inherits; explicit true/false overrides.
        insecure: null
        # -- null inherits; explicit true/false overrides.
        insecure_skip_verify: null
        # -- Empty inherits otlp.tls.ca_file.
        ca_file: ""
        # -- Empty inherits otlp.tls.cert_file.
        cert_file: ""
        # -- Empty inherits otlp.tls.key_file.
        key_file: ""
      # -- Empty inherits otlp.compression.
      compression: ""
      # -- 0 inherits otlp.timeout.
      timeout: 0s
      # -- 0 inherits otlp.max_request_size.
      max_request_size: 0
      # -- 0 inherits otlp.grpc_reconnection_period.
      grpc_reconnection_period: 0s
      retry: # @schema additionalProperties:false
        # -- An untouched block inherits otlp.retry; setting ANY field overrides the whole policy for this signal.
        enabled: null
        initial_interval: 0s
        max_interval: 0s
        max_elapsed_time: 0s
    # -- Send ONE signal (logs) somewhere else. Same inheritance rules as otlp.metrics above.
    logs: # @schema additionalProperties:false
      # -- null inherits (the signal is on); false stops exporting this signal without disturbing the others.
      enabled: null
      # -- Empty inherits otlp.protocol.
      protocol: ""
      # -- Empty inherits otlp.endpoint.
      endpoint: ""
      # -- REPLACES otlp.headers for this signal rather than merging.
      headers: {}
      tls: # @schema additionalProperties:false
        # -- null inherits; explicit true/false overrides.
        insecure: null
        # -- null inherits; explicit true/false overrides.
        insecure_skip_verify: null
        # -- Empty inherits otlp.tls.ca_file.
        ca_file: ""
        # -- Empty inherits otlp.tls.cert_file.
        cert_file: ""
        # -- Empty inherits otlp.tls.key_file.
        key_file: ""
      # -- Empty inherits otlp.compression.
      compression: ""
      # -- 0 inherits otlp.timeout.
      timeout: 0s
      # -- 0 inherits otlp.max_request_size.
      max_request_size: 0
      # -- 0 inherits otlp.grpc_reconnection_period.
      grpc_reconnection_period: 0s
      retry: # @schema additionalProperties:false
        # -- An untouched block inherits otlp.retry; setting ANY field overrides the whole policy for this signal.
        enabled: null
        initial_interval: 0s
        max_interval: 0s
        max_elapsed_time: 0s
    # -- Send ONE signal (traces) somewhere else. Same inheritance rules as otlp.metrics above;
    # credentials are never shared across a signal boundary.
    traces: # @schema additionalProperties:false
      # -- null inherits (the signal is on); false stops exporting this signal without disturbing the others.
      enabled: null
      # -- Empty inherits otlp.protocol.
      protocol: ""
      # -- Empty inherits otlp.endpoint.
      endpoint: ""
      # -- REPLACES otlp.headers for this signal rather than merging.
      headers: {}
      tls: # @schema additionalProperties:false
        # -- null inherits; explicit true/false overrides.
        insecure: null
        # -- null inherits; explicit true/false overrides.
        insecure_skip_verify: null
        # -- Empty inherits otlp.tls.ca_file.
        ca_file: ""
        # -- Empty inherits otlp.tls.cert_file.
        cert_file: ""
        # -- Empty inherits otlp.tls.key_file.
        key_file: ""
      # -- Empty inherits otlp.compression.
      compression: ""
      # -- 0 inherits otlp.timeout.
      timeout: 0s
      # -- 0 inherits otlp.max_request_size.
      max_request_size: 0
      # -- 0 inherits otlp.grpc_reconnection_period.
      grpc_reconnection_period: 0s
      retry: # @schema additionalProperties:false
        # -- An untouched block inherits otlp.retry; setting ANY field overrides the whole policy for this signal.
        enabled: null
        initial_interval: 0s
        max_interval: 0s
        max_elapsed_time: 0s

  # -- Process-wide telemetry topology. otlp preserves historical push-only delivery;
  # prometheus serves /metrics while suppressing inherited OTLP metrics, logs, and traces;
  # dual enables both. An explicit otlp.<signal>.endpoint opts only that signal back in under prometheus.
  delivery: # @schema additionalProperties:false
    # -- Delivery mode: otlp \| prometheus \| dual.
    mode: otlp

  enrichment: # @schema additionalProperties:false
    # -- Staleness alarm threshold for the device-enrichment cache (drives the
    # tailscale2otel.enrich.cache_age self-obs gauge); does not evict entries.
    cache_ttl: 5m
    # -- Mark control-plane identity cached longer than this as stale; 0 disables.
    device_cache_stale_after: 0s
    reverse_dns: # @schema additionalProperties:false
      # -- Opt-in reverse-DNS (PTR) enrichment of EXTERNAL flow addresses; resolved names replace
      # the "external" bucket in tailscale.src/dst.node (flow logs always; flow metrics when
      # cardinality.flow.node_dims is on). On flow METRICS this can add ~one series per external IP.
      enabled: false
      # -- Resolver to query as "ip" or "ip:port" (default port 53); empty = system/container resolver.
      server: ""
      # -- Per-lookup timeout.
      timeout: 2s
      # -- How long a resolved name is cached (PTRs rarely change, so a long TTL keeps resolver load low).
      cache_ttl: 24h
      # -- How long a failed lookup is remembered (suppresses retries).
      negative_ttl: 5m
      # -- Keep serving a resolved name this long past cache_ttl while one background refresh runs.
      # Stops the flow label flapping to "external" at every TTL expiry. 0 disables stale serving.
      stale_ttl: 1h
      # -- Cache size bound; new external IPs beyond this are not resolved (~150 bytes/entry).
      max_entries: 50000
      # -- Acknowledge the flow-metric cardinality cost of enabled+node_dims and silence the startup
      # advisory (config_warnings_ratio). Set true once cardinality.metric_limit is sized for it.
      acknowledge_cardinality: false
    geoip: # @schema additionalProperties:false
      # -- Opt-in geolocation and autonomous-system enrichment of EXTERNAL flow addresses, from
      # MaxMind .mmdb files on local disk. Lookups never touch the network. Tailnet addresses (the
      # CGNAT range 100.64.0.0/10 and the ULA fd7a:115c:a1e0::/48) are never geolocated.
      enabled: false
      # -- Path to a GeoLite2/GeoIP2 Country .mmdb. A City database also works and additionally fills
      # locality, region and coordinates on flow LOGS. Left empty when download.enabled is set, it
      # defaults to where the downloader installs the file.
      country_database: ""
      # -- Path to a GeoLite2/GeoIP2 ASN .mmdb. The AS number and organization ride flow LOGS only.
      asn_database: ""
      # -- Re-stat the database paths and hot-swap a changed file. This is what makes an external
      # updater (a geoipupdate CronJob, an init container, a mounted volume) work. 0 disables.
      # Not the same clock as download.interval, which asks MaxMind for a newer build.
      reload_interval: 6h
      # -- Acknowledge the cardinality cost of cardinality.flow.geo_dims on the RAW flow families and
      # silence the startup advisory. Set true once cardinality.metric_limit is sized for it.
      acknowledge_cardinality: false
      download: # @schema additionalProperties:false
        # -- Fetch databases from MaxMind directly, so no geoipupdate sidecar is needed. Leave off if
        # something else supplies the files. Note the databases are held in memory: budget roughly
        # 9 MB for Country plus 12 MB for ASN on top of the container's normal footprint.
        enabled: false
        # -- MaxMind account ID (a free GeoLite2 account is enough).
        account_id: ""
        # -- MaxMind license key. Prefer existingSecret / an env var over putting it in values.yaml.
        license_key: ""
        # -- Read the license key from a file instead (mounted Kubernetes secret).
        license_key_file: ""
        # -- MaxMind edition IDs to fetch; each installs as <directory>/<edition>.mmdb. Swap
        # GeoLite2-Country for GeoLite2-City to add locality and coordinates to flow logs.
        editions:
          - GeoLite2-Country
          - GeoLite2-ASN
        # -- Where downloaded databases are installed. Empty uses the platform state directory, which
        # in the container image is the same volume as the checkpoint file — mount one, or the
        # databases are re-downloaded on every restart.
        directory: ""
        # -- How often to ask MaxMind for a newer build. Each check is a conditional request, so an
        # unchanged database costs a 304 and no download quota.
        interval: 24h
        # -- Per-edition download timeout.
        timeout: 5m
        # -- Download API base. Override only for a local mirror.
        endpoint: "https://download.maxmind.com/geoip/databases"

  cardinality: # @schema additionalProperties:false
    # -- Hard per-metric series cap (0/negative = unlimited).
    metric_limit: 10000
    # -- Emit per-DERP-region rollup gauges (tailscale.derp.region.*) on the devices collector.
    derp_region_rollup: true
    # -- Emit the per-CIDR tailscale.subnet_routes.routers redundancy gauge (one series per subnet CIDR);
    # the fleet exit/subnet count aggregates emit regardless.
    subnet_route_rollup: true
    # -- Status-page cardinality view flags a metric at/above this active-series count (self-obs only; 0 disables).
    warning_threshold: 2000
    # -- Status-page cardinality view flags a metric critically at/above this count (>= warning_threshold; <= metric_limit when set; 0 disables).
    critical_threshold: 8000
    # -- Distinct values retained per (metric,label) for the label-cardinality views; beyond it the label is capped and examples truncated (0 disables label capture).
    label_value_sample_cap: 100
    flow: # @schema additionalProperties:false
      # -- Which flow metric families to emit: rollup (default) | all | both. rollup = bounded top-N
      # *.rollup families (busiest src/dst node pairs by bytes; remainder folds into an __other__ series so
      # totals are preserved; no L4 ports; adds tailscale.network.unique.* gauges). all = raw per-connection
      # tailscale.network.io/packets shaped by the toggles below. both = emit both (~2x series; summing double-counts).
      metrics_mode: rollup
      # -- Rollup only: busiest src/dst node pairs kept per flush; the rest fold into __other__. 0 = default (500).
      rollup_top_n: 500
      # -- Add source.port to flow METRICS. INERT under metrics_mode: rollup (raw families only), and
      # the most expensive knob in this block — ephemeral source ports are effectively unbounded.
      # Ports are always present on flow LOGS regardless.
      source_port: false
      # -- Add destination.port to flow METRICS. INERT under metrics_mode: rollup, where
      # tailscale.dst.service is the bounded stand-in (and is always emitted, no toggle).
      destination_port: false
      # -- Include tailscale.src.node/tailscale.dst.node on flow metrics — who talked to whom. Off
      # keeps totals accurate but drops the per-peer breakdown, and suppresses the
      # tailscale.network.unique.* gauges (keyed by source node, so they would reintroduce exactly the
      # cardinality this removes). The single biggest cardinality lever here.
      node_dims: true
      # -- Bucket unresolved IPs as external/unknown to cap cardinality. Affects flow LOGS and,
      # when node_dims is true, the src/dst node labels on flow METRICS.
      collapse_external: true
      # -- Emit the bounded tailscale.exit_node.io/packets counters attributing exit traffic to the
      # relaying node (bounded by exit-node count); independent of metrics_mode.
      exit_node_attribution: true
      # -- Add source/destination geo.country.iso_code and geo.continent.code to flow METRICS.
      # Requires enrichment.geoip.enabled. Nearly free under metrics_mode: rollup, which is top-N
      # bounded whatever the key carries; on the RAW families with collapse_external on it splits the
      # single "external" series up to ~250 ways. The AS number/organization and any city-level
      # fields NEVER reach a metric; flow LOGS carry all of them regardless of this toggle.
      geo_dims: false
      # -- Add the per-flow endpoint identity — tailscale.{src,dst}.user, .tags and .os — to flow
      # METRICS, on the raw AND rollup families. Read from the node blocks the control plane embeds in
      # each flow record, so it costs no extra API call. Identity is a property of the NODE, so with
      # node_dims on this widens the label set without multiplying the series count. REQUIRES
      # node_dims and is ignored without it, since identity would then be the only dimension
      # splitting the metric. On the rollup families the __other__ remainder drops identity: the fold
      # is many nodes, so it has no single user to report. Off by default only because `user` is an
      # email address; pii_filter.emails still applies. Flow LOGS carry these regardless.
      identity_dims: false
    per_entity: # @schema additionalProperties:false
      # -- Emit per-device gauges (online/last_seen/key.expiry/derp/routes); false emits only the
      # aggregate tailscale.devices.count rollup.
      device: true
      # -- Emit per-user gauges (devices/connected/last_seen); false emits only tailscale.users.count.
      user: true
      # -- Emit the per-key expiry gauge; false emits only tailscale.keys.count (the key-expiry warning log still fires).
      key: true
      # -- Emit the per-endpoint webhook subscriptions gauge; false emits only tailscale.webhook_endpoints.count.
      webhook: true
      # -- Emit the per-service ports/hosts gauges; false emits only tailscale.services.count.
      service: true

  collectors: # @schema additionalProperties:false
    devices: # @schema additionalProperties:false
      # -- Enable the devices collector (device.online/last_seen/key_expiry/update_available).
      enabled: true
      # -- Poll interval.
      interval: 60s
      # -- Emit structured device add/remove and field-change records. PII-bearing fields still
      # follow pii_filter.
      change_log_enabled: false
      # -- Also collect advertised/enabled subnet routes and per-DERP latency via the rich
      # GET /devices?fields=all endpoint.
      collect_routes: false
      # -- Emit per-device NAT/connectivity health (tailscale.device.connectivity.*) plus the fleet
      # connectivity rollups (tailscale.devices.hard_nat/direct_capable/client_supports) from the rich
      # device payload (no extra API call). Per-device gauges additionally gated by per_entity.device.
      collect_connectivity: true
      # -- Emit per-device posture attributes as log records (gated; requires posture identity on).
      collect_posture: false
      # -- How the tailscale.device.posture log behaves when collect_posture is on: changes (full
      # dump on the first scrape, then deltas only), always (every scrape), or off (suppress the log;
      # the posture gauge metric is still emitted). `always` on a large fleet is a lot of log volume.
      posture_log_mode: changes
      # -- Node-key and posture-attribute expiry WARN cadence: daily (change plus at most one
      # reminder per 24h, default), always (every scrape, legacy), or off. Metrics always emit.
      expiry_log_mode: daily
      # -- Inventory outstanding device-share invites via GET /device/{id}/device-invites (one API
      # call per device, N+1; needs the device_invites:read OAuth scope, covered by all:read).
      # Emits tailscale.device_invites.count; per-device fetch failures are non-fatal.
      collect_device_invites: true
      # -- Bounded concurrency for posture/invite per-device subrequests. 1 is sequential.
      subrequest_concurrency: 1
      # -- Exact-match posture checks; missing/different attributes count as failing.
      posture_compliance_checks: []
      # -- Posture-attribute namespace prefixes promoted to the tailscale.device.attribute{,.info}
      # metrics (needs collect_posture). `["*"]` = every namespace incl. node/custom; `[]` = disabled.
      attribute_namespaces: [intune, jamf, kandji, crowdstrike, sentinelone, kolide, ip]
      # -- Busiest posture attribute keys promoted fleet-wide; overflow keys are dropped and
      # counted. 0 or negative = unlimited; cardinality.metric_limit is the final SDK guard.
      attribute_key_limit: 200
      # -- Busiest values per attribute key on the .info gauge; overflow folds to "__other__".
      # 0 or negative = unlimited.
      attribute_value_limit: 50
      # -- Emit the tailscale.devices.by_tag distribution gauge (one series per ACL tag).
      # false keeps the other fleet-hygiene aggregates (untagged/ephemeral/by_version/key_expiry).
      collect_tag_rollup: true
      # -- Cap on distinct tag series for by_tag: busiest N tags keep their own series, the rest
      # fold into tailscale.tag="__other__". 0 or negative = unlimited.
      tag_rollup_limit: 50
    flowlogs: # @schema additionalProperties:false
      # -- Enable the network-flow-logs collector (aggregated metrics + full-fidelity logs).
      enabled: true
      # -- Ingestion source: poll | stream | objectstore | both. PICK ONE method per log
      # type: `both` runs poll AND the `streaming` receiver and risks double-counting —
      # cross-source de-duplication is a best-effort FAILSAFE, not a guarantee. The exporter
      # logs a WARN at startup when streaming is enabled while this collector still polls or
      # reads the export bucket. Set `stream` (not poll/both) when config.streaming.enabled is
      # true; set `objectstore` and fill in the objectstore block below to read Tailscale's
      # S3 export instead of calling the API.
      source: poll
      # -- Poll interval.
      interval: 60s
      # -- Tail-hazard lag: never poll closer than this to now, so a window only closes once
      # Tailscale has finished writing it (avoids missing late-arriving records).
      lag: 120s
      # -- Cold-start lookback on first run when no checkpoint exists.
      initial_lookback: 5m
      # -- Maximum width of a single poll window (caps catch-up after downtime).
      max_window: 1h
      # -- Identities retained for poll-window and cross-source dedup. Must be positive.
      dedup_capacity: 16384
      # -- Reread this much before the durable high-water mark so records that became available
      # after the first completed query can still arrive. 0 disables; maximum 1h.
      replay_overlap: 5m
      # -- Maximum durable SHA-256 connection identities retained to suppress the intentional
      # replay across restart. Must be 1..1048576 while replay_overlap is enabled.
      replay_seen_capacity: 131072
      # -- Verified FlowLog.NodeID values classified as `configured`. Empty together with
      # trusted_reporter_tags leaves reporter trust `unconfigured`.
      trusted_reporter_node_ids: []
      # -- Authoritative device tags that classify a verified reporter as `tagged`. Tags embedded
      # in the flow record are unverified and never grant trust; unmatched reporters are `untrusted`.
      trusted_reporter_tags: []
      # -- Flow-log verbosity: per_connection | per_record | off (off = metrics only, no logs).
      log_mode: per_connection
      # -- Cap on flow LOG records per poll window (0 = unlimited). Excess is counted into
      # tailscale.network.flow.logs_dropped; METRICS are never capped, only logs.
      max_log_records_per_window: 0
      objectstore: # @schema additionalProperties:false
        # -- Service URL of the S3-compatible store holding Tailscale's flow-log export, e.g.
        # https://s3.eu-west-2.amazonaws.com or a MinIO address. REQUIRED when source is
        # objectstore; never derived from the region, because a non-AWS implementation would be
        # derived wrong. Leave "" for any other source.
        endpoint: ""
        # -- Bucket region. REQUIRED when source is objectstore: it is part of the request
        # signature, so a wrong value fails every request with HTTP 403.
        region: ""
        # -- Bucket Tailscale exports into. REQUIRED when source is objectstore.
        bucket: ""
        # -- The export's root within the bucket, above the YYYY/MM/DD partitions. No leading
        # slash: it becomes part of this feed's durable checkpoint identity, so removing one later
        # reads as a brand-new feed and re-emits already-ingested objects.
        prefix: ""
        # -- How objects are arranged under prefix: `partitioned` (the default, and what Tailscale's
        # own export writes: objects under prefix/YYYY/MM/DD/) or `flat` (a COPIED or mirrored export
        # whose self-contained YYYY-MM-DD-HH-MM-SS basenames sit directly under prefix). Flat also
        # finds partitioned objects, but has no partitions to bound re-listing, so it costs more LIST
        # requests; each cycle is still bounded and resumable. Not autodetected.
        layout: partitioned
        # -- Address as <endpoint>/<bucket>/<key> rather than <bucket>.<endpoint>/<key>.
        # Required by most non-AWS implementations; getting it backwards is a DNS failure.
        path_style: false
        # -- Permit plaintext HTTP to a remote object-store endpoint. Loopback HTTP works without
        # this flag for local MinIO development. Enabling it exposes signing credentials and
        # temporary session tokens to the network; prefer HTTPS.
        allow_insecure_http: false
        # -- How often the bucket is listed.
        interval: 60s
        # -- How far back past the cursor each listing reaches, so an object that arrived late is
        # still found. Keep it >= interval, or an object landing between two cycles can be missed.
        lookback: 1h
        # -- Cold-start reach-back, so a first run against a long history does not ingest all of it.
        # CAPPED IN EFFECT AT 14 DAYS under layout: partitioned — the reader enumerates at most 14
        # day partitions newest-first and the cursor only moves forward, so a larger value silently
        # ingests only the most recent 14 days (warned about at startup). Use layout: flat, which has
        # no partitions to cap, to reach further back.
        initial_lookback: 6h
        # -- Objects ingested per cycle. The remainder is counted, logged and picked up next cycle.
        max_objects: 200
        # -- Durable seen-object identities retained per destination.
        max_seen_keys: 5000
        # -- Maximum GET response bytes read from one object. A breach quarantines that object.
        max_object_wire_bytes: 67108864
        # -- Maximum decompressed bytes accepted from one object. A breach quarantines that object.
        max_object_decompressed_bytes: 33554432
        # -- Maximum records accepted from one object. A breach quarantines that object.
        max_object_records: 100000
        # -- Maximum GET response bytes read in one cycle. The current and untouched objects are deferred.
        # Must be at least max_object_wire_bytes.
        max_cycle_wire_bytes: 536870912
        # -- Maximum decompressed bytes processed in one cycle. Untouched objects are deferred.
        # Must be at least max_object_decompressed_bytes.
        max_cycle_decompressed_bytes: 268435456
        # -- Maximum records processed in one cycle. Untouched objects are deferred.
        # Must be at least max_object_records.
        max_cycle_records: 500000
        # NOTE: LEAVE THE THREE CREDENTIAL VALUE KEYS BELOW EMPTY. Anything set there is rendered
        # into the config and routes it to a Secret. Empty selects the
        # ambient chain (environment, then IRSA/web identity via a service-account annotation, then
        # the ECS/EKS Pod Identity container credential endpoint, then an EC2 instance profile) —
        # the right answer on EKS, with either IRSA or Pod Identity. For a MinIO/Ceph bucket with no role
        # to assume, set the TS2OTEL_COLLECTORS__FLOWLOGS__OBJECTSTORE__* keys under `secret:`
        # instead, or set the matching *_file path to a mounted Secret; the env layer overrides
        # this file.
        # -- Static S3 access key ID. Set via the TS2OTEL_* secret, not here.
        access_key_id: ""
        # -- Read the S3 access key ID from this mounted file instead of an inline value.
        # Set the value or the file, never both.
        access_key_id_file: ""
        # -- Static S3 secret access key. Set via the TS2OTEL_* secret, not here.
        secret_access_key: ""
        # -- Read the S3 secret access key from this mounted file instead of an inline value.
        # Set the value or the file, never both.
        secret_access_key_file: ""
        # -- Static S3 session token (temporary credentials only). Set via the TS2OTEL_* secret, not here.
        session_token: ""
        # -- Read the temporary S3 session token from this mounted file instead of an inline value.
        # Set the value or the file, never both.
        session_token_file: ""
    auditlogs: # @schema additionalProperties:false
      # -- Enable the configuration-audit-logs collector.
      enabled: true
      # -- Ingestion source: poll | stream | both | objectstore. Pick ONE method per log type (see
      # flowlogs.source): `both` risks double-counting and de-dup is only a best-effort
      # failsafe (WARNed at startup). Set `stream` when config.streaming.enabled is true.
      source: poll
      # -- Poll interval.
      interval: 60s
      # -- Tail-hazard lag (see flowlogs.lag).
      lag: 60s
      # -- Cold-start lookback on first run.
      initial_lookback: 5m
      # -- Maximum width of a single poll window.
      max_window: 6h
      # -- Identities retained for poll-window and audit/webhook cross-source dedup. Must be positive.
      dedup_capacity: 4096
      objectstore: # @schema additionalProperties:false
        # -- Service URL of the S3-compatible store holding Tailscale's CONFIGURATION-log export,
        # e.g. https://s3.eu-west-2.amazonaws.com or a MinIO address. REQUIRED when auditlogs.source
        # is objectstore. This is a SEPARATE export from the flow one: nothing here is inherited from
        # collectors.flowlogs.objectstore, and two destinations may not name the same bucket+prefix.
        endpoint: ""
        # -- Bucket region. REQUIRED when source is objectstore: it is part of the request
        # signature, so a wrong value fails every request with HTTP 403.
        region: ""
        # -- Bucket Tailscale exports configuration logs into. REQUIRED when source is objectstore.
        bucket: ""
        # -- The export's root within the bucket, above the YYYY/MM/DD partitions. Use a distinct
        # prefix when the flow and configuration exports share one bucket.
        prefix: ""
        # -- How objects are arranged under prefix: `partitioned` (the default, and what Tailscale's
        # own export writes: objects under prefix/YYYY/MM/DD/) or `flat` (a COPIED or mirrored export
        # whose self-contained YYYY-MM-DD-HH-MM-SS basenames sit directly under prefix). Flat also
        # finds partitioned objects, but has no partitions to bound re-listing, so it costs more LIST
        # requests; each cycle is still bounded and resumable. Not autodetected.
        layout: partitioned
        # -- Address as <endpoint>/<bucket>/<key> rather than <bucket>.<endpoint>/<key>.
        # Required by most non-AWS implementations; getting it backwards is a DNS failure.
        path_style: false
        # -- Permit plaintext HTTP to a remote object-store endpoint. Loopback HTTP works without
        # this flag for local MinIO development. Enabling it exposes signing credentials and
        # temporary session tokens to the network; prefer HTTPS.
        allow_insecure_http: false
        # -- How often the bucket is listed.
        interval: 60s
        # -- How far back past the cursor each listing reaches, so an object that arrived late is
        # still found. Keep it >= interval, or an object landing between two cycles can be missed.
        lookback: 1h
        # -- Cold-start reach-back, so a first run against a long history does not ingest all of it.
        # CAPPED IN EFFECT AT 14 DAYS under layout: partitioned — the reader enumerates at most 14
        # day partitions newest-first and the cursor only moves forward, so a larger value silently
        # ingests only the most recent 14 days (warned about at startup). Use layout: flat, which has
        # no partitions to cap, to reach further back.
        initial_lookback: 6h
        # -- Objects ingested per cycle. The remainder is counted, logged and picked up next cycle.
        max_objects: 200
        # -- Durable seen-object identities retained per destination.
        max_seen_keys: 5000
        # -- Maximum GET response bytes read from one object. A breach quarantines that object.
        max_object_wire_bytes: 67108864
        # -- Maximum decompressed bytes accepted from one object. A breach quarantines that object.
        max_object_decompressed_bytes: 33554432
        # -- Maximum records accepted from one object. A breach quarantines that object.
        max_object_records: 100000
        # -- Maximum GET response bytes read in one cycle. The current and untouched objects are deferred.
        # Must be at least max_object_wire_bytes.
        max_cycle_wire_bytes: 536870912
        # -- Maximum decompressed bytes processed in one cycle. Untouched objects are deferred.
        # Must be at least max_object_decompressed_bytes.
        max_cycle_decompressed_bytes: 268435456
        # -- Maximum records processed in one cycle. Untouched objects are deferred.
        # Must be at least max_object_records.
        max_cycle_records: 500000
        # NOTE: LEAVE THE THREE CREDENTIAL VALUE KEYS BELOW EMPTY — same contract as
        # flowlogs.objectstore above. Anything set there is rendered into the config and routes it to
        # a Secret. Empty selects the ambient chain. For a MinIO/Ceph bucket with no role to assume,
        # set the TS2OTEL_COLLECTORS__AUDITLOGS__OBJECTSTORE__* keys under `secret:` instead, or set
        # the matching *_file path to a mounted Secret; the env layer overrides this file.
        # -- Static S3 access key ID. Set via the TS2OTEL_* secret, not here.
        access_key_id: ""
        # -- Read the S3 access key ID from this mounted file instead of an inline value.
        # Set the value or the file, never both.
        access_key_id_file: ""
        # -- Static S3 secret access key. Set via the TS2OTEL_* secret, not here.
        secret_access_key: ""
        # -- Read the S3 secret access key from this mounted file instead of an inline value.
        # Set the value or the file, never both.
        secret_access_key_file: ""
        # -- Static S3 session token (temporary credentials only). Set via the TS2OTEL_* secret, not here.
        session_token: ""
        # -- Read the temporary S3 session token from this mounted file instead of an inline value.
        # Set the value or the file, never both.
        session_token_file: ""
    k8s_audit: # @schema additionalProperties:false
      # -- Enable the Kubernetes API-audit collector, which reads the events Tailscale's tsrecorder
      # writes for requests proxied through the Kubernetes operator's API-server proxy. Requires
      # `enableEvents` in the tailscale.com/cap/kubernetes ACL grant, which is BETA upstream.
      # NOTE: the source data carries no response status, latency or byte count, so allowed-vs-denied,
      # error rates and latency are NOT derivable from this feed.
      enabled: false
      objectstore: # @schema additionalProperties:false
        # -- Service URL of the S3-compatible store tsrecorder writes to, e.g.
        # https://s3.eu-west-1.amazonaws.com or a MinIO address. REQUIRED when k8s_audit is enabled.
        # This bucket is NEVER inherited from the flow or configuration-log destinations: it is a
        # separate bucket with its own key layout. There is deliberately no `source` key here —
        # object storage is the only surface tsrecorder exposes.
        endpoint: ""
        # -- Bucket region. REQUIRED: it is part of the request signature, so a wrong value fails
        # every request with HTTP 403.
        region: ""
        # -- Bucket tsrecorder writes recordings into. REQUIRED.
        bucket: ""
        # -- Root within the bucket. Usually EMPTY: tsrecorder keys are <stableID>/events/<ts>.event
        # and <stableID>/<ts>.cast, and <stableID> differs per recorder replica, so it cannot be
        # pinned in a prefix.
        prefix: ""
        # -- Object key layout. `recorder` is the only accepted value for this collector;
        # `partitioned` and `flat` are REFUSED, because tsrecorder writes no YYYY/MM/DD partitions
        # and its RFC3339Nano basenames are variable-width, so they do not sort like an export's.
        layout: recorder
        # -- Address as <endpoint>/<bucket>/<key> rather than <bucket>.<endpoint>/<key>.
        # Required by most non-AWS implementations; getting it backwards is a DNS failure.
        path_style: false
        # -- Permit plaintext HTTP to a remote object-store endpoint. Loopback HTTP works without
        # this flag for local MinIO development. Enabling it exposes signing credentials and
        # temporary session tokens to the network; prefer HTTPS.
        allow_insecure_http: false
        # -- How often the bucket is listed.
        interval: 60s
        # -- How far back past the cursor each listing reaches, so an object that arrived late is
        # still found. Keep it >= interval.
        lookback: 1h
        # -- Cold-start reach-back, so a first run against a long history does not ingest all of it.
        # The 14-day partition cap that applies to layout: partitioned does NOT apply here: the
        # recorder layout enumerates one flat prefix and has no day partitions to bound.
        initial_lookback: 6h
        # -- Objects ingested per cycle. The remainder is counted, logged and picked up next cycle.
        # tsrecorder writes ONE event per object, so a busy cluster needs a higher value here than a
        # flow or configuration-log export does.
        max_objects: 200
        # -- Durable seen-object identities retained per destination.
        max_seen_keys: 5000
        # -- Maximum GET response bytes read from one object. A breach quarantines that object.
        max_object_wire_bytes: 67108864
        # -- Maximum decompressed bytes accepted from one object. A breach quarantines that object.
        # RAISE THIS if you record long terminal sessions: only the .cast header line is read for
        # meaning, but the whole object is still streamed, and an oversized one is quarantined
        # rather than partially read.
        max_object_decompressed_bytes: 33554432
        # -- Maximum records accepted from one object. A breach quarantines that object.
        max_object_records: 100000
        # -- Maximum GET response bytes read in one cycle. The current and untouched objects are deferred.
        # Must be at least max_object_wire_bytes.
        max_cycle_wire_bytes: 536870912
        # -- Maximum decompressed bytes processed in one cycle. Untouched objects are deferred.
        # Must be at least max_object_decompressed_bytes.
        max_cycle_decompressed_bytes: 268435456
        # -- Maximum records processed in one cycle. Untouched objects are deferred.
        # Must be at least max_object_records.
        max_cycle_records: 500000
        # NOTE: LEAVE THE THREE CREDENTIAL VALUE KEYS BELOW EMPTY. Anything set there is rendered
        # into the config and routes it to a Secret. Empty selects the ambient chain (environment,
        # then IRSA/web identity, then the ECS/EKS Pod Identity container credential endpoint, then
        # an EC2 instance profile). For a MinIO/Ceph bucket with no role to assume, set the
        # TS2OTEL_COLLECTORS__K8S_AUDIT__OBJECTSTORE__* keys under `secret:` instead, or set the
        # matching *_file path to a mounted Secret; the env layer overrides this file.
        # -- Static S3 access key ID. Set via the TS2OTEL_* secret, not here.
        access_key_id: ""
        # -- Read the S3 access key ID from this mounted file instead of an inline value.
        # Set the value or the file, never both.
        access_key_id_file: ""
        # -- Static S3 secret access key. Set via the TS2OTEL_* secret, not here.
        secret_access_key: ""
        # -- Read the S3 secret access key from this mounted file instead of an inline value.
        # Set the value or the file, never both.
        secret_access_key_file: ""
        # -- Static S3 session token, for temporary credentials only. Set via the TS2OTEL_* secret.
        session_token: ""
        # -- Read the S3 session token from this mounted file instead of an inline value.
        # Set the value or the file, never both.
        session_token_file: ""
    users: # @schema additionalProperties:false
      # -- Enable the users collector (users.count, per-user devices/connected/last_seen).
      enabled: true
      # -- Poll interval (user data changes slowly).
      interval: 300s
    keys: # @schema additionalProperties:false
      # -- Enable the auth/API keys collector (key.expiry, keys.count).
      enabled: true
      # -- Poll interval.
      interval: 300s
      # -- Emit a tailscale.key.expiring WARN log when a key expires within this window.
      expiry_warn: 168h
      # -- Expiry WARN cadence: daily (change plus at most one reminder per 24h, default),
      # always (every scrape, legacy), or off. Metrics always emit.
      expiry_log_mode: daily
    settings: # @schema additionalProperties:false
      # -- Enable the tailnet-settings collector (setting.enabled flags, key-duration).
      enabled: true
      # -- Poll interval (settings change rarely).
      interval: 600s
      # -- Emit the complete settings response to logs on change plus a heartbeat.
      snapshot_enabled: false
    pam: # @schema additionalProperties:false
      # -- Enable Border0-only PAM inventory, configuration shape and session telemetry.
      enabled: false
      # -- Connector/service/policy/identity/org inventory and configuration-shape interval.
      interval: 600s
      # -- Incremental newest-first session polling interval.
      sessions_interval: 60s
      # -- Emit redacted PAM configuration snapshots on change plus a heartbeat.
      snapshot_enabled: false
      # -- Refresh unchanged snapshots at this cadence.
      snapshot_heartbeat: 24h
      # -- Maximum serialized snapshot event body in bytes.
      snapshot_body_bytes: 32768 # @schema minimum:1
    acl: # @schema additionalProperties:false
      # -- Enable the ACL/policy collector (acl.last_changed, acl.size, acl.rules by section).
      enabled: true
      # -- Poll interval.
      interval: 600s
      # -- EXPLICIT PII CONSENT: ship the raw policy and diffs, including every user email and
      # group member, to the logs backend. This overrides pii_filter for those bodies, so logs
      # retention holds tailnet identity data.
      snapshot_enabled: false
      # -- Refresh an unchanged raw policy snapshot at this cadence.
      snapshot_heartbeat: 24h
      # -- Validate the active policy each tick via the non-mutating `POST /acl/validate` (needs only `policy_file:read`). Set false to keep the API client strictly GET-only.
      validate: true
    dns: # @schema additionalProperties:false
      # -- Enable the DNS collector (nameservers/search-paths/split-zones counts, MagicDNS).
      enabled: true
      # -- Poll interval.
      interval: 600s
      # -- Emit the complete DNS response to logs on change plus a heartbeat.
      snapshot_enabled: false
    contacts: # @schema additionalProperties:false
      # -- Enable the contacts collector (account/support/security contact verification; no emails emitted).
      enabled: true
      # -- Poll interval.
      interval: 600s
    webhooks: # @schema additionalProperties:false
      # -- Enable the webhook-endpoint inventory collector (count + per-endpoint subscriptions; no url/secret).
      enabled: true
      # -- Poll interval.
      interval: 600s
      # -- Emit the complete webhook inventory response to logs on change plus a heartbeat.
      snapshot_enabled: false
      # -- Optional expected webhook event categories (e.g. `["nodeCreated","userSuspended"]`); empty means no expectation is checked.
      desired_events: []
    posture_integrations: # @schema additionalProperties:false
      # -- Enable the device-posture-integration collector (MDM/EDR matched counts + last_sync staleness).
      enabled: true
      # -- Poll interval.
      interval: 600s
      # -- Emit the complete posture-integration response to logs on change plus a heartbeat.
      snapshot_enabled: false
    log_stream: # @schema additionalProperties:false
      # -- Enable the log-streaming delivery-health collector. Self-gates to configured=0 (no error)
      # when no SIEM sink is configured for a log type.
      enabled: true
      # -- Poll interval.
      interval: 600s
      # -- Independent configuration-log probe cadence; 0 inherits interval.
      configuration_interval: 0s
      # -- Independent network-log probe cadence; 0 inherits interval.
      network_interval: 0s
    oauth_apps: # @schema additionalProperties:false
      # -- Enable the OAuth-application inventory collector (count, per-app scope/node-attribute
      # gauges). Alpha API — idles silently, with no error, on tailnets that do not have it.
      enabled: true
      # -- Poll interval.
      interval: 300s
    services: # @schema additionalProperties:false
      # -- Enable the Tailscale Services (VIP) collector (services.count + per-service ports/hosts).
      enabled: true
      # -- Poll interval.
      interval: 600s
      # -- Also collect per-service backing-host detail (approval/configured state) — one extra API
      # call per service (N+1). Off by default.
      collect_hosts: false
      # -- Bounded concurrency for backing-host subrequests. 1 is sequential.
      subrequest_concurrency: 1
      # -- Emit the tailscale.services.by_tag distribution gauge (one series per ACL tag).
      # false disables this rollup while service count and other enabled signals continue.
      collect_tag_rollup: true
      # -- Cap on distinct tag series for by_tag: busiest N tags keep their own series, the rest
      # fold into tailscale.tag="__other__". 0 or negative = unlimited.
      tag_rollup_limit: 50
    # Optional: scrape tailscaled per-node Prometheus /metrics endpoints and forward
    # them centrally over OTLP. Off by default; disabled when no targets are configured.
    node_metrics: # @schema additionalProperties:false
      # -- Enable the node-metrics scraper. Requires at least one entry in `targets`.
      enabled: false
      # -- Scrape interval for every target.
      interval: 60s
      # -- Per-scrape HTTP timeout.
      timeout: 10s
      # -- List of scrape targets. Each: {url, instance, labels{}, bearer_token, bearer_token_file,
      # headers{}, tls{insecure,ca_file,cert_file,key_file}}. The "instance" label is the node identity.
      targets: []
      # -- Passthrough allow-list: anchored regex on the forwarded metric NAME; if non-empty, only matching names are forwarded.
      metric_allow: []
      # -- Passthrough deny-list: anchored regex; names matching any are dropped (after metric_allow).
      metric_deny: []
      # -- Label keys stripped from every forwarded series (the instance label is never dropped).
      drop_labels: []
      # -- Cap on the response body read from one target per scrape, in bytes (4 MiB). Bounds
      # memory: an over-cap body fails that one scrape rather than buffering unbounded.
      max_response_bytes: 4194304
      # -- Cap on samples parsed from one target per scrape. Bounds cardinality: an over-cap
      # target fails that one scrape rather than forwarding the whole set. Must be > 0 when enabled.
      max_samples: 50000
      # -- Cap on DISTINCT forwarded metric NAMES over the process lifetime. A target chooses its
      # own metric names and each unseen name creates an instrument that is never released, so
      # max_samples alone does not bound them. 0 = 2000 default, <0 = unlimited; names beyond the
      # budget are dropped and counted rather than silently ignored.
      max_distinct_metrics: 2000
      # Discover scrape targets from the Tailscale devices API instead of (or alongside) the
      # static `targets` list above. Discovered targets are unioned with the static ones,
      # deduped by URL with static winning, on this block's own interval.
      discovery: # @schema additionalProperties:false
        # -- Turn on dynamic target discovery.
        enabled: false
        # -- How often the devices API is polled for targets (independent of the scrape interval).
        interval: 300s
        # -- Cap on emitted discovered targets per refresh (one per selected port, not one per device).
        max_targets: 1000
        # -- Metrics-endpoint scheme applied to each discovered device: http | https.
        scheme: http
        # -- Metrics port on each device (tailscaled's default is 5252).
        port: 5252
        # -- Map ACL tags to replacement metrics-port lists. A matching tag replaces `port`;
        # multiple matches use their sorted, deduplicated union. File-only in the standalone config.
        port_overrides: {}
        # -- Metrics path on each device.
        path: /metrics
        # -- Only devices currently connected to the control plane.
        online_only: true
        # -- Skip shared/external devices.
        exclude_external: true
        # -- If non-empty, only devices carrying one of these tags, e.g. ["tag:server"].
        include_tags: []
        # -- Devices carrying any of these tags are skipped (wins over include_tags).
        exclude_tags: []
        # -- Preferred address family: ipv4 | ipv6 (falls back to the other).
        address_order: ipv4
        # -- Source of the node-identity label: name (MagicDNS short name — unique per tailnet and
        # human-friendly, the default) | address (Tailscale host:port, always unique) | hostname
        # (OS hostname — NOT unique; collisions are auto-suffixed with the address plus a WARN).
        instance_source: name
        # -- Attach host.name/host.id so scraped series join with tailscale.device.* metrics.
        include_host_labels: true
        # -- Attach the tailscale.tags label to scraped series.
        include_tags_label: true

  scheduler: # @schema additionalProperties:false
    # -- Spread initial collector ticks across this window. The existing default is 3s.
    initial_stagger_window: 3s

  coordination: # @schema additionalProperties:false
    # -- Whole-process active-passive coordination: `none` keeps singleton behavior;
    # `kubernetes` elects one replica through a coordination.k8s.io Lease.
    mode: none # @schema enum:["none","kubernetes"]
    # -- Name of the Lease shared by coordinated replicas. Must be a DNS-1123 label.
    lease_name: tailscale2otel
    # -- Namespace containing the coordination Lease and checkpoint ConfigMaps. Empty uses the Helm
    # release namespace. An explicit override must be a DNS-1123 label. The coordination Role's
    # ConfigMap get/list/update/create grant is namespace-wide: checkpoint shard names are dynamic,
    # and Kubernetes RBAC has no prefix/label matching for resourceNames while list is never
    # name-filtered, so a name-scoped grant would prevent shard discovery.
    namespace: "" # @schema maxLength:63;pattern:^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$
    # -- Leader Lease expiry duration. Must be greater than renew_deadline.
    lease_duration: 15s
    # -- Time allowed to renew before stepping down. Must be greater than retry_period.
    renew_deadline: 10s
    # -- Interval between Lease acquisition and renewal attempts.
    retry_period: 2s

  checkpoint: # @schema additionalProperties:false
    # -- Poll-cursor store: memory \| file \| kubernetes. "memory" loses window cursors on
    # restart (re-does initial_lookback); "file" persists them atomically (needs a writable
    # volume at file_path); "kubernetes" stores one gzip binaryData ConfigMap per
    # collector namespace, owned by coordination.lease_name, for coordinated failover.
    store: file # @schema enum:["memory","file","kubernetes"]
    # -- Semantic-evidence store: memory \| file. Independent of poll cursors; keep file to
    # preserve ACL revision/audit provenance across restarts even in streamed deployments.
    evidence_store: file
    # -- Shared state path when either store is file (mount a writable persistent volume here).
    file_path: "/var/lib/tailscale2otel/checkpoints.json"
    # -- Coalesce nearby checkpoint writes; 0 preserves synchronous Set durability.
    write_debounce: 0s

  # Process-global write-ahead log for accepted streaming/webhook request bodies.
  # Disabled is the stateless default. When enabled, ACK means durable local acceptance,
  # not OTLP/backend acknowledgement; replay is at-least-once and can duplicate after a crash.
  ingress_wal: # @schema additionalProperties:false
    # -- Persist accepted receiver bodies before acknowledging them. Off by default.
    enabled: false
    # -- Absolute, clean, non-root WAL directory. Must live on the state volume for persistence.
    directory: "/var/lib/tailscale2otel/ingress-wal"
    # -- Encoded WAL byte ceiling. Full WALs fail receiver requests closed; no TTL or eviction.
    max_bytes: 268435456
    # -- Encoded WAL entry ceiling. Full WALs fail receiver requests closed; no TTL or eviction.
    max_entries: 10000
    # -- Corruption policy. Only fail is supported: startup/drain stops rather than discarding data.
    corruption: fail

  # Optional Splunk-HEC-compatible receiver for streamed logs. When enabled, set the
  # flowlogs/auditlogs source to `stream` (NOT poll/both) so each log type is ingested by
  # exactly ONE path; running both the poller and this receiver for the same log type risks
  # double-counting (cross-source de-dup is a best-effort failsafe, WARNed at startup).
  # Token: set via TS2OTEL_STREAMING__TOKEN (secret).
  streaming: # @schema additionalProperties:false
    # -- Enable the HEC-style streaming receiver.
    enabled: false
    # -- Address the receiver binds (host:port).
    listen: ":8088"
    # -- HTTP path the receiver serves (the Splunk-HEC event endpoint).
    path: "/services/collector/event"
    # -- Expected as 'Authorization: Splunk <token>'. Set via TS2OTEL_STREAMING__TOKEN (secret).
    token: ""
    # -- Read streaming.token from this path instead of an inline value (mounted-Secret style).
    # Set the value or the file, not both; the file's content is whitespace-trimmed.
    token_file: ""
    # -- Externally reachable receiver URL; REQUIRED when auto_configure: true.
    public_url: ""
    tls: # @schema additionalProperties:false
      # -- TLS certificate file; set with key_file to serve the receiver over HTTPS.
      cert_file: ""
      # -- TLS private key file paired with cert_file.
      key_file: ""
    # -- Body decompression: auto | gzip | zstd | none.
    decompress: auto
    # -- PUT this receiver as a Splunk-HEC log-streaming sink on startup (requires public_url).
    # Registers BOTH log types (network/flow AND configuration/audit), OVERWRITING any existing
    # sink for either. NEVER enable against a tailnet whose streaming you do not intend to overwrite.
    auto_configure: false
    # -- Cap on DECOMPRESSED body; 0 = 64MiB default, <0 = unlimited (413 on exceed).
    # When ingress_wal.enabled, an enabled receiver must set this explicitly to >0 and <=64MiB.
    max_body_bytes: 0
    # -- How many requests may buffer a body AT ONCE (max_body_bytes caps one body, this caps their
    # sum); 0 = 4 default, <0 = unlimited (503 + Retry-After on exceed). Worst-case buffering is
    # roughly this x max_body_bytes, so raise it together with resources.limits.memory.
    max_concurrent_requests: 0
    # -- Per-route admission cap; 0 selects an automatic fair share of the global budget.
    per_route_max_concurrent_requests: 0
    # -- FILE-ONLY multi-tailnet routes. Each item has tailnet, exact path, token or token_file,
    # optional public_url, and optional auto_configure. Non-empty replaces legacy path/token identity.
    routes: []

  # Optional webhook receiver for real-time Tailscale events.
  # Secret: set via TS2OTEL_WEBHOOK__SECRET (secret).
  webhook: # @schema additionalProperties:false
    # -- Enable the webhook receiver.
    enabled: false
    # -- Address the receiver binds (host:port).
    listen: ":8089"
    # -- HTTP path the receiver serves.
    path: "/tailscale/webhook"
    # -- HMAC-SHA256 verification secret. Empty is accepted only on loopback; otherwise the
    # receiver refuses every request with HTTP 403 before reading its body. Set via
    # TS2OTEL_WEBHOOK__SECRET (secret).
    secret: ""
    # -- Read webhook.secret from this path instead of an inline value (mounted-Secret style).
    # Set the value or the file, not both; the file's content is whitespace-trimmed.
    secret_file: ""
    tls: # @schema additionalProperties:false
      # -- TLS certificate file; set with key_file for native webhook HTTPS. Leave both empty
      # when an HTTPS reverse proxy terminates TLS.
      cert_file: ""
      # -- TLS private key file paired with cert_file.
      key_file: ""
    # -- Allowed clock skew in BOTH directions on the signed timestamp: a request older than
    # now-tolerance or newer than now+tolerance is rejected. The two-sided check matters because a
    # correctly signed but future-dated request would otherwise stay replayable. 0 disables the
    # timestamp check entirely.
    tolerance: 5m
    # -- Cap on the RAW body read before signature verification; 0 = 1 MiB default, <0 = unlimited
    # (413 on exceed). Distinct from streaming.max_body_bytes, which caps a decompressed body.
    # When ingress_wal.enabled, an enabled receiver must set this explicitly to >0 and <=64MiB.
    max_body_bytes: 0
    # -- How many requests may buffer a body AT ONCE, before the HMAC is verified. max_body_bytes
    # caps one body; this caps their sum, so unauthenticated senders cannot multiply it. 0 = 4
    # default, <0 = unlimited (503 + Retry-After on exceed). Worst-case buffered memory is roughly
    # this x max_body_bytes, so raise it together with resources.limits.memory.
    max_concurrent_requests: 0
    # -- Per-route admission cap; 0 selects an automatic fair share of the global budget.
    per_route_max_concurrent_requests: 0
    # -- FILE-ONLY multi-tailnet routes. Each item has tailnet and secret or secret_file.
    # Non-empty replaces legacy path/secret identity; all events must name one route tailnet.
    routes: []
    # -- Best-effort: drop a webhook event already counted via the audit logs (off by default).
    dedup_audit_events: false

  self_observability: # @schema additionalProperties:false
    # -- Emit the exporter's own health metrics (scrape/api/export/build_info/enrich/runtime).
    enabled: true
    # -- service.instance.id resource attribute; empty falls back to the pod/host name. Override
    # with TS2OTEL_SELF_OBSERVABILITY__INSTANCE_ID (e.g. set to the pod name via the Downward API).
    instance_id: ""

  # PII / identifier redaction. All categories default true (emitted). Set a category to
  # false to drop those identifiers from metrics and logs at runtime (opt-out). Disabling a
  # category whose label is a gauge's sole identity suppresses that gauge's datapoints.
  pii_filter: # @schema additionalProperties:false
    # -- Emit user/actor login names (often emails).
    emails: true
    # -- Emit actor display (human) names.
    user_display_names: true
    # -- Emit numeric/opaque user IDs (user.id).
    user_ids: true
    # -- Emit device + collector-host hostnames.
    hostnames: true
    # -- Emit Tailscale node IDs.
    node_ids: true
    # -- Emit Tailscale-range addresses (100.64.0.0/10, fd7a:115c:a1e0::/48).
    tailscale_ips: true
    # -- Emit RFC1918 / ULA / link-local addresses.
    internal_ips: true
    # -- Emit public/routable addresses.
    external_ips: true
    # -- Emit VIP service names.
    service_addrs: true
    # -- Emit Tailscale API endpoint paths (self-obs).
    endpoint_paths: true
    # -- Emit route CIDRs, split-DNS domains, and search paths.
    network_topology: true
    # -- Emit the tailnet identifier.
    tailnet_name: true
    # -- Emit audit old/new/details, target names, key descriptions, posture values.
    free_text_details: true

    # -- Emit the verbatim `kubectl exec` command line on Kubernetes-audit logs. This is the only
    # attribute a human types at a shell, so it can carry a pasted secret; it has its own toggle
    # rather than sharing free_text_details. Turning it off KEEPS the bounded
    # tailscale.k8s.command_class classification that the exec metrics are built on.
    command_text: true
  # Prometheus pull endpoint: serves GET /metrics on a dedicated listener. prometheus.enabled
  # remains a backwards-compatible dual-delivery opt-in; delivery.mode also enables the pull path.
  # Bind to a loopback/tailnet address or set prometheus.auth.token for
  # defense-in-depth — the endpoint exposes every series (incl. device/flow identifiers).
  # Token: set via TS2OTEL_PROMETHEUS__AUTH__TOKEN (secret above).
  prometheus: # @schema additionalProperties:false
    # -- Backwards-compatible pull opt-in alongside OTLP. delivery.mode=prometheus or dual also enables it.
    enabled: false
    # -- Address the Prometheus endpoint binds. Default loopback only. Keep distinct from admin.listen.
    listen: "127.0.0.1:2112"
    auth: # @schema additionalProperties:false
      # -- Gate /metrics behind this token (HTTP Basic password or "Authorization: Bearer <token>").
      # Empty on a network-reachable bind is REFUSED with 403 unless allow_unauthenticated is set.
      # Set via TS2OTEL_PROMETHEUS__AUTH__TOKEN (secret).
      token: ""
      # -- Read prometheus.auth.token from this path instead of an inline value (mounted-Secret
      # style). Set the value or the file, not both; the file's content is whitespace-trimmed.
      token_file: ""
      # -- Acknowledge serving /metrics with NO token on a network-reachable bind. In a cluster this
      # is the normal case — the scrape is controlled by a NetworkPolicy rather than a credential —
      # but it must be stated, because /metrics carries device names, flow endpoints and audit
      # identities. A loopback bind never needs this. Ignored when token is set.
      allow_unauthenticated: false
    # -- Cap concurrent /metrics gathers; excess scrapes get 503. A Gather walks every series in
    # the registry, so N simultaneous slow scrapes cost N times that walk. Must be positive while
    # prometheus.enabled is true; 0 meant unlimited before v4.0.0 and is now refused.
    max_requests_in_flight: 4
    # -- Give up on a single /metrics gather after this long, answering 503. Keep it below the
    # scraper's own timeout so this process, not the scraper, decides.
    timeout: 8s
    # -- Serve overlapping scrapes from the same in-flight gather instead of duplicating collection
    # work. This costs slight staleness.
    coalesce_gather: true
    tls: # @schema additionalProperties:false
      # -- HTTPS certificate for the Prometheus endpoint. Set together with key_file
      # (both-or-neither); leaving both empty serves plain HTTP.
      cert_file: ""
      # -- HTTPS private key paired with cert_file. Both paths must exist and be readable at startup.
      key_file: ""
      # -- Require scrapers to present a client certificate signed by this CA (mutual TLS). Needs
      # cert_file/key_file — a client CA on a plaintext listener never runs. Composes with
      # auth.token: when both are set a request must satisfy both.
      client_ca_file: ""
      # -- How strictly the client certificate is checked: require_and_verify (the default once
      # client_ca_file is set), verify_if_given, require, request, or none. Only require_and_verify
      # and verify_if_given actually validate the chain; the weaker modes are for staged rollouts.
      client_auth: ""

  # Admin HTTP server: liveness/readiness probes plus an optional status landing page.
  # The page exposes operational metadata (collector health, cardinality, discovered
  # nodes, redacted config) but NEVER secret values.
  admin: # @schema additionalProperties:false
    # -- Enable the admin probe server.
    enabled: true
    # -- Address the admin server binds; serves /healthz and /readyz. Bind to loopback/tailnet for defense-in-depth.
    listen: ":9091"
    # -- Serve the human status page at / and machine-readable JSON at /api/status.json.
    landing_page: true
    # -- Redaction-safe recent log records included in support bundles; 0 disables capture.
    support_bundle_log_tail_records: 200
    auth: # @schema additionalProperties:false
      # -- Shared secret gating the status page and pprof (HTTP Basic password or "Authorization: Bearer <token>"); /healthz and /readyz stay open. Set via TS2OTEL_ADMIN__AUTH__TOKEN (secret). Required when profiling.pprof.enabled.
      token: ""
      # -- Read admin.auth.token from this path instead of an inline value (mounted-Secret style).
      # Set the value or the file, not both; the file's content is whitespace-trimmed.
      token_file: ""
      # -- Failed attempts from one source inside failure_window before throttling; 0 disables.
      failure_limit: 5
      failure_window: 1m
      failure_backoff: 30s
    tls: # @schema additionalProperties:false
      # -- HTTPS certificate for the admin server. Set together with key_file (both-or-neither);
      # leaving both empty serves plain HTTP. The chart's liveness/readiness probes follow this
      # automatically: setting both files renders them with scheme: HTTPS (#342). Setting admin
      # TLS through TS2OTEL_ADMIN__TLS__* env vars instead is invisible to the chart and leaves
      # the probes on HTTP — use these config keys.
      cert_file: ""
      # -- HTTPS private key paired with cert_file. Both paths must exist and be readable at startup.
      key_file: ""
      # -- Require a client certificate signed by this CA. Needs cert_file/key_file.
      client_ca_file: ""
      # -- Client certificate mode; empty defaults to require_and_verify when a CA is set.
      client_auth: ""
    # -- How often the status page's JS re-polls /api/status.json to patch the live view.
    # The page's 1s freshness ticker is independent of this.
    status_refresh_interval: 5s

  # Built-in flow view, served at /flows on the admin server: a bounded in-memory
  # picture of recent traffic (topology, timeline, top talkers, recent connections)
  # that needs no metrics backend. It changes nothing about what is exported over
  # OTLP, and the store is lost on restart. Requires admin.enabled + admin.landing_page.
  flows: # @schema additionalProperties:false
    # -- Build the flow store and serve /flows. No effect without admin.enabled + admin.landing_page.
    enabled: true
    # -- How far back /flows can see, as a ring of one-minute buckets (1m–24h). Sizes pod memory; each tailnet keeps its own store.
    retention: 6h
    # -- Local-view admission only: reject records further ahead of this process clock (0–1h). OTLP emission is unchanged.
    max_future_skew: 5m
    # -- Trade memory for fidelity on every per-bucket dimension and the raw-connection ring: `compact` (~half the default footprint), `default` (today's limits, unchanged), or `expanded` (~double). Fixed, hard-coded presets only — never a raw number.
    capacity_profile: default # @schema enum:["compact","default","expanded"]
    # Opt-in persistent backend (one SQLite file per tailnet) so /flows survives a pod restart and
    # can answer over days instead of flows.retention's hours. Off by default — leave directory empty and
    # /flows keeps using the bounded in-memory ring above. Setting directory turns it on; it does NOT
    # replace flows.retention, which still sizes that in-memory ring independently.
    store: # @schema additionalProperties:false
      # -- Directory to hold this tailnet's flows-<tailnet>.db.
      # Empty (default) = disabled. Point it at the persistence PVC's mount, e.g.
      # /var/lib/tailscale2otel/flows, and set persistence.enabled=true — see the sizing note on
      # that block below. Must be writable; if it cannot be opened the flow view
      # is switched OFF (and /flows 404s) rather than silently falling back to memory, so an
      # operator who asked for history is never shown a view that looks like it. OTLP export is
      # unaffected. Rows carry user identities (emails) and land on disk and in backups — the configured
      # pii_filter is applied before a row is written, same as the OTLP export path.
      directory: ""
      # -- How far back the on-disk store keeps rows before the retention sweep deletes them.
      # Separate from flows.retention above, which only sizes the in-memory ring and is capped at
      # 24h — this bound is unrelated and can be much longer.
      retention: 720h
      # -- Hard cap on retained rows, enforced independently of retention so a traffic flood cannot
      # fill the disk before the next sweep runs.
      max_rows: 5000000
      # -- Cap on how many rows a single CSV/JSON export may read, so an export cannot try to
      # materialise the whole retained window in one request.
      max_export_rows: 50000
      # -- Bound on the write-behind queue between the emit path and the disk writer. A full queue
      # drops the observation and counts it rather than blocking OTLP export — visible in the admin
      # API.
      queue_size: 8192
      # -- Rows written per transaction by the background writer.
      batch_size: 512
      # -- How often a partial batch is forced to disk, so a quiet tailnet's last few connections do
      # not sit in memory indefinitely between flushes.
      flush_interval: 5s
      # -- Timeout on a single read from the store. A window scan that exceeds it fails honestly
      # rather than hanging the admin page.
      query_timeout: 15s
      # -- How often the retention window and the row cap are enforced.
      sweep_interval: 1h
      # -- Periodic SQLite page reclamation; 0 inherits sweep_interval.
      incremental_vacuum_interval: 0s
      # -- Maximum pages reclaimed per vacuum tick.
      incremental_vacuum_pages: 1000

  events: # @schema additionalProperties:false
    # -- Build the bounded audit/webhook event store and serve /events. No effect without admin.enabled + admin.landing_page.
    enabled: true
    # -- How many individual audit+webhook events /events can see (100–100000). A plain count, not a time span — oldest evicted first.
    max_events: 5000

  # Optional continuous/on-demand profiling. Everything here is OFF by default and
  # carries no Tailscale data. The pprof handlers mount on the admin server, so
  # profiling.pprof.enabled requires admin.enabled: true AND admin.auth.token
  # (heap/goroutine dumps can expose in-memory secrets).
  profiling: # @schema additionalProperties:false
    pprof: # @schema additionalProperties:false
      # -- Mount net/http/pprof on the admin server so Grafana Alloy's pyroscope.scrape can PULL profiles. Requires admin.enabled + admin.auth.token.
      enabled: false
    pyroscope: # @schema additionalProperties:false
      # -- Run the Pyroscope continuous-profiling push agent (pyroscope-go SDK).
      enabled: false
      # -- Pyroscope/Grafana Cloud Profiles server URL. REQUIRED when enabled.
      server_address: ""
      # -- Basic-auth user (Grafana Cloud: the profiles instance ID). Set via TS2OTEL_PROFILING__PYROSCOPE__BASIC_AUTH_USER (secret).
      basic_auth_user: ""
      # -- Basic-auth password (Grafana Cloud: an access policy token with profiles:write). Set via TS2OTEL_PROFILING__PYROSCOPE__BASIC_AUTH_PASSWORD (secret).
      basic_auth_password: ""
      # -- Read the Pyroscope basic-auth password from this path instead of an inline value
      # (mounted-Secret style). Set the value or the file, not both; content is whitespace-trimmed.
      basic_auth_password_file: ""
      # -- X-Scope-OrgID for multi-tenant servers (leave empty for Grafana Cloud).
      tenant_id: ""
      # -- How often profiles are flushed to the server.
      upload_rate: 60s
      # -- Extra static labels merged onto every profile, e.g. { env: prod }.
      tags: {}
      # -- Extra HTTP headers sent on every profile upload, e.g. { X-Api-Key: abc }. Values are
      # secrets and redact from the status page and logs. Reserved headers (Authorization when
      # basic auth is set, and the tenant header) win over anything set here.
      headers: {}
      # -- off | hashed | name — whether continuous profiles carry a tailnet dimension. A tailnet
      # name is a CUSTOMER identifier and profiles go to a different destination from metrics/logs,
      # so this is opt-in and NOT covered by pii_filter. hashed = a stable 12-hex SHA-256 prefix
      # (pseudonymous, not anonymous). Emitted only for a single configured tailnet; multi-tailnet
      # gets no tag, since there is one profiler per process.
      tailnet_label: "off" # @schema enum:["off","hashed","name"]
      tls: # @schema additionalProperties:false
        # -- Keep TLS on but skip server-certificate verification on profile uploads. A footgun —
        # prefer ca_file with the gateway's CA.
        insecure_skip_verify: false
        # -- PEM bundle of the CA to trust for the profiles endpoint (private CA / self-signed
        # gateway). Must contain at least one certificate.
        ca_file: ""
        # -- Client certificate for mutual TLS to the profiles endpoint. Set together with key_file.
        cert_file: ""
        # -- Client key paired with profiling.pyroscope.tls.cert_file.
        key_file: ""
      span_profiles: # @schema additionalProperties:false
        # -- Correlate sampled CPU profiles with trace spans, so a Grafana trace links straight to
        # the profile. REQUIRES both tracing.enabled and profiling.pyroscope.enabled. CPU profiles
        # ONLY — Go's runtime attaches pprof labels to CPU samples, so heap/mutex/block/goroutine
        # profiles cannot carry span identity.
        enabled: false
      credential_reload: # @schema additionalProperties:false
        # -- Governs only the background poller; last-known-good validation is always retained for
        # a configured file regardless of this flag.
        enabled: false
        # -- Poll period; minimum 5s. Ignored when enabled is false.
        interval: 30s
    # -- runtime.SetMutexProfileFraction; samples 1/N mutex-contention events for both push and
    # pull. On by default, but APPLIED ONLY when pprof or pyroscope is enabled, so it costs a
    # non-profiling pod nothing. 0 drops the mutex profile.
    mutex_profile_fraction: 5
    # -- runtime.SetBlockProfileRate in nanoseconds; records blocking events averaging at least
    # this long (100us) for both push and pull. Same on-by-default/applied-only-when-enabled rule
    # as mutex_profile_fraction. 0 drops the block profile.
    block_profile_rate: 100000

  # -- OTEL traces pillar (spans for the exporter's own work). OFF by default;
  # reuses otlp.* for the endpoint/protocol/headers/TLS.
  tracing: # @schema additionalProperties:false
    # -- Emit spans. When true, also enables trace-based exemplars on tailscale2otel.api.duration.
    enabled: false
    # -- Head sampler (always_on|always_off|traceidratio|parentbased_always_on|parentbased_traceidratio).
    sampler: parentbased_always_on
    # -- Sample ratio in [0,1] for the *traceidratio samplers (ignored otherwise).
    sampler_arg: 1.0
    # -- How an INBOUND traceparent's sampled bit is treated by the stream/webhook receivers:
    # trust (today's behavior) | ignore (the local sampler alone decides, so a sender cannot force
    # sampling) | link (start a new local root trace and link the remote one).
    remote_parent: trust
    # -- Per-workload-class head sampler override. An empty sampler inherits tracing.sampler above,
    # so an untouched block behaves exactly as the single global sampler.
    samplers: # @schema additionalProperties:false
      scrape: # @schema additionalProperties:false
        # -- One root span per collector scrape cycle. Same enum as tracing.sampler; empty inherits it.
        sampler: ""
        # -- Ratio in [0,1] for the *traceidratio samplers.
        arg: 0.0
      receiver: # @schema additionalProperties:false
        # -- One root span per HEC-stream / webhook request — usually the highest-rate class, so
        # this is the one you turn down. Empty inherits tracing.sampler.
        sampler: ""
        # -- Ratio in [0,1] for the *traceidratio samplers.
        arg: 0.0
      background: # @schema additionalProperties:false
        # -- Periodic non-scrape work, e.g. the release/update check. Empty inherits tracing.sampler.
        sampler: ""
        # -- Ratio in [0,1] for the *traceidratio samplers.
        arg: 0.0

  # OTEL Resource enrichment (OPTIONAL). Bounded on purpose: Grafana Cloud promotes the whole
  # service.* namespace to a per-series label, so service_namespace multiplies active-series
  # cardinality. The app's own identity always wins; tailscale.tailnet / tailscale2otel.provider
  # remain per-signal attributes (not Resource attributes) and are refused here.
  resource: # @schema additionalProperties:false
    # -- service.namespace — promoted to a job-adjacent LABEL on every series. Keep it
    # low-cardinality and stable across deploys.
    service_namespace: ""
    # -- deployment.environment.name — outside service.*, so it lands in target_info only and may
    # vary per environment.
    deployment_environment: ""
    # -- Custom Resource attributes, e.g. { deploy.team: platform }. Max 32 entries, 256-byte
    # keys/values; reserved keys (service.name, service.version, service.instance.id,
    # tailscale.tailnet, tailscale2otel.provider) are refused.
    attributes: {}
    # -- Also read OTEL_RESOURCE_ATTRIBUTES / OTEL_SERVICE_NAME, filtered by the same rules. Off by
    # default: it hands the ambient environment a channel onto a per-series label surface.
    from_env: false

  version_checks: # @schema additionalProperties:false
    self: # @schema additionalProperties:false
      # -- Emit tailscale2otel.update_available (running build vs latest tailscale2otel GitHub release). Makes an outbound HTTPS call; fail-open. Disable for air-gapped deployments.
      enabled: true
    devices: # @schema additionalProperties:false
      # -- Emit per-device tailscale.device.version_skew + fleet roll-ups (device client version vs latest Tailscale stable). Makes an outbound HTTPS call; fail-open. Needs the devices collector.
      enabled: true
      # -- A device this many minor releases behind the latest Tailscale stable counts toward tailscale.devices.outdated.
      outdated_minor_threshold: 3
    # -- How long a fetched "latest version" is cached before re-fetching (minimum 5m).
    cache_ttl: 1h
    # -- Per-request timeout for the external version fetch.
    timeout: 10s
  grafana_annotations: # @schema additionalProperties:false
    # -- Grafana base URL, e.g. https://mystack.grafana.net. Setting it IS the opt-in for the
    # annotation writer — the only thing this process writes anywhere. Empty disables the feature
    # entirely (no client, no goroutine, no log line). Once set, the pod FAILS TO START unless the
    # token can write an annotation, because a writer discovered broken at the first real event
    # produced nothing when an operator went looking.
    url: ""
    # -- Grafana service-account token. It needs exactly one action, `annotations:create` on scope
    # `annotations:type:organization`, and nothing else. Prefer existingSecret or token_file over
    # putting it here: a non-empty value moves the whole rendered config into a Secret.
    token: ""
    # -- Path to a file holding the token (a mounted Secret). Value XOR file.
    token_file: ""
    # -- Confine annotations to ONE dashboard. Empty (default) writes organization annotations,
    # visible on every board and in Explore.
    dashboard_uid: ""
    # -- Per-request timeout for POST /api/annotations.
    timeout: 10s
    # -- Token-bucket ceiling on annotations written per process. Overage is dropped and counted,
    # never delayed.
    max_per_minute: 60
    # -- Hand-off buffer between the collector goroutines and the single publisher. A full queue
    # drops and counts rather than blocking collection.
    queue_size: 512
    # -- Bucket width for rolled-up categories: one region annotation per interval per category
    # per tailnet, instead of one marker per event.
    rollup_interval: 5m
    # -- How long a published annotation's dedupe key is remembered, so a restart cannot republish
    # it. Must comfortably exceed the longest source overlap window.
    dedupe_retention: 48h
    # -- Where the dedupe set persists. Empty puts annotations.json beside checkpoint.file_path,
    # so it lands on the same persistence volume. Without a persistent volume a restart may
    # republish recent annotations once.
    state_file: ""
    # -- Extra tags added to every annotation, e.g. [env:prod]. Every annotation already carries
    # tailscale2otel, category:<c> and rule:<id>.
    extra_tags: [] # @schema item: string
    categories: # @schema additionalProperties:false
      config_change: # @schema additionalProperties:false
        # -- ACL edits, device approval and churn, key lifecycle, user role changes, DNS and
        # tailnet settings — the curated audit-log subset. Needs collectors.auditlogs.
        enabled: true
        # -- Roll the category up into one region annotation per rollup_interval. On by default:
        # it is the highest-volume source, and per-event markers draw a picket fence.
        rollup: true
      expiry: # @schema additionalProperties:false
        # -- A node key or auth key entering its expiry warning window. Needs collectors.keys or
        # collectors.devices.
        enabled: true
        # -- Roll the category up. On by default: a fresh deployment finds every currently
        # expiring key at once.
        rollup: true
      policy_change: # @schema additionalProperties:false
        # -- ACL revision and policy-diff markers from the policy snapshot family.
        enabled: true
        # -- Keep rare policy changes individually visible.
        rollup: false
      inventory: # @schema additionalProperties:false
        # -- Device additions, removals and material field changes.
        enabled: true
        # -- Roll high-volume device churn into one region per interval.
        rollup: true
      risk: # @schema additionalProperties:false
        # -- Newly observed ACL, SSH and auto-approver risk findings.
        enabled: true
        # -- Keep each new risk finding individually visible.
        rollup: false

# --- Process-state persistence (checkpoints plus an enabled receiver WAL) ---
persistence: # @schema additionalProperties:false
  # -- Persist process state across pod replacement/rescheduling. When false, an emptyDir is used:
  # it survives container restarts within the same pod, but is lost with pod replacement,
  # rescheduling, or node loss. When true, a PVC is created or existingClaim is mounted.
  enabled: false
  # -- StorageClass for the PVC (empty = cluster default). Only used when enabled.
  storageClass: ""
  # -- PVC access mode.
  accessMode: ReadWriteOnce
  # -- PVC size. The existing 64Mi default suits checkpoints only. With the default 256Mi
  # encoded WAL limit, request at least 512Mi for WAL entries plus staging files and metadata. If
  # config.flows.store.directory also points into this volume (e.g.
  # /var/lib/tailscale2otel/flows), size for that store separately — see the disk-sizing estimate
  # in docs/flow-view.md — and add its estimate on top of the WAL/checkpoint figure above.
  size: 64Mi
  # -- Use an existing PVC instead of creating one (empty = create one). Only used when enabled;
  # persistence.enabled=true is required, and existingClaim may supply the durable volume instead
  # of this chart creating it.
  existingClaim: ""

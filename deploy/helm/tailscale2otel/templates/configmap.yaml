{{- /*
The rendered config.yaml lives here ONLY when it is credential-free. If any
credential-bearing key is set inline under `config:` (or configStorage.mode is
`secret`), it moves to a Secret instead — see secret-config.yaml and the
tailscale2otel.configStoresSecret helper.
*/}}
{{- if not (include "tailscale2otel.usesExternalConfig" .) }}
{{- if not (include "tailscale2otel.configStoresSecret" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tailscale2otel.fullname" . }}
  labels:
    {{- include "tailscale2otel.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "tailscale2otel.config" . | nindent 4 }}
{{- end }}
{{- end }}

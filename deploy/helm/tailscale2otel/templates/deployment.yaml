apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tailscale2otel.fullname" . }}
  labels:
    {{- include "tailscale2otel.labels" . | nindent 4 }}
spec:
  # Singleton poller — do not scale horizontally (would double-emit). The schema
  # already constrains replicaCount to exactly 1; this is a second, harder-to-miss
  # guard for --set/--values overrides that bypass schema validation (e.g. `helm
  # template --skip-schema-validation`, or a values file layered in after schema
  # checks via some other tooling).
  {{- if ne (int .Values.replicaCount) 1 }}
  {{- fail (printf "replicaCount must be 1: tailscale2otel is a singleton poller with no leader election or shared checkpoint coordination — running %d replicas would double-emit every metric and log against the same tailnet" (int .Values.replicaCount)) }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tailscale2otel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the config or secret changes.
        checksum/config: {{ include "tailscale2otel.config" . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ toYaml .Values.secret | sha256sum }}
        {{- end }}
        {{- with .Values.rolloutTrigger }}
        # Operator-chosen opaque rollout token. Credentials in an externally managed
        # existingSecret contribute only a name reference, so rotating them leaves the
        # pod template — and therefore the running container's env — untouched. Changing
        # this value changes the pod template and forces a Recreate rollout. It is NEVER
        # derived from secret content (no value, no digest of a value, ever lands here).
        tailscale2otel.m7kni.io/rollout-trigger: {{ . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tailscale2otel.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tailscale2otel.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: tailscale2otel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/tailscale2otel/config.yaml"]
          envFrom:
            - secretRef:
                name: {{ include "tailscale2otel.secretName" . }}
          {{- $gomemlimit := include "tailscale2otel.gomemlimit" . }}
          {{- if or .Values.goRuntime.gogc $gomemlimit }}
          env:
            {{- if .Values.goRuntime.gogc }}
            - name: GOGC
              value: {{ .Values.goRuntime.gogc | quote }}
            {{- end }}
            {{- if $gomemlimit }}
            - name: GOMEMLIMIT
              value: {{ $gomemlimit | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.config.admin.enabled }}
          # Probes hit the admin server's /healthz and /readyz (never auth-gated).
          # Only rendered when config.admin.enabled — the server is off by default.
          ports:
            - name: admin
              containerPort: {{ .Values.config.admin.listen | splitList ":" | last | int }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 15
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/tailscale2otel
              readOnly: true
            - name: checkpoints
              mountPath: /var/lib/tailscale2otel
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          {{- if include "tailscale2otel.configStoresSecret" . }}
          # This config carries credentials (multi-tailnet entries, an inline
          # credential key, or configStorage.mode: secret) — served from a Secret.
          secret:
            secretName: {{ include "tailscale2otel.configSecretName" . }}
          {{- else }}
          configMap:
            name: {{ include "tailscale2otel.fullname" . }}
          {{- end }}
        - name: checkpoints
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "tailscale2otel.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if eq .Values.config.coordination.mode "kubernetes" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tailscale2otel.coordinationRoleName" . }}
  namespace: {{ include "tailscale2otel.coordinationNamespace" . | quote }}
  labels:
    {{- include "tailscale2otel.labels" . | nindent 4 }}
rules:
  # The election lock and reusable Lease watcher access only the configured
  # Lease. Kubernetes honors resourceNames for list/watch when the client
  # supplies a matching metadata.name field selector; this observer does so on
  # both collection calls. No patch, delete, or access to another Lease is
  # needed.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - update
      - list
      - watch
    resourceNames:
      - {{ .Values.config.coordination.lease_name | quote }}
  # Kubernetes cannot apply resourceNames to create: the POST URL has no
  # resource name, so this is the narrowest portable create grant. The named
  # get/update rule above still limits all operations that carry a Lease name.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  # The checkpoint store creates a gzip ConfigMap for each dynamic collector
  # namespace, all named from the Lease plus a shard hash. Kubernetes RBAC has
  # no prefix/label restriction for resourceNames and list is never name
  # filtered, so get/list/update must cover ConfigMaps in this namespace; this
  # is the narrowest portable permission for discovering and updating shards.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - update
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
{{- end }}

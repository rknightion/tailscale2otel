{{- /*
Per-listener Services, every one default-off (#344).

The chart shipped no Service at all on purpose: tailscale2otel's normal traffic
is outbound, and every inbound listener is opt-in, so the safe default is to
expose nothing. deploy/CLAUDE.md left the door open for exactly this design —
"a future opt-in, per-listener service.enabled block ... must default off and
never map a receiver port without its credential".

Discrete Services, one per listener, never an aggregate: an aggregate would map
ports whose listeners have different credentials and different exposure needs,
so enabling one surface would silently publish the others. Each Service maps
ONLY its own port.

`type` defaults to ClusterIP for all four. A LoadBalancer default would put a
receiver on the public internet from a single `enabled: true`.
*/ -}}
{{- $prometheusEnabled := or .Values.config.prometheus.enabled (or (eq .Values.config.delivery.mode "prometheus") (eq .Values.config.delivery.mode "dual")) -}}
{{- $listeners := list
  (dict "name" "admin"      "enabled" .Values.config.admin.enabled      "listen" .Values.config.admin.listen      "cred" .Values.config.admin.auth.token      "credFile" .Values.config.admin.auth.token_file      "credKey" "config.admin.auth.token")
  (dict "name" "prometheus" "enabled" $prometheusEnabled "listen" .Values.config.prometheus.listen "cred" .Values.config.prometheus.auth.token "credFile" .Values.config.prometheus.auth.token_file "credKey" "config.prometheus.auth.token")
  (dict "name" "streaming"  "enabled" .Values.config.streaming.enabled  "listen" .Values.config.streaming.listen  "cred" .Values.config.streaming.token      "credFile" .Values.config.streaming.token_file      "credKey" "config.streaming.token")
  (dict "name" "webhook"    "enabled" .Values.config.webhook.enabled    "listen" .Values.config.webhook.listen    "cred" .Values.config.webhook.secret       "credFile" .Values.config.webhook.secret_file       "credKey" "config.webhook.secret")
-}}
{{- range $l := $listeners }}
{{- $svc := index $.Values.service $l.name }}
{{- if $svc.enabled }}
{{- if eq $l.name "prometheus" }}
{{- if not $l.enabled }}
{{- fail "service.prometheus.enabled requires config.prometheus.enabled or delivery.mode=prometheus/dual: there is no /metrics listener to publish" }}
{{- end }}
{{- if ne (include "tailscale2otel.prometheusTokenConfigured" $) "true" }}
{{- fail "service.prometheus.enabled requires a Prometheus credential. Set config.prometheus.auth.token/token_file, secret.TS2OTEL_PROMETHEUS__AUTH__TOKEN, or declare metrics.externalPrometheusToken=present for an opaque source; otherwise leave the Service disabled and reach the pod directly." }}
{{- end }}
{{- include "tailscale2otel.validateMetricsExposure" $ }}
{{- else }}
{{- include "tailscale2otel.requireListenerCredential" (dict "name" $l.name "enabled" $l.enabled "cred" $l.cred "credFile" $l.credFile "credKey" $l.credKey) }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tailscale2otel.fullname" $ }}-{{ $l.name }}
  labels:
    {{- include "tailscale2otel.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $l.name }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $svc.type }}
  selector:
    {{- include "tailscale2otel.selectorLabels" $ | nindent 4 }}
  ports:
    - name: {{ $l.name }}
      port: {{ $svc.port | default (include "tailscale2otel.listenPort" $l.listen) }}
      targetPort: {{ $l.name }}
      protocol: TCP
{{- end }}
{{- end }}

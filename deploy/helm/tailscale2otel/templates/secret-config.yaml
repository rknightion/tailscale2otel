{{- /*
The rendered config.yaml as a Secret rather than a ConfigMap. Used whenever the
config carries credentials — multi-tailnet entries (the tailnets list is file-only,
with no TS2OTEL_* env path), any credential-bearing key set inline under `config:`,
or an explicit configStorage.mode: secret. Credential-free configs keep the
ConfigMap (see configmap.yaml). The object name is unchanged from the original
multi-tailnet-only behaviour, so existing installs keep theirs.
*/}}
{{- if include "tailscale2otel.configStoresSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tailscale2otel.configSecretName" . }}
  labels:
    {{- include "tailscale2otel.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "tailscale2otel.config" . | nindent 4 }}
{{- end }}

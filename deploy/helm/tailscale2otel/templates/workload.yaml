{{- if eq .Values.config.coordination.mode "kubernetes" }}
{{- include "tailscale2otel.validateReplicaCount" . -}}
{{- if .Values.persistence.existingClaim }}
{{- fail "persistence.existingClaim is unsupported with config.coordination.mode=kubernetes: per-replica claims replace it so each StatefulSet pod owns its single-writer state" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tailscale2otel.fullname" . }}
  labels:
    {{- include "tailscale2otel.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "tailscale2otel.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  # Standbys are Ready once they have started. Receiver Services select the
  # elected pod's role label, so Parallel creation remains safe and fast.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "tailscale2otel.selectorLabels" . | nindent 6 }}
  template:{{ include "tailscale2otel.podTemplate" . | trimPrefix "\n" | nindent 0 }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    # SELECTOR labels only, never the full label set. volumeClaimTemplates is
    # immutable AND an atomic list, so a server-side apply replaces it wholesale and
    # ANY difference makes the API server reject the whole StatefulSet. The full set
    # carries helm.sh/chart and app.kubernetes.io/version, which change on EVERY
    # release — so shipping them here made every upgrade after the first install fail
    # with "updates to statefulset spec for fields other than ... are forbidden",
    # taking the image bump in the same object down with it. Selector labels are
    # stable for the life of the release, so this list never changes again.
    # Anything version-varying belongs on the pod template, not here.
    - metadata:
        name: checkpoints
        labels:
          {{- include "tailscale2otel.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode | quote }}
        {{- if .Values.persistence.volumeMode }}
        volumeMode: {{ .Values.persistence.volumeMode | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}

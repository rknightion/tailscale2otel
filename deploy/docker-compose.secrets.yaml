# Optional override: supply credentials as Docker secrets (files) instead of
# environment variables.
#
# Usage — pass BOTH files, base first:
#   mkdir -p deploy/secrets && chmod 700 deploy/secrets
#   printf '%s' '<oauth client secret>' > deploy/secrets/oauth_client_secret
#   chmod 600 deploy/secrets/*
#   docker compose -f deploy/docker-compose.yaml \
#                  -f deploy/docker-compose.secrets.yaml up
#
# WHY. An environment variable is readable by anything that can inspect the
# container: `docker inspect`, `docker compose config`, /proc/<pid>/environ, and
# any crash reporter or process lister that dumps the environment. A secret
# mounted as a file is readable only through the filesystem, so it does not
# appear in any of those (#334). The app has supported a `*_file` sibling for
# every credential since #169 — this file just wires Compose's `secrets:` to it.
#
# VALUE XOR FILE. Setting both the plain variable and its `_FILE` sibling is a
# startup error, not a precedence rule. So if you keep credentials in
# deploy/.env AND use this override, the container will refuse to start and name
# the conflicting key. Pick one: either delete the credential lines from
# deploy/.env, or do not use this override.
#
# ROTATION REQUIRES A RESTART. The files are read ONCE, during config load. The
# host file is bind-mounted, so editing it changes what the container would read
# — but the running process already holds the old value. After rotating, run
# `docker compose ... up -d --force-recreate tailscale2otel`.
#
# SECRETS_DIR lets the test suite point at a scratch directory; leave it unset
# and the paths resolve to deploy/secrets/.
#
# Only the credentials you actually use need a file. Delete the entries you do
# not need — a `secrets:` entry whose `file:` is missing makes Compose fail.
secrets:
  oauth_client_secret:
    file: ${SECRETS_DIR:-./secrets}/oauth_client_secret
  grafana_cloud_token:
    file: ${SECRETS_DIR:-./secrets}/grafana_cloud_token
  admin_token:
    file: ${SECRETS_DIR:-./secrets}/admin_token
  streaming_token:
    file: ${SECRETS_DIR:-./secrets}/streaming_token
  webhook_secret:
    file: ${SECRETS_DIR:-./secrets}/webhook_secret
  pyroscope_password:
    file: ${SECRETS_DIR:-./secrets}/pyroscope_password
  headscale_api_key:
    file: ${SECRETS_DIR:-./secrets}/headscale_api_key
  objectstore_access_key_id:
    file: ${SECRETS_DIR:-./secrets}/objectstore_access_key_id
  objectstore_secret_access_key:
    file: ${SECRETS_DIR:-./secrets}/objectstore_secret_access_key
  objectstore_session_token:
    file: ${SECRETS_DIR:-./secrets}/objectstore_session_token

services:
  tailscale2otel:
    secrets:
      - oauth_client_secret
      - grafana_cloud_token
      - admin_token
      - streaming_token
      - webhook_secret
      - pyroscope_password
      - headscale_api_key
      - objectstore_access_key_id
      - objectstore_secret_access_key
      - objectstore_session_token
    environment:
      # Compose mounts each secret at /run/secrets/<name>. Each variable below is
      # the `_FILE` sibling of a real config key, so the app reads the path and
      # never receives the value through its environment.
      #
      # The plain-valued variables are explicitly cleared: the base file sets
      # them from deploy/.env, and value+file on the same key is a hard startup
      # error rather than a precedence rule.
      TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_SECRET: ""
      TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_SECRET_FILE: /run/secrets/oauth_client_secret
      TS2OTEL_OTLP__GRAFANA_CLOUD__TOKEN: ""
      TS2OTEL_OTLP__GRAFANA_CLOUD__TOKEN_FILE: /run/secrets/grafana_cloud_token
      TS2OTEL_ADMIN__AUTH__TOKEN: ""
      TS2OTEL_ADMIN__AUTH__TOKEN_FILE: /run/secrets/admin_token
      TS2OTEL_STREAMING__TOKEN_FILE: /run/secrets/streaming_token
      TS2OTEL_WEBHOOK__SECRET_FILE: /run/secrets/webhook_secret
      TS2OTEL_PROFILING__PYROSCOPE__BASIC_AUTH_PASSWORD_FILE: /run/secrets/pyroscope_password
      TS2OTEL_HEADSCALE__API_KEY: ""
      TS2OTEL_HEADSCALE__API_KEY_FILE: /run/secrets/headscale_api_key
      # One credential set is shared by the three object-store destinations.
      # Configure separate secret files if the buckets use different roles.
      TS2OTEL_COLLECTORS__FLOWLOGS__OBJECTSTORE__ACCESS_KEY_ID: ""
      TS2OTEL_COLLECTORS__FLOWLOGS__OBJECTSTORE__ACCESS_KEY_ID_FILE: /run/secrets/objectstore_access_key_id
      TS2OTEL_COLLECTORS__FLOWLOGS__OBJECTSTORE__SECRET_ACCESS_KEY: ""
      TS2OTEL_COLLECTORS__FLOWLOGS__OBJECTSTORE__SECRET_ACCESS_KEY_FILE: /run/secrets/objectstore_secret_access_key
      TS2OTEL_COLLECTORS__FLOWLOGS__OBJECTSTORE__SESSION_TOKEN: ""
      TS2OTEL_COLLECTORS__FLOWLOGS__OBJECTSTORE__SESSION_TOKEN_FILE: /run/secrets/objectstore_session_token
      TS2OTEL_COLLECTORS__AUDITLOGS__OBJECTSTORE__ACCESS_KEY_ID: ""
      TS2OTEL_COLLECTORS__AUDITLOGS__OBJECTSTORE__ACCESS_KEY_ID_FILE: /run/secrets/objectstore_access_key_id
      TS2OTEL_COLLECTORS__AUDITLOGS__OBJECTSTORE__SECRET_ACCESS_KEY: ""
      TS2OTEL_COLLECTORS__AUDITLOGS__OBJECTSTORE__SECRET_ACCESS_KEY_FILE: /run/secrets/objectstore_secret_access_key
      TS2OTEL_COLLECTORS__AUDITLOGS__OBJECTSTORE__SESSION_TOKEN: ""
      TS2OTEL_COLLECTORS__AUDITLOGS__OBJECTSTORE__SESSION_TOKEN_FILE: /run/secrets/objectstore_session_token
      TS2OTEL_COLLECTORS__K8S_AUDIT__OBJECTSTORE__ACCESS_KEY_ID: ""
      TS2OTEL_COLLECTORS__K8S_AUDIT__OBJECTSTORE__ACCESS_KEY_ID_FILE: /run/secrets/objectstore_access_key_id
      TS2OTEL_COLLECTORS__K8S_AUDIT__OBJECTSTORE__SECRET_ACCESS_KEY: ""
      TS2OTEL_COLLECTORS__K8S_AUDIT__OBJECTSTORE__SECRET_ACCESS_KEY_FILE: /run/secrets/objectstore_secret_access_key
      TS2OTEL_COLLECTORS__K8S_AUDIT__OBJECTSTORE__SESSION_TOKEN: ""
      TS2OTEL_COLLECTORS__K8S_AUDIT__OBJECTSTORE__SESSION_TOKEN_FILE: /run/secrets/objectstore_session_token

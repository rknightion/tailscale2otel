# promtool unit tests for the tailnet-scoped rule groups.
#
# The cases here are the ones a syntax check cannot reach: multi-tailnet label
# preservation, the already-expired-key guard, and the "healthy zero versus
# absent" distinction that #385 found rendered backwards on the dashboards.
#
# THE RULE FILE IS GENERATED AND NOT COMMITTED — see health_rules_test.yaml for
# the two commands. In short:
#
#   python3 deploy/alerts/gen/build_rules.py --prom-out deploy/alerts/.generated-prom-rules.yaml
#   promtool test rules deploy/alerts/tests/*.yaml
rule_files:
  - ../.generated-prom-rules.yaml

evaluation_interval: 1m

tests:
  # --- multi-tailnet identity ------------------------------------------------
  # Two tailnets, one of them failing its API polls. The alert must fire once,
  # for the right tailnet, and must carry tailscale_tailnet through so a
  # responder can tell which tailnet to act on. An expression that aggregated the
  # label away would fire a single anonymous alert here — which is the whole
  # reason this rule exists alongside the fleet-wide API rules — and this test is
  # what says so.
  - name: per-tailnet API errors keep tailnet identity and stay quiet for the healthy tailnet
    interval: 1m
    input_series:
      - series: 'tailscale2otel_api_requests_total{tailscale_tailnet="alpha.ts.net",http_response_status_code="403",http_route="/devices"}'
        values: '0+1x60'
      - series: 'tailscale2otel_api_requests_total{tailscale_tailnet="beta.ts.net",http_response_status_code="200",http_route="/devices"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: PerTailnetAPIErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              service: tailscale2otel
              domain: observability
              skipinvestigation: "true"
              tailscale_tailnet: alpha.ts.net
            exp_annotations:
              summary: "Tailscale API errors for tailnet alpha.ts.net"
              runbook_url: "https://m7kni.io/tailscale2otel/runbooks/#tailscale-api-health"

  # --- the already-expired guard ---------------------------------------------
  # A tagged device whose key expires inside 48h pages, and the alert keeps the
  # device identity labels the responder needs.
  - name: tagged device key expiring inside 48h pages with device identity
    interval: 1m
    input_series:
      # Wall-clock epoch of expiry. promtool's clock starts at 0, so a flat
      # 86400 is "expires 24h from the start of the test" and stays inside the
      # 48h window for the whole run.
      - series: 'tailscale_device_key_expiry_seconds{tailscale_tailnet="alpha.ts.net",host_name="build-runner",host_id="n1",tailscale_user="tagged-devices",tailscale_tags="tag:ci"}'
        values: '86400+0x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: TaggedDeviceKeyExpiring48h
        exp_alerts:
          - exp_labels:
              severity: critical
              service: tailscale2otel
              domain: security
              host_name: build-runner
              host_id: n1
              tailscale_user: tagged-devices
              tailscale_tags: "tag:ci"
            exp_annotations:
              summary: "Tagged device node key for build-runner expires in <48h"
              runbook_url: "https://m7kni.io/tailscale2otel/runbooks/#credential-expiry"

  # An ALREADY-expired key must not fire. The rule's within-range lower bound is
  # exactly this: without it every long-dead device would alert forever as
  # "expiring soon", drowning the devices that are genuinely about to expire.
  # This is the case that caught a real regression, so do not fold it away.
  - name: an already expired key does not fire expiring-soon
    interval: 1m
    input_series:
      - series: 'tailscale_device_key_expiry_seconds{tailscale_tailnet="alpha.ts.net",host_name="dead-host",host_id="n2",tailscale_user="tagged-devices",tailscale_tags="tag:ci"}'
        values: '1+0x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: TaggedDeviceKeyExpiring48h
        exp_alerts: []

  # An untagged device is out of scope by design (the selector is
  # tailscale_tags!=""); it is covered by the warning-tier 7-day rule instead.
  - name: an untagged device expiring inside 48h does not page
    interval: 1m
    input_series:
      - series: 'tailscale_device_key_expiry_seconds{tailscale_tailnet="alpha.ts.net",host_name="rob-laptop",host_id="n3",tailscale_user="rob",tailscale_tags=""}'
        values: '86400+0x180'
    alert_rule_test:
      - eval_time: 90m
        alertname: TaggedDeviceKeyExpiring48h
        exp_alerts: []

  # --- healthy zero versus absent -------------------------------------------
  # A feature flag reporting 0 means "we asked, and it is off" and must fire.
  - name: flow logging reported off fires
    interval: 1m
    input_series:
      - series: 'tailscale_feature_enabled_ratio{tailscale_feature="network_flow_logging",tailscale_tailnet="alpha.ts.net"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: NetworkFlowLoggingDisabled
        exp_alerts:
          # min() aggregates every label away on purpose — this is a tailnet-wide
          # posture statement, not a per-series one.
          - exp_labels:
              severity: warning
              service: tailscale2otel
              domain: security
              skipinvestigation: "true"
            exp_annotations:
              summary: "Tailnet network flow logging is disabled"
              runbook_url: "https://m7kni.io/tailscale2otel/runbooks/#tailnet-settings-drift"

  # The absent case is deliberately DIFFERENT: no series at all means the probe
  # never ran (collector disabled, capability unsupported), which this rule does
  # not treat as "flow logging is off". Asserting the silence keeps a future
  # `or vector(0)` from quietly turning "we do not know" into a firing alert.
  # It is also what pins the rule's `optional` evaluation policy (noDataState:
  # Ok) as the correct one — if this ever had to fire on absence it would need
  # the coverage_critical treatment instead.
  - name: flow logging feature probe absent stays silent
    interval: 1m
    input_series:
      - series: 'tailscale_feature_enabled_ratio{tailscale_feature="magic_dns",tailscale_tailnet="alpha.ts.net"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: NetworkFlowLoggingDisabled
        exp_alerts: []

  # A feature that is ON must not fire, which also pins the polarity: this is a
  # healthy-on flag, so 1 is good. #385 fixed the dashboard rendering these
  # backwards; this asserts the rule agrees with that polarity.
  - name: flow logging enabled does not fire
    interval: 1m
    input_series:
      - series: 'tailscale_feature_enabled_ratio{tailscale_feature="network_flow_logging",tailscale_tailnet="alpha.ts.net"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: NetworkFlowLoggingDisabled
        exp_alerts: []

  # --- NewDeviceWithKeyExpiryDisabled: the delta, not the level ---------------
  # #401's whole point: a standing population of never-expiring keys is normal
  # (tag-owned servers routinely disable key expiry), so alerting on the level
  # is pure noise. Only a NEW one appearing — a rise in the count — is
  # actionable, which is why the expression is delta() over 1h, not the gauge
  # itself.
  - name: a flat high count of disabled-expiry devices does not fire
    interval: 1m
    input_series:
      # Standing at 40 the whole time: no new device disabled expiry.
      - series: 'tailscale_devices_key_expiry_disabled_ratio'
        values: '40+0x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: NewDeviceWithKeyExpiryDisabled
        exp_alerts: []

  - name: a new device disabling key expiry steps the count up and fires
    interval: 1m
    input_series:
      # Flat at 40 for 30m, then one device disables expiry (steps to 41) and
      # stays there.
      - series: 'tailscale_devices_key_expiry_disabled_ratio'
        values: '40+0x30 41+0x60'
    alert_rule_test:
      # Shortly after the step the 1h delta has not cleared the 15m `for` yet.
      - eval_time: 40m
        alertname: NewDeviceWithKeyExpiryDisabled
        exp_alerts: []
      - eval_time: 55m
        alertname: NewDeviceWithKeyExpiryDisabled
        exp_alerts:
          # domain=security and not hygiene => "worthy", so NO
          # skipinvestigation label.
          - exp_labels:
              severity: warning
              service: tailscale2otel
              domain: security
            exp_annotations:
              summary: "A device had node-key expiry disabled in the last hour"
              runbook_url: "https://m7kni.io/tailscale2otel/runbooks/#credential-expiry"

  # --- DeviceKeyUsedByMultipleClients ------------------------------------------
  - name: no device with multiple simultaneous connections does not fire
    interval: 1m
    input_series:
      - series: 'tailscale_device_multiple_connections_ratio{host_id="n1"}'
        values: '0+0x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: DeviceKeyUsedByMultipleClients
        exp_alerts: []

  - name: a device key used by multiple clients for over an hour fires
    interval: 1m
    input_series:
      - series: 'tailscale_device_multiple_connections_ratio{host_id="n1"}'
        values: '1+0x90'
    alert_rule_test:
      - eval_time: 50m
        alertname: DeviceKeyUsedByMultipleClients
        exp_alerts: []
      - eval_time: 70m
        alertname: DeviceKeyUsedByMultipleClients
        exp_alerts:
          # count() aggregates host_id away on purpose — this is a fleet-wide
          # "does this exist at all" statement, not per-device.
          - exp_labels:
              severity: warning
              service: tailscale2otel
              domain: security
            exp_annotations:
              summary: "A node key has been used by more than one client simultaneously"
              runbook_url: "https://m7kni.io/tailscale2otel/runbooks/#device-posture-coverage"

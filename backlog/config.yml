project_name: "tailscale2otel"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Parked", "Done"]
labels: []
definition_of_done: ["just check passes (the full gate; it is what CI enforces)", "just gen leaves no diff (only if a generated artifact's inputs changed)", "just --fmt --check passes and every new recipe has a # doc comment and a [group(...)]"]
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
zero_padded_ids: 4
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "tso"

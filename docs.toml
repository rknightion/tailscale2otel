[site]
name = "tailscale2otel"
description = "Tailscale exporter for OpenTelemetry and Prometheus. Export device fleet metrics, network flow logs and audit logs over OTLP to Grafana Cloud or any OTEL backend, or expose metrics through a Prometheus pull endpoint. Single Go binary; Headscale supported."

# tailscale2otel configuration.
#
# Configuration is layered: built-in defaults < this file < environment variables.
# Scalar fields and simple lists can be set (or overridden) by an environment variable named with
# the TS2OTEL_ prefix and "__" between nesting levels. Maps and lists of structured entries stay in
# YAML. For example:
#
#   tailscale.auth.oauth.client_secret  ->  TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_SECRET
#   otlp.endpoint                       ->  TS2OTEL_OTLP__ENDPOINT
#   collectors.flowlogs.interval        ->  TS2OTEL_COLLECTORS__FLOWLOGS__INTERVAL
#
# Keep SECRETS in environment variables — the env layer overrides this file, so a
# secret never has to appear here. This file is optional: with no -config flag the
# exporter runs from defaults + environment alone (handy for containers).
#
# Every option below is shown with its default value and an explanatory comment.
# Most users only need to set tailscale.* + otlp.* and leave the rest at defaults.
# Prose reference: docs/configuration.md.
#
# The line below points editors at the generated JSON Schema (config.schema.json)
# for completion and shape checking. It validates NAMES, TYPES and closed value
# sets only. `tailscale2otel -validate` checks the full static configuration, while
# `tailscale2otel -preflight` also authenticates, builds each runtime, and runs one collector cycle.
# yaml-language-server: $schema=https://raw.githubusercontent.com/rknightion/tailscale2otel/main/config.schema.json

log_level: info                       # exporter's own log verbosity: debug | info | warn | error
log_format: text                      # operational log encoding: text | json (json = one record per line)

provider: tailscale                   # control-plane backend: tailscale (default) | headscale

# ── Headscale connection (only used when provider: headscale) ───────────────────
# Under provider: headscale only the devices/users/keys/acl/nodemetrics collectors
# run; the Tailscale-only collectors (flowlogs, auditlogs, services, webhooks,
# contacts, posture_integrations, log_stream, oauth_apps, settings, dns) auto-disable.
headscale:
  url: ""                             # Headscale origin only (scheme + host, optional port; no path, credentials, query, or fragment), e.g. https://headscale.example.org (TS2OTEL_HEADSCALE__URL)
  api_key: ""                         # Bearer API key — keep in env (TS2OTEL_HEADSCALE__API_KEY)
  api_key_file: ""                    # read the value from this file instead (Docker secrets); set the value or the file, not both; content is whitespace-trimmed
  ip_prefixes: []                     # tailnet address CIDRs allocated by this Headscale; empty = Tailscale defaults. Must be canonical and fully inside RFC1918, fc00::/7, or 100.64.0.0/10
  http:                               # HTTP client used for all Headscale API calls
    timeout: 30s                      # per-attempt timeout; retry queueing/rate-limit wait is outside this budget
    retry:                            # retry policy for retryable transport errors, HTTP 429 and HTTP 5xx
      max_attempts: 0
      base_delay: 0s
      max_delay: 0s
    rate_limit: 0
  max_response_bytes: 4194304         # cap (4 MiB) on ONE Headscale API response body before decoding; ~5800 nodes at ~715 B each — raise it (and the container memory limit) on a bigger deployment, these endpoints are not paginated
# The budget bounds the exporter's peak decode memory. Decoding costs SEVERAL TIMES
# the wire size, so keep it well under the deployment's memory limit (Helm default:
# 256Mi). The structural budgets (nesting depth 64, single string 4 MiB, array
# elements 500000) are fixed in code and shared with the Tailscale client — no real
# Headscale response comes close to them.
# Tip: to scrape Headscale's own SERVER metrics (the control plane, default :9090 —
# NOT a per-node tailscaled :5252 endpoint), add it as a static node_metrics target:
#   node_metrics:
#     enabled: true
#     targets:
#       - url: http://headscale:9090/metrics
#         instance: headscale-server

# ── Tailscale API connection ────────────────────────────────────────────────────
tailscale:
  tailnet: "-"                        # "-" = the authenticated principal's default tailnet (works out of the box); or set your tailnet's name explicitly, e.g. "example.com"
  auth:
    method: oauth                     # oauth (recommended) | apikey | workload_identity (keyless OIDC exchange)
    oauth:                            # used when method: oauth — scoped, short-lived, not user-bound
      client_id: ""                   # OAuth client ID (set via TS2OTEL_TAILSCALE__AUTH__OAUTH__CLIENT_ID)
      client_secret: ""               # OAuth client secret — keep in env, not here (..._CLIENT_SECRET)
      client_secret_file: ""          # read the value from this file instead (Docker secrets); set the value or the file, not both; content is whitespace-trimmed
      scopes:                         # least-privilege read scopes requested for the token
        - all:read
    apikey: ""                        # personal API key (set via TS2OTEL_TAILSCALE__AUTH__APIKEY); used only when method: apikey — expires <=90d and is tied to its creator
    apikey_file: ""                   # read the value from this file instead (Docker secrets); set the value or the file, not both; content is whitespace-trimmed
    workload_identity:                # used when method: workload_identity — fully keyless OIDC token exchange (no stored secret)
      client_id: ""                   # federated OAuth client ID from the Tailscale admin console (TS2OTEL_TAILSCALE__AUTH__WORKLOAD_IDENTITY__CLIENT_ID)
      id_token_file: ""               # path to the OIDC ID token, e.g. a Kubernetes projected service-account token; re-read on every exchange (rotation-safe)
  http:                               # HTTP client used for all Tailscale API calls
    timeout: 30s                      # per-attempt timeout (each retry attempt; a retried request may take longer, and long Retry-After waits are honored)
    retry:
      max_attempts: 4                 # total attempts per request (1 = no retry); exponential backoff between tries
      base_delay: 500ms               # initial backoff delay
      max_delay: 10s                  # backoff ceiling
    rate_limit: 0                     # global requests/sec across ALL collectors (0 = unlimited)
  max_response_bytes: 4194304         # cap (4 MiB) on ONE snapshot-endpoint response body before decoding; ~2400 devices at ~1.8 KiB each — raise it (and the container memory limit) on a bigger tailnet, these endpoints are not paginated
  max_log_response_bytes: 33554432    # cap (32 MiB) on ONE flow-log/audit-log response body; ~12000 flow records per poll — shrink the collector's window instead of raising this if you hit it
  organization: ""                    # alpha roster inventory via first runtime credential (needs tailnets:read); runtimes still require explicit credentials
# Both budgets are fleet-wide (they apply to every entry in tailnets: below too) and
# bound the exporter's peak decode memory. Decoding costs SEVERAL TIMES the wire size,
# so keep them well under the deployment's memory limit (Helm default: 256Mi).
# Structural budgets (nesting depth 64, single string 4 MiB, array elements 500000)
# are fixed in code — no real Tailscale response comes close to them.

# ── Multi-tailnet / MSP (OPTIONAL) ──────────────────────────────────────────────
# Observe MORE THAN ONE tailnet from a single instance. Mutually exclusive with an
# explicit tailscale.tailnet above (leave it at "-" when using this list). Each
# entry is self-contained (its own name + auth + http + objectstore) — credentials
# are never inherited from the tailscale: block. Tailnet identity is emitted as the
# tailscale.tailnet OTEL resource attribute (one target_info per tailnet); query
# fleet-wide with `sum without(instance)(...)`. The list itself is FILE-ONLY, but
# an OAuth client_secret for a named entry may be injected as
# TS2OTEL_TAILNET_<NORMALIZED_NAME>__AUTH__OAUTH__CLIENT_SECRET, where the name is
# upper-cased and every non-letter/digit is `_`; it wins over the YAML value and
# errors when it matches no configured entry. Streaming/webhook receivers work here, but
# a list of MORE THAN ONE tailnet must route them explicitly with streaming.routes /
# webhook.routes (also FILE-ONLY), each naming one tailnets[].name. A list of exactly
# one entry may still use the legacy single-listener fields. Default: empty (single
# tailnet from the tailscale: block above).
#
# objectstore.flow / objectstore.audit (OPTIONAL, and REQUIRED on every entry when
# the matching collectors.{flowlogs,auditlogs}.source is objectstore): each tailnet's
# own export bucket per signal. Same fields as collectors.flowlogs.objectstore below.
# With a tailnets: list NOTHING is inherited from the global blocks — a runtime
# without its own complete destination (endpoint + region + bucket) for a signal it
# reads is a startup error. No two destinations this process reads may name the same
# feed, whether they belong to two tailnets (each would attribute a copy of every
# record to its own tailnet) or two signals (each would fetch every object and then
# fail to decode the other's records). Because the list is file-only, a static S3 credential must
# come from a *_file sibling (a mounted Secret) or the ambient chain; only the
# tuning fields (interval/lookback/max_*) fall back to the built-in defaults.
tailnets: []
#   - name: acme.example.com
#     cardinality:
#       metric_limit: 0               # 0 = inherit global; negative = unlimited for this tailnet; positive = explicit limit
#       warning_threshold: 0          # 0 = inherit global; otherwise the per-tailnet status warning threshold
#       critical_threshold: 0         # 0 = inherit global; effective value must be >= warning_threshold
#     auth:
#       method: oauth
#       oauth:
#         client_id: "client-id"      # identifier, not a secret; list entries are file-only
#         client_secret_file: /run/secrets/acme-oauth-secret
#         scopes: [all:read]          # least-privilege; unset requests every scope the client holds
#     objectstore:
#       flow:
#         endpoint: https://s3.eu-west-2.amazonaws.com
#         region: eu-west-2
#         bucket: acme-flow-logs
#         prefix: exports/           # distinct bucket OR distinct prefix per tailnet
#         path_style: false
#         secret_access_key_file: /run/secrets/acme-s3-secret   # no env path for a list entry
#       audit:                       # the CONFIGURATION-log export; a destination of its own, never inherited from flow
#         endpoint: https://s3.eu-west-2.amazonaws.com
#         region: eu-west-2
#         bucket: acme-flow-logs
#         prefix: configuration/     # same bucket as flow is fine, but the prefix must differ
#         secret_access_key_file: /run/secrets/acme-s3-secret
#   - name: beta.example.com
#     auth:
#       method: apikey
#       apikey: ""
#     objectstore:
#       flow:
#         endpoint: https://s3.eu-west-2.amazonaws.com
#         region: eu-west-2
#         bucket: beta-flow-logs

# ── OTLP export destination ─────────────────────────────────────────────────────
otlp:
  protocol: http                      # http | grpc | stdout (stdout = print signals to the console for local debug, no backend)
  endpoint: https://otlp-gateway-prod-us-central-0.grafana.net/otlp   # OTLP base URL (the exporter appends /v1/metrics, /v1/logs and /v1/traces itself)
  grafana_cloud:                      # convenience: instance_id + token become an "Authorization: Basic" header for Grafana Cloud
    instance_id: ""                   # Grafana Cloud stack/instance ID (set via TS2OTEL_OTLP__GRAFANA_CLOUD__INSTANCE_ID)
    token: ""                         # Grafana Cloud OTLP token — keep in env (..._GRAFANA_CLOUD__TOKEN)
    token_file: ""                    # read the value from this file instead (Docker secrets); set the value or the file, not both; content is whitespace-trimmed
  headers: {}                         # extra raw OTLP headers, e.g. {X-Scope-OrgID: "1"} (alternative to grafana_cloud); FILE-ONLY (maps aren't settable via env)
  tls:
    insecure: false                   # disable TLS entirely (plaintext h2c/http) — NOT a cert-verify skip; do not use in production
    insecure_skip_verify: false       # keep TLS but skip server-cert verification (self-signed/private-CA gateways, testing only — prefer ca_file)
    ca_file: ""                       # path to a custom CA bundle to trust
    cert_file: ""                     # client certificate path (for mutual TLS)
    key_file: ""                      # client private key path (for mutual TLS)
  metric_interval: 60s                # how often metrics are pushed (60s aligns with a 1-data-point-per-minute scrape)
  metric_export_batch_size: 10000     # maximum datapoints per OTLP metric request; lower this when a backend has a small request-size limit (serialized bytes vary with labels)
  metric_temporality: cumulative      # cumulative (Grafana Cloud default) | delta
  outage_summary_interval: 5m         # repeat a concise diagnostic while an OTLP outage continues
  limits:                             # bound ONE log record before export (a valid request can still carry one enormous record)
    log_body_bytes: 32768             # cap a log record's body; UTF-8 safe, applied AFTER redaction, leaves a truncation marker. Minimum 64 — there is no unlimited setting
    log_attribute_value_bytes: 4096   # cap each string-valued log ATTRIBUTE; never applied to metric labels (those must stay byte-exact or series split)
  compression: ""                     # gzip | none. Empty defers to OTEL_EXPORTER_OTLP[_<SIGNAL>]_COMPRESSION, then the exporter default. TS2OTEL_OTLP__COMPRESSION
  timeout: 0s                         # per-request export timeout; 0 defers to OTEL_EXPORTER_OTLP[_<SIGNAL>]_TIMEOUT, then the exporter's 10s. TS2OTEL_OTLP__TIMEOUT
  max_request_size: 0                 # bytes; a client-side REJECTION guard, not a splitter — it fails an oversized request instead of shipping it into a 413. Use metric_export_batch_size to actually stay under an ingest limit
  grpc_reconnection_period: 0s        # force a fresh gRPC connection attempt after this long; gRPC only, 0 = the gRPC client default
  retry:                              # exporter retry policy; leave the whole block untouched to keep the exporter's own default
    enabled: true                     # set false to disable retry
    initial_interval: 5s              # first backoff delay
    max_interval: 30s                 # backoff ceiling
    max_elapsed_time: 1m              # give up after this long
  batch:                              # log/span processor queues. The SDK's queues are bounded and drop SILENTLY, which is why the queue/drop self-obs metrics exist
    logs:                             # 0 / 0s on any field means "leave the SDK default"
      max_queue_size: 0               # records buffered before new ones are dropped (non-blocking by design)
      export_max_batch_size: 0        # records per export; must be <= max_queue_size when both are set
      export_interval: 0s             # how often a partial batch is flushed
      export_timeout: 0s              # bound on one export attempt
    traces:
      max_queue_size: 0               # spans buffered before new ones are dropped
      export_max_batch_size: 0        # spans per export; must be <= max_queue_size when both are set
      export_interval: 0s             # how often a partial batch is flushed
      export_timeout: 0s              # bound on one export attempt
  stdout:                             # only applies when protocol is stdout, which is a DEBUGGING sink (no reliability or rotation promise)
    metric_interval: 5s               # short cadence so a debug run doesn't wait 60s for a metric; logs and spans are emitted synchronously
    pretty: false                     # indent the emitted JSON
  credential_reload:                  # rotate the token/header/TLS FILES the exporters read, without restarting
    enabled: false                    # governs the background poller only; last-known-good is always retained for a configured file
    interval: 30s                     # poll period; minimum 5s. Ignored when enabled is false
  metrics:                          # send ONE signal somewhere else — a different collector, tenant, credential or protocol
    enabled:                          # null inherits (the signal is on); false stops exporting this signal WITHOUT disturbing the others
    protocol: ""                      # empty inherits otlp.protocol
    endpoint: ""                      # empty inherits otlp.endpoint
    headers: {}                       # REPLACES otlp.headers for this signal rather than merging, so one signal's credential never reaches another's endpoint
    tls:                              # every empty/null field inherits the matching otlp.tls value
      insecure:                       # null inherits; explicit true/false overrides
      insecure_skip_verify:           # null inherits; explicit true/false overrides
      ca_file: ""
      cert_file: ""
      key_file: ""
    compression: ""                   # empty inherits otlp.compression
    timeout: 0s                       # 0 inherits otlp.timeout
    max_request_size: 0               # 0 inherits otlp.max_request_size
    grpc_reconnection_period: 0s      # 0 inherits otlp.grpc_reconnection_period
    retry:                            # an untouched block inherits otlp.retry; setting ANY field overrides the whole policy for this signal
      enabled:
      initial_interval: 0s
      max_interval: 0s
      max_elapsed_time: 0s
  logs:                             # an untouched block inherits every otlp.* setting above
    enabled:                          # null inherits (the signal is on); false stops exporting this signal WITHOUT disturbing the others
    protocol: ""                      # empty inherits otlp.protocol
    endpoint: ""                      # empty inherits otlp.endpoint
    headers: {}                       # REPLACES otlp.headers for this signal rather than merging, so one signal's credential never reaches another's endpoint
    tls:                              # every empty/null field inherits the matching otlp.tls value
      insecure:                       # null inherits; explicit true/false overrides
      insecure_skip_verify:           # null inherits; explicit true/false overrides
      ca_file: ""
      cert_file: ""
      key_file: ""
    compression: ""                   # empty inherits otlp.compression
    timeout: 0s                       # 0 inherits otlp.timeout
    max_request_size: 0               # 0 inherits otlp.max_request_size
    grpc_reconnection_period: 0s      # 0 inherits otlp.grpc_reconnection_period
    retry:                            # an untouched block inherits otlp.retry; setting ANY field overrides the whole policy for this signal
      enabled:
      initial_interval: 0s
      max_interval: 0s
      max_elapsed_time: 0s
  traces:                           # credentials are never shared across a signal boundary
    enabled:                          # null inherits (the signal is on); false stops exporting this signal WITHOUT disturbing the others
    protocol: ""                      # empty inherits otlp.protocol
    endpoint: ""                      # empty inherits otlp.endpoint
    headers: {}                       # REPLACES otlp.headers for this signal rather than merging, so one signal's credential never reaches another's endpoint
    tls:                              # every empty/null field inherits the matching otlp.tls value
      insecure:                       # null inherits; explicit true/false overrides
      insecure_skip_verify:           # null inherits; explicit true/false overrides
      ca_file: ""
      cert_file: ""
      key_file: ""
    compression: ""                   # empty inherits otlp.compression
    timeout: 0s                       # 0 inherits otlp.timeout
    max_request_size: 0               # 0 inherits otlp.max_request_size
    grpc_reconnection_period: 0s      # 0 inherits otlp.grpc_reconnection_period
    retry:                            # an untouched block inherits otlp.retry; setting ANY field overrides the whole policy for this signal
      enabled:
      initial_interval: 0s
      max_interval: 0s
      max_elapsed_time: 0s

# ── Delivery topology ──────────────────────────────────────────────────────────
delivery:
  mode: otlp                         # otlp keeps historical push-only delivery; prometheus serves /metrics and suppresses inherited OTLP metrics/logs/traces; dual enables both. An otlp.<signal>.endpoint explicitly opts that signal back in under prometheus mode

# ── Enrichment (device-name cache + optional reverse DNS) ───────────────────────
enrichment:
  cache_ttl: 5m                       # staleness alarm threshold for the IP/nodeID -> name device cache
  device_cache_stale_after: 0s        # mark cached identity stale after this age; 0 preserves fresh-until-replaced behaviour
  reverse_dns:                        # opt-in PTR enrichment: resolve EXTERNAL (non-Tailscale) flow IPs to hostnames
    enabled: false                    # off by default (can add ~one flow-metric series per external IP when on)
    server: ""                        # resolver "ip" or "ip:port" (default :53); empty = system/container resolver
    timeout: 2s                       # per-lookup timeout
    cache_ttl: 24h                    # how long a resolved name is cached (PTRs rarely change, so a long TTL keeps resolver load low)
    negative_ttl: 5m                  # how long a failed lookup is remembered (suppresses retries)
    stale_ttl: 1h                     # keep serving a resolved name this long past cache_ttl while one refresh runs (0 disables; stops the flow label flapping to external at every expiry)
    max_entries: 50000                # PTR cache size bound (new external IPs beyond this are not resolved; ~150 bytes/entry)
    acknowledge_cardinality: false     # set true (once metric_limit is sized) to silence the enabled+node_dims cardinality advisory
  geoip:                              # opt-in geo/ASN enrichment of EXTERNAL flow addresses, from local MaxMind .mmdb files (lookups never touch the network)
    enabled: false                    # off by default; tailnet addresses (CGNAT 100.64/10, ULA fd7a:115c:a1e0::/48) are NEVER geolocated
    country_database: ""              # path to a GeoLite2/GeoIP2 Country .mmdb; a City database also works and additionally fills locality/region/coordinates on flow LOGS
    asn_database: ""                  # path to a GeoLite2/GeoIP2 ASN .mmdb; the AS number and organization ride flow LOGS only, never a metric
    reload_interval: 6h               # re-stat the files above and hot-swap a changed one (this is what makes an external geoipupdate cron work; 0 disables)
    acknowledge_cardinality: false     # set true (once metric_limit is sized) to silence the geo_dims-on-raw-flow-metrics advisory
    download:                         # optional built-in MaxMind updater, so no geoipupdate sidecar is needed
      enabled: false                  # off by default; leave off if something else supplies the .mmdb files
      account_id: ""                  # MaxMind account ID (a free GeoLite2 account is enough)
      license_key: ""                 # MaxMind license key — set via TS2OTEL_ENRICHMENT__GEOIP__DOWNLOAD__LICENSE_KEY, never in YAML
      license_key_file: ""            # read the license key from a file instead (Docker/Kubernetes secret style)
      editions: [GeoLite2-Country, GeoLite2-ASN]  # MaxMind edition IDs; each installs as <directory>/<edition>.mmdb (swap in GeoLite2-City for locality/coordinates on logs)
      directory: ""                   # where databases are installed; empty = <state dir>/geoip (same place as the checkpoint file)
      interval: 24h                   # how often to ask MaxMind for a newer build; each check is conditional, so an unchanged database costs a 304 and no download quota
      timeout: 5m                     # per-edition download timeout
      endpoint: "https://download.maxmind.com/geoip/databases"  # download API base; override only for a local mirror

# ── Cardinality (metric/label volume trade-offs) ────────────────────────────────
cardinality:
  metric_limit: 10000                 # hard per-metric series cap; beyond it the SDK collapses extras into otel_metric_overflow (0/negative = unlimited)
  derp_region_rollup: true            # emit tailnet-wide per-DERP-region rollup gauges (tailscale.derp.region.*)
  subnet_route_rollup: true           # emit per-CIDR tailscale.subnet_routes.routers redundancy gauge (one series per subnet CIDR); fleet exit/subnet counts emit regardless
  warning_threshold: 2000             # status-page cardinality view flags a metric at/above this active-series count (self-obs only; 0 disables)
  critical_threshold: 8000            # status-page cardinality view flags a metric critically at/above this count (must be >= warning_threshold; <= metric_limit when set; 0 disables)
  label_value_sample_cap: 100         # distinct values retained per (metric,label) for the label-cardinality views; beyond it the label is capped and examples truncated (0 disables label capture)
  flow:                               # shapes flow METRICS only — flow LOGS always carry full detail
    metrics_mode: rollup              # rollup (bounded top-N, lowest cardinality) | all (raw per-connection) | both (≈2x series; summing double-counts)
    rollup_top_n: 500                 # rollup mode: busiest src/dst node pairs kept per flush; the rest fold into an __other__ series (0 = default 500)
    source_port: false                # add source.port to flow metrics. INERT under metrics_mode: rollup (raw modes only) — and the most expensive knob here, ephemeral ports are unbounded
    destination_port: false           # add destination.port to flow metrics. INERT under metrics_mode: rollup (raw modes only); dst.service below is the bounded stand-in and is always on
    node_dims: true                   # include src/dst device names on flow metrics (who talked to whom); off keeps totals but drops the per-peer breakdown and suppresses the unique.* gauges
    identity_dims: false              # add per-flow tailscale.{src,dst}.{user,tags,os} to flow metrics, on BOTH families. REQUIRES node_dims (identity is node-derived, so without it identity becomes the only splitting dimension); flow LOGS always carry them
    collapse_external: true           # bucket unresolved IPs as external/unknown (keeps cardinality bounded)
    exit_node_attribution: true       # emit bounded tailscale.exit_node.io/packets attributing exit traffic to the relaying node (bounded by exit-node count)
    geo_dims: false                   # add source/destination geo.country.iso_code + geo.continent.code to flow METRICS (needs enrichment.geoip). Nearly free under metrics_mode: rollup (top-N bounded); on the RAW families it splits the single "external" series ~250 ways. ASN/city NEVER reach a metric; flow LOGS carry everything regardless
  per_entity:                         # emit one gauge series per entity (true) or only the aggregate *.count (false)
    device: true                      # per-device gauges (online/last_seen/key_expiry/derp/routes)
    user: true                        # per-user gauges (devices/connected/last_seen)
    key: true                         # per-key expiry gauge (the expiry WARN log fires regardless)
    webhook: true                     # per-endpoint webhook-subscriptions gauge
    service: true                     # per-service ports/hosts gauges

# ── Collectors ──────────────────────────────────────────────────────────────────
# Each collector takes enabled + interval. The two LOG collectors (flowlogs,
# auditlogs) also take a source and windowing fields. Pick exactly ONE ingestion
# path per log type (source: poll OR stream) to avoid double-counting.
collectors:
  devices:                            # device inventory — REQUIRED for flow/audit IP->name enrichment (disabling it degrades names to unknown/external)
    enabled: true
    interval: 60s                     # how often the device snapshot is polled
    change_log_enabled: false         # emit structured device add/remove and field-change records. PII-bearing fields still follow pii_filter. TS2OTEL_COLLECTORS__DEVICES__CHANGE_LOG_ENABLED
    collect_routes: false             # also fetch advertised/primary subnet routes per device
    collect_connectivity: true        # emit per-device NAT/connectivity health (hard_nat/endpoints/direct_capable/udp/ipv6) + fleet rollups from the device payload (no extra API calls)
    collect_posture: false            # also fetch device posture (MDM/EDR) — enables the posture metrics + log
    collect_device_invites: true      # also fetch outstanding device share invites per device (one extra API call per device, N+1); emits tailscale.device_invites.count
    subrequest_concurrency: 1         # bounded posture/invite request pool; 1 preserves sequential requests
    posture_compliance_checks: []     # exact checks: [{name: managed, attribute: custom:managed, equals: "true"}]; missing/different fails
    posture_log_mode: changes         # needs collect_posture: changes (log only on change) | always (every scrape) | off (no log); the posture METRIC is always emitted
    expiry_log_mode: daily            # node-key AND posture-attribute expiry WARN cadence: daily (change + at most one reminder/24h, default) | always (every scrape, legacy) | off; metrics always emit
    attribute_namespaces:             # needs collect_posture: posture-key namespaces promoted to attribute metrics; ["*"] = all, [] = disable
      - intune
      - jamf
      - kandji
      - crowdstrike
      - sentinelone
      - kolide
      - ip
    attribute_key_limit: 200          # busiest posture attribute keys promoted fleet-wide; overflow keys are dropped and counted (0/negative = unlimited); cardinality.metric_limit is still the final SDK guard
    attribute_value_limit: 50         # busiest values per attribute key on the .info gauge; overflow folds to value="__other__" (0/negative = unlimited)
    collect_tag_rollup: true          # emit tailscale.devices.by_tag (one series per ACL tag); false keeps the other fleet-hygiene aggregates
    tag_rollup_limit: 50              # cap distinct tag series on by_tag; busiest N kept, rest fold into tag="__other__" (0/negative = unlimited)
  flowlogs:                           # network flow logs -> traffic counters + per-connection logs
    enabled: true
    source: poll                      # poll (this exporter PULLS) | stream (Tailscale PUSHES to the streaming receiver) | objectstore (read Tailscale's S3 export) | both (discouraged: double-counts)
    interval: 60s                     # poll only — how often a window is polled
    lag: 120s                         # poll only — query only up to now-lag so late-arriving records aren't missed
    initial_lookback: 5m              # poll only — cold-start reach-back when there is no checkpoint yet
    max_window: 1h                    # poll only — cap one tick's window so a long outage catches up over several ticks
    dedup_capacity: 16384             # identities retained for poll-window AND cross-source dedup; must be >0 (unlimited would leak memory)
    replay_overlap: 5m                # poll only — reread this completed-window overlap for records that became available late (0 disables)
    replay_seen_capacity: 131072      # poll only — durable hashed connection identities retained for overlap dedup (1..1048576 when enabled)
    trusted_reporter_node_ids: []     # verified FlowLog.NodeID values classified as configured; empty with trusted_reporter_tags means trust policy is unconfigured
    trusted_reporter_tags: []         # authoritative device tags (e.g. ["tag:router"]) classified as tagged; embedded flow tags never grant trust
    log_mode: per_connection          # per_connection | per_record | off — log detail level (applies to poll AND stream)
    max_log_records_per_window: 0     # cap flow LOG records per window (0 = unlimited); excess -> tailscale.network.flow.logs_dropped (metrics are never capped)
    objectstore:                      # source: objectstore only — read the flow-log export Tailscale writes to an S3-compatible bucket
      endpoint: ""                    # required — service URL, e.g. https://s3.eu-west-2.amazonaws.com, or a MinIO/Ceph address (never derived from the region)
      region: ""                      # required — part of the request signature; a wrong value fails every request with HTTP 403
      bucket: ""                      # required — the bucket Tailscale exports into
      prefix: ""                      # the export's root within the bucket, above the YYYY/MM/DD partitions; NO leading slash (it becomes part of this feed's durable checkpoint identity, so removing it later re-emits history)
      layout: partitioned             # partitioned (Tailscale's own export: objects under prefix/YYYY/MM/DD/) | flat (a COPIED export whose self-contained YYYY-MM-DD-HH-MM-SS basenames sit directly under prefix; finds partitioned objects too, but costs more LIST requests since nothing bounds the re-walk)
      path_style: false               # address as <endpoint>/<bucket>/<key>; required by most non-AWS implementations
      allow_insecure_http: false      # remote plaintext endpoints are rejected by default; loopback HTTP remains available for local MinIO development
      access_key_id: ""               # SET VIA ENV ONLY. Leave empty to use the ambient chain: environment, then IRSA/web identity, then the ECS/EKS container credential endpoint, then EC2 instance profile
      access_key_id_file: ""          # read the access key ID from this path instead; value XOR file
      secret_access_key: ""           # SET VIA ENV ONLY
      secret_access_key_file: ""      # read the secret access key from this path instead; value XOR file
      session_token: ""               # SET VIA ENV ONLY — temporary credentials only
      session_token_file: ""          # read the temporary session token from this path instead; value XOR file
      interval: 60s                   # how often the bucket is listed
      lookback: 1h                    # how far back past the cursor each listing reaches, so a late-arriving object is still found
      initial_lookback: 6h            # cold-start reach-back, so a first run against a long history doesn't ingest all of it; CAPPED IN EFFECT AT 14 DAYS under layout: partitioned (a larger value silently ingests only the newest 14 day partitions — use layout: flat to reach further back)
      max_objects: 200                # objects ingested per cycle; the remainder is counted, logged and picked up next cycle
      max_seen_keys: 5000             # durable seen-object identities retained per destination; too low can re-ingest an evicted object inside the lookback
      max_object_wire_bytes: 67108864 # reject and quarantine one object requiring more than 64 MiB of GET response bytes
      max_object_decompressed_bytes: 33554432  # reject and quarantine one object that expands beyond 32 MiB
      max_object_records: 100000      # reject and quarantine one object containing more than this many records
      max_cycle_wire_bytes: 536870912 # defer untouched objects after 512 MiB of GET response data in one cycle
      max_cycle_decompressed_bytes: 268435456  # defer untouched objects after 256 MiB of decoded data in one cycle
      max_cycle_records: 500000       # defer untouched objects after this many decoded records in one cycle
  auditlogs:                          # configuration/audit events -> event logs + a counter
    enabled: true
    source: poll                      # poll | stream | both | objectstore (see flowlogs)
    interval: 60s                     # poll only
    lag: 60s                          # poll only
    initial_lookback: 5m              # poll only
    max_window: 6h                    # poll only
    dedup_capacity: 4096              # identities retained for poll-window AND audit/webhook cross-source dedup; must be >0
    objectstore:                      # source: objectstore only — read the CONFIGURATION-log export Tailscale writes to an S3-compatible bucket. A separate export from the flow one: nothing here is inherited from collectors.flowlogs.objectstore, and two destinations may not name the same bucket+prefix
      endpoint: ""                    # required — service URL, e.g. https://s3.eu-west-2.amazonaws.com, or a MinIO/Ceph address (never derived from the region)
      region: ""                      # required — part of the request signature; a wrong value fails every request with HTTP 403
      bucket: ""                      # required — the bucket Tailscale exports configuration logs into
      prefix: ""                      # the export's root within the bucket, above the YYYY/MM/DD partitions; use a distinct prefix when flow and configuration logs share one bucket. NO leading slash (see flowlogs)
      layout: partitioned             # partitioned (Tailscale's own export: objects under prefix/YYYY/MM/DD/) | flat (a COPIED export whose self-contained YYYY-MM-DD-HH-MM-SS basenames sit directly under prefix; finds partitioned objects too, but costs more LIST requests since nothing bounds the re-walk)
      path_style: false               # address as <endpoint>/<bucket>/<key>; required by most non-AWS implementations
      allow_insecure_http: false      # remote plaintext endpoints are rejected by default; loopback HTTP remains available for local MinIO development
      access_key_id: ""               # SET VIA ENV ONLY. Leave empty to use the ambient chain: environment, then IRSA/web identity, then the ECS/EKS container credential endpoint, then EC2 instance profile
      access_key_id_file: ""          # read the access key ID from this path instead; value XOR file
      secret_access_key: ""           # SET VIA ENV ONLY
      secret_access_key_file: ""      # read the secret access key from this path instead; value XOR file
      session_token: ""               # SET VIA ENV ONLY — temporary credentials only
      session_token_file: ""          # read the temporary session token from this path instead; value XOR file
      interval: 60s                   # how often the bucket is listed
      lookback: 1h                    # how far back past the cursor each listing reaches, so a late-arriving object is still found
      initial_lookback: 6h            # cold-start reach-back, so a first run against a long history doesn't ingest all of it; CAPPED IN EFFECT AT 14 DAYS under layout: partitioned (a larger value silently ingests only the newest 14 day partitions — use layout: flat to reach further back)
      max_objects: 200                # objects ingested per cycle; the remainder is counted, logged and picked up next cycle
      max_seen_keys: 5000             # durable seen-object identities retained per destination
      max_object_wire_bytes: 67108864 # reject and quarantine one object requiring more than 64 MiB of GET response bytes
      max_object_decompressed_bytes: 33554432  # reject and quarantine one object that expands beyond 32 MiB
      max_object_records: 100000      # reject and quarantine one object containing more than this many records
      max_cycle_wire_bytes: 536870912 # defer untouched objects after 512 MiB of GET response data in one cycle
      max_cycle_decompressed_bytes: 268435456  # defer untouched objects after 256 MiB of decoded data in one cycle
      max_cycle_records: 500000       # defer untouched objects after this many decoded records in one cycle
  k8s_audit:                          # Kubernetes API-audit events from Tailscale's tsrecorder -> request logs + bounded counters. Requires enableEvents in the tailscale.com/cap/kubernetes ACL grant (BETA upstream). NOTE: the source carries no response status, latency or byte count, so allowed-vs-denied and error rates are NOT derivable
    enabled: false
    objectstore:                      # the ONLY ingestion path — tsrecorder exposes no read API, no stream and no push, so there is deliberately no `source:` key here
      endpoint: ""                    # required — service URL, e.g. https://s3.eu-west-1.amazonaws.com, or a MinIO/Ceph address
      region: ""                      # required — part of the request signature; a wrong value fails every request with HTTP 403
      bucket: ""                      # required — the bucket tsrecorder writes recordings into. Never inherited from the flowlogs/auditlogs destinations: this is a separate bucket with its own key layout
      prefix: ""                      # usually EMPTY: tsrecorder keys are <stableID>/events/<ts>.event and <stableID>/<ts>.cast, and <stableID> differs per recorder replica so it cannot be pinned in a prefix. NO leading slash
      layout: recorder                # recorder is the only accepted value here; partitioned and flat are REFUSED because tsrecorder writes no YYYY/MM/DD partitions and its RFC3339Nano basenames sort differently
      path_style: false               # address as <endpoint>/<bucket>/<key>; required by most non-AWS implementations
      allow_insecure_http: false      # remote plaintext endpoints are rejected by default; loopback HTTP remains available for local MinIO development
      access_key_id: ""               # SET VIA ENV ONLY. Leave empty to use the ambient chain: environment, then IRSA/web identity, then the ECS/EKS container credential endpoint, then EC2 instance profile
      access_key_id_file: ""          # read the access key ID from this path instead; value XOR file
      secret_access_key: ""           # SET VIA ENV ONLY
      secret_access_key_file: ""      # read the secret access key from this path instead; value XOR file
      session_token: ""               # SET VIA ENV ONLY — temporary credentials only
      session_token_file: ""          # read the temporary session token from this path instead; value XOR file
      interval: 60s                   # how often the bucket is listed
      lookback: 1h                    # how far back past the cursor each listing reaches, so a late-arriving object is still found
      initial_lookback: 6h            # cold-start reach-back, so a first run against a long history doesn't ingest all of it
      max_objects: 200                # objects ingested per cycle; the remainder is counted, logged and picked up next cycle. tsrecorder writes ONE event per object, so a busy cluster needs a higher value here than a flow/audit export does
      max_seen_keys: 5000             # durable seen-object identities retained per destination
      max_object_wire_bytes: 67108864 # reject and quarantine one object requiring more than 64 MiB of GET response bytes
      max_object_decompressed_bytes: 33554432  # reject and quarantine one object that expands beyond 32 MiB. RAISE THIS if you record long terminal sessions: only the .cast header line is read for meaning, but the whole object is still streamed, and an oversized one is quarantined rather than partially read
      max_object_records: 100000      # reject and quarantine one object containing more than this many records
      max_cycle_wire_bytes: 536870912 # defer untouched objects after 512 MiB of GET response data in one cycle
      max_cycle_decompressed_bytes: 268435456  # defer untouched objects after 256 MiB of decoded data in one cycle
      max_cycle_records: 500000       # defer untouched objects after this many decoded records in one cycle
  users:                              # user inventory (devices/connected/last_seen per user)
    enabled: true
    interval: 300s
  keys:                               # auth-key inventory + expiry warnings
    enabled: true
    interval: 300s
    expiry_warn: 168h                 # log a WARN when a key expires within this window (default 7d)
    expiry_log_mode: daily            # WARN cadence: daily (change + at most one reminder/24h, default) | always (every scrape, legacy) | off; metrics always emit
  settings:                           # tailnet settings snapshot
    enabled: true
    interval: 600s
    snapshot_enabled: false           # emit the complete settings response to logs on change plus a heartbeat. TS2OTEL_COLLECTORS__SETTINGS__SNAPSHOT_ENABLED
  acl:                                # ACL policy snapshot
    enabled: true
    interval: 600s
    snapshot_enabled: false           # EXPLICIT PII CONSENT: ship the raw policy and diffs, including every user email and group member, to the logs backend. This overrides pii_filter for those bodies, so logs retention holds tailnet identity data. TS2OTEL_COLLECTORS__ACL__SNAPSHOT_ENABLED
    snapshot_heartbeat: 24h           # refresh an unchanged raw policy snapshot at this cadence. TS2OTEL_COLLECTORS__ACL__SNAPSHOT_HEARTBEAT
    validate: true                    # run the non-mutating POST /acl/validate (policy_file:read scope) each tick; set false to keep the client strictly GET-only
  dns:                                # DNS/MagicDNS settings snapshot
    enabled: true
    interval: 600s
    snapshot_enabled: false           # emit the complete DNS response to logs on change plus a heartbeat. TS2OTEL_COLLECTORS__DNS__SNAPSHOT_ENABLED
  contacts:                           # account/support/security contact verification status (no emails emitted)
    enabled: true
    interval: 600s
  webhooks:                           # webhook-endpoint inventory: count + per-endpoint subscription count (no url/secret)
    enabled: true
    interval: 600s
    snapshot_enabled: false           # emit the complete webhook inventory response to logs on change plus a heartbeat. TS2OTEL_COLLECTORS__WEBHOOKS__SNAPSHOT_ENABLED
    desired_events: []                # optional expected event categories (e.g. ["nodeCreated","userSuspended"]); empty means no expectation
  posture_integrations:               # MDM/EDR posture-integration sync health: matched counts + last_sync staleness
    enabled: true
    interval: 600s
    snapshot_enabled: false           # emit the complete posture-integration response to logs on change plus a heartbeat. TS2OTEL_COLLECTORS__POSTURE_INTEGRATIONS__SNAPSHOT_ENABLED
  log_stream:                         # log-streaming delivery health to a SIEM sink (self-gates to configured=0 when no sink)
    enabled: true
    interval: 600s
    configuration_interval: 0s        # 0 inherits interval; otherwise probe configuration-log delivery independently
    network_interval: 0s              # 0 inherits interval; otherwise probe network-log delivery independently
  oauth_apps:                         # OAuth-application inventory (alpha API; idles silently — no error — on tailnets without it)
    enabled: true
    interval: 300s
  services:                           # Tailscale Services (VIP) inventory
    enabled: true
    interval: 600s
    collect_hosts: false              # also fetch per-service backing-host detail — one extra API call per service (N+1)
    subrequest_concurrency: 1         # bounded backing-host request pool; 1 preserves sequential requests
    collect_tag_rollup: true          # emit tailscale.services.by_tag (one series per ACL tag); false disables the rollup
    tag_rollup_limit: 50              # cap distinct service-tag series; busiest N kept, rest fold into tailscale.tag="__other__" (0/negative = unlimited)
  node_metrics:                       # OPTIONAL: scrape tailscaled per-node Prometheus /metrics and forward them centrally. Off by default; see docs/node-metrics.md
    enabled: false
    interval: 60s                     # how often each target is scraped
    timeout: 10s                      # per-scrape HTTP timeout
    max_response_bytes: 4194304       # per-target response cap (4 MiB) — bounds memory
    max_samples: 50000                # per-target sample cap per scrape — bounds cardinality
    max_distinct_metrics: 2000        # cap on DISTINCT forwarded metric NAMES over the process lifetime (targets choose their own names and each new one creates a permanent instrument); 0 = 2000 default, negative = unlimited (over-budget names are dropped and counted)
    # SECURITY: scraped label values are node-controlled; keep cardinality.metric_limit set
    # (default 10000) so a compromised node cannot mint unbounded series.
    targets: []                       # static targets (FILE-ONLY — a list of objects can't be set via env). Example:
      # - url: http://100.64.0.10:5252/metrics
      #   instance: relay-1           # identity label; defaults to the URL host:port
      #   labels: { role: relay }     # extra static labels merged onto every series
      #   bearer_token_file: /run/secrets/scrape-token   # or bearer_token: "..." (for proxied/HTTPS targets)
      #   headers: { X-Scope-OrgID: "1" }
      #   tls: { ca_file: /etc/ca.pem, server_name: relay.ts.net, insecure_skip_verify: false }
    metric_allow: []                  # if non-empty, only forwarded metric names matching one of these anchored regexes are kept
    metric_deny: []                   # forwarded metric names matching any of these anchored regexes are dropped (after allow)
    drop_labels: []                   # label keys stripped from every forwarded series (the tailscale.node identity label is never dropped)
    discovery:                        # OPTIONAL: discover scrape targets from the Tailscale devices API (unioned with static targets)
      enabled: false
      interval: 5m                    # how often the device inventory is re-scanned for targets
      max_targets: 1000               # cap emitted discovered targets per refresh (one target per selected port, not one per device)
      scheme: http                    # http | https — metrics endpoint scheme on each device
      port: 5252                      # tailscaled client-metrics port
      path: /metrics                  # metrics endpoint path
      port_overrides: {}              # FILE-ONLY: map ACL tags to replacement metrics ports, e.g. {"tag:k8s-operator": [9002]}; no TS2OTEL_* encoding
      online_only: true               # only devices currently connected to the control plane
      exclude_external: true          # skip shared/external devices
      include_tags: []                # only devices with one of these tags (empty = all), e.g. ["tag:server"]
      exclude_tags: []                # devices with any of these tags are skipped (wins over include_tags)
      address_order: ipv4             # ipv4 | ipv6 — preferred address family (falls back to the other)
      instance_source: name           # identity label per target: name (MagicDNS short name, unique+friendly — default) | address (Tailscale host:port, always unique) | hostname (OS hostname, NOT unique — collisions like "localhost" are auto-suffixed)
      include_host_labels: true       # attach host.name/host.id for joins with tailscale.device.*
      include_tags_label: true        # attach tailscale.tags to each target's series

# ── Scheduler first-tick spread ────────────────────────────────────────────────
scheduler:
  initial_stagger_window: 3s          # spread initial collector ticks; current single-runtime default is 3s

# ── Active-passive coordination (OPTIONAL: Kubernetes only) ───────────────────
# mode: none keeps the historical singleton lifecycle. kubernetes elects one
# whole-process leader through a coordination.k8s.io Lease; standby pods remain
# live but not ready and run no collectors or receivers.
coordination:
  mode: none                           # none (default singleton behavior) | kubernetes (Lease-based active-passive)
  lease_name: tailscale2otel           # DNS-1123 Lease name; all replicas use the same name
  namespace: default                   # DNS-1123 namespace containing the Lease
  lease_duration: 15s                  # leader lease expiry; must be > renew_deadline > retry_period
  renew_deadline: 10s                  # step down when the apiserver cannot renew within this period
  retry_period: 2s                     # standby acquire and leader renew retry interval

# ── Durable state (poll cursors and semantic evidence) ─────────────────────────
checkpoint:
  store: file                         # file (persists window cursors across restarts; falls back to memory + WARN if the path isn't writable) | memory (RAM only; cold-starts from initial_lookback after a restart) | kubernetes (ConfigMap data in <coordination.lease_name>-checkpoints)
  evidence_store: file                # file (default; preserves ACL revision/audit provenance across restarts) | memory (unsafe except disposable runs; produces a specific warning). Independent of store, so streamed deployments may use store: memory with evidence_store: file.
  file_path: /var/lib/tailscale2otel/checkpoints.json   # used when either store is file — both file-backed classes share this atomic JSON file, preserving existing checkpoint keys. Mount a writable, persistent path here. This default suits a CONTAINER (the image pre-seeds it for uid 65532); a native run that cannot write it falls back to the platform state dir (~/.local/state, ~/Library/Application Support, %LocalAppData%) and logs where it went. Set this explicitly and it is used as-is — an explicit path is never relocated.
  write_debounce: 0s                  # coalesce nearby file writes; 0 preserves synchronous Set durability

# ── Receiver write-ahead log (OPTIONAL: durable local acceptance) ───────────────
# Disabled is fully stateless. When enabled, a successful receiver ACK means the
# accepted payload is durable on this filesystem: the raw authenticated webhook
# body or fully validated decompressed streaming body. It does NOT mean OTLP/backend
# acknowledgement. Replay is at-least-once: a crash between applying an envelope and committing it
# re-applies the whole envelope on restart, so exported data AND the metrics/log records derived
# from it can be counted twice. The in-memory cross-source dedup sets are rebuilt empty at startup
# and do not suppress this.
ingress_wal:
  enabled: false                        # opt in to durable local acceptance and oldest-first replay for receiver payloads
  directory: /var/lib/tailscale2otel/ingress-wal   # absolute, filepath-clean, non-root directory; mount durable state here when reschedule survival matters
  max_bytes: 268435456               # encoded WAL byte ceiling (256 MiB); full WAL fails new requests closed; no TTL/eviction
  max_entries: 10000                 # encoded entry ceiling; full WAL fails new requests closed; no TTL/eviction
  corruption: fail                   # only supported mode: fail closed rather than discard corrupt state

# ── Streaming receiver (OPTIONAL: RECEIVE logs instead of polling) ──────────────
# When enabled, set collectors.{flowlogs,auditlogs}.source to stream so each log
# type is ingested by exactly one path.
streaming:
  enabled: false                      # run the Splunk-HEC receiver to INGEST pushed logs (set the relevant collectors' source: stream)
  listen: ":8088"                     # bind address for the Splunk-HEC-compatible receiver
  path: /services/collector/event     # HEC endpoint path Tailscale POSTs to
  token: ""                           # shared secret; Tailscale sends HTTP Basic auth (base64 user:token), "Authorization: Splunk <token>" also accepted as a fallback (set via TS2OTEL_STREAMING__TOKEN); empty on a NON-loopback listen = every request REFUSED with 403 (empty is allowed only on a loopback bind)
  token_file: ""                      # read the value from this file instead (Docker secrets); set the value or the file, not both; content is whitespace-trimmed
  public_url: ""                      # externally reachable receiver URL; REQUIRED only when auto_configure: true
  tls:
    cert_file: ""                     # HTTPS cert (Tailscale requires HTTPS; a `tailscale cert` works for private endpoints)
    key_file: ""                      # HTTPS key
  decompress: auto                    # auto | gzip | zstd | none — request body decompression
  auto_configure: false               # on startup, register THIS receiver as the tailnet's log-streaming sink for BOTH log types (network/flow AND configuration/audit), OVERWRITING any existing sink for either; needs enabled + public_url + the log_streaming OAuth scope
  max_body_bytes: 0                   # cap on the DECOMPRESSED body; 0 = 64 MiB default, negative = unlimited (over-cap = 413); when ingress_wal.enabled this receiver must set a positive value <= 64 MiB
  max_concurrent_requests: 0          # how many requests may buffer a body AT ONCE (max_body_bytes caps one body, this caps their sum); 0 = 4 default, negative = unlimited (over-limit = 503 + Retry-After)
  per_route_max_concurrent_requests: 0 # per-tailnet admission cap; 0 selects an automatic fair share of the global budget
  # FILE-ONLY multi-tailnet routes. When non-empty, replace path/token/public_url/
  # auto_configure above. Every route selects exactly one tailnets[].name.
  routes: []

# ── Webhook receiver (OPTIONAL: real-time Tailscale events) ─────────────────────
webhook:
  enabled: false                      # run the receiver for real-time Tailscale webhook events
  listen: ":8089"                     # bind address for the webhook receiver
  path: /tailscale/webhook            # endpoint path Tailscale POSTs events to
  secret: ""                          # HMAC-SHA256 verification secret (set via TS2OTEL_WEBHOOK__SECRET); empty is accepted only on loopback, otherwise every request is refused with 403 before body read
  secret_file: ""                     # read the value from this file instead (Docker secrets); set the value or the file, not both; content is whitespace-trimmed
  tls:
    cert_file: ""                     # serve native HTTPS when paired with key_file; leave both empty behind an HTTPS reverse proxy
    key_file: ""                      # private key paired with cert_file; both paths are validated as readable at startup
  tolerance: 5m                       # reject signed timestamps older than this (replay window); "0" disables the check
  dedup_audit_events: false           # best-effort: drop a webhook event already counted via the audit logs
  max_body_bytes: 0                   # cap on the raw body read before signature verification; 0 = 1 MiB default, negative = unlimited (over-cap = 413); when ingress_wal.enabled this receiver must set a positive value <= 64 MiB
  max_concurrent_requests: 0          # how many requests may buffer a body AT ONCE, BEFORE the HMAC is checked (max_body_bytes caps one body, this caps their sum); 0 = 4 default, negative = unlimited (over-limit = 503 + Retry-After)
  per_route_max_concurrent_requests: 0 # per-tailnet admission cap; 0 selects an automatic fair share of the global budget
  # FILE-ONLY multi-tailnet routes. When non-empty, replace path/secret above.
  # A delivery is accepted only when every event names one matching tailnet.
  routes: []

# ── PII / identifier redaction (opt-out, all categories default true) ───────────
# Set a category to false to drop those identifiers from metrics and logs at
# runtime. Gauges whose only identity is a redacted category are suppressed.
pii_filter:
  emails: true              # user/actor login names (often email addresses)
  user_display_names: true  # actor display (human) names
  user_ids: true            # numeric/opaque user IDs (user.id)
  hostnames: true           # device + collector-host hostnames
  node_ids: true            # Tailscale node IDs
  tailscale_ips: true       # 100.64.0.0/10 + fd7a:115c:a1e0::/48 addresses
  internal_ips: true        # RFC1918 / ULA / link-local addresses
  external_ips: true        # public/routable addresses
  service_addrs: true       # VIP service names and optional display names
  endpoint_paths: true      # Tailscale API endpoint paths (self-obs)
  network_topology: true    # route CIDRs + split-DNS domains + search paths
  tailnet_name: true        # tailnet identifier
  free_text_details: true   # audit old/new/details, target names, key descriptions, posture values
  command_text: true              # verbatim `kubectl exec` command line on Kubernetes-audit logs; the only attribute a human types at a shell, so it can carry a pasted secret. Turning it off KEEPS the bounded tailscale.k8s.command_class classification the exec metrics are built on

# ── Self-observability (the exporter's own health telemetry) ────────────────────
self_observability:
  enabled: true                       # emit tailscale2otel.up, api.requests, runtime metrics, etc.
  instance_id: ""                     # service.instance.id resource attr; empty => host name. Set via env, e.g. TS2OTEL_SELF_OBSERVABILITY__INSTANCE_ID=$POD_NAME

# ── Admin HTTP server (ON by default: probes + status page + pprof mount) ───────
# Bind to a loopback/tailnet address, not the public internet. /healthz and /readyz
# are never authenticated so health checks keep working.
admin:
  enabled: true                       # run the admin HTTP server (probes + status page + optional pprof mount)
  listen: "127.0.0.1:9091"            # serves /healthz, /readyz, and the status page. Loopback by default: the status page is REFUSED (403) on a network-reachable bind without admin.auth.token, so widen this only together with a token
  landing_page: true                  # serve the human status page at / and machine-readable /api/status.json
  status_refresh_interval: 5s         # how often the status page re-polls /api/status.json (1s freshness ticker is independent)
  support_bundle_log_tail_records: 200 # bounded redaction-safe recent log records included in support bundles; 0 disables capture
  auth:
    token: ""                         # gate the status page + pprof behind this token (set via TS2OTEL_ADMIN__AUTH__TOKEN); empty is allowed only on a loopback listen — on any other bind the status page + JSON APIs are REFUSED with 403 (/healthz and /readyz stay open)
    token_file: ""                    # read the value from this file instead (Docker secrets); set the value or the file, not both; content is whitespace-trimmed
    failure_limit: 5                  # failures from one source inside failure_window before throttling; 0 disables
    failure_window: 1m                # rolling window for failed authentication attempts
    failure_backoff: 30s              # throttle duration after the per-source limit is reached
  tls:
    cert_file: ""                     # serve the admin listener over HTTPS instead of plain HTTP; set together with key_file (both-or-neither)
    key_file: ""                      # HTTPS key for admin.tls.cert_file
    client_ca_file: ""                # require a client certificate signed by this CA; needs cert_file/key_file
    client_auth: ""                   # require_and_verify by default when client_ca_file is set; same modes as prometheus.tls

# ── Built-in flow view (served at /flows on the admin server) ──────────────────
flows:
  enabled: true                       # keep a bounded, in-memory picture of recent traffic and serve /flows; needs admin.enabled + admin.landing_page (no effect otherwise)
  retention: 6h                       # how far back /flows can see, as one-minute buckets (1m–24h). Memory scales with this, and with the number of tailnets in multi-tailnet mode. Lost on restart — OTLP stays the system of record
  max_future_skew: 5m                 # local-view admission only: reject records further ahead of this process clock (0–1h); OTLP emission is unchanged
  capacity_profile: default           # trade memory for fidelity on every per-bucket dimension + the raw-connection ring: compact (~half), default (unchanged), or expanded (~double). Fixed, hard-coded presets only — never a raw number
  store:
    directory: ""                     # OPTIONAL, opt-in: a directory for the on-disk /flows backend (internal/flowstore/sqlitestore). Empty (default) is memory-only. Relative paths resolve against this config file, like ingress_wal.directory. Setting this writes flow rows, including user identities, to disk — they then survive restarts and land in backups
    retention: 720h                   # how far back the on-disk store keeps rows (1h–8760h/365d), independent of flows.retention which still only sizes the in-memory ring. Only takes effect once directory is set
    max_rows: 5000000                 # hard cap on retained rows (10000–1000000000), enforced independently of retention so a traffic flood cannot fill the disk before the next sweep. Only takes effect once directory is set
    max_export_rows: 50000            # cap on rows a single CSV/JSON export may read (100–1000000), so a large window cannot be materialized into memory in one request. Only takes effect once directory is set
    queue_size: 8192                  # bound on the write-behind queue between Record and the disk writer (64–1048576); a full queue drops and counts rather than blocking. Only takes effect once directory is set
    batch_size: 512                   # rows committed per write transaction (1–100000); must not exceed queue_size. Only takes effect once directory is set
    flush_interval: 5s                # force a partial batch to disk on this timer (100ms–5m) so a quiet tailnet's last few rows do not sit in memory indefinitely. Only takes effect once directory is set
    query_timeout: 15s                # give up a single read against the store after this long (1s–5m) rather than hang the admin page. Only takes effect once directory is set
    sweep_interval: 1h                # how often retention and the row cap are enforced (1m–24h). Only takes effect once directory is set
    incremental_vacuum_interval: 0s   # periodic SQLite page reclamation; 0 inherits sweep_interval
    incremental_vacuum_pages: 1000    # maximum pages reclaimed per vacuum tick

# ── Built-in audit/webhook event explorer (served at /events on the admin server) ──
events:
  enabled: true                       # keep a bounded, in-memory ring of recent audit/webhook events and serve /events; needs admin.enabled + admin.landing_page (no effect otherwise)
  max_events: 5000                    # how many individual events /events can see (100–100000). A plain count, not a time span — oldest evicted first. Lost on restart — OTLP stays the system of record

# ── Prometheus pull endpoint (OPTIONAL: dedicated listener) ─────────────────────
prometheus:
  enabled: false                      # backwards-compatible pull opt-in alongside OTLP; delivery.mode prometheus or dual also enables it
  listen: "127.0.0.1:2112"            # bind for /metrics (default loopback-only 127.0.0.1:2112); keep distinct from admin.listen
  auth:
    token: ""                         # gate /metrics behind this token (Bearer or Basic password); empty + a network bind = REFUSED 403 unless allow_unauthenticated. Set via TS2OTEL_PROMETHEUS__AUTH__TOKEN
    token_file: ""                    # read the value from this file instead (Docker secrets); set the value or the file, not both; content is whitespace-trimmed
    allow_unauthenticated: false      # acknowledge serving /metrics with NO token on a network-reachable bind (e.g. in-cluster scraping behind a NetworkPolicy); a loopback bind never needs this
  max_requests_in_flight: 4           # cap concurrent /metrics gathers (excess gets 503); must be positive while Prometheus is enabled
  timeout: 8s                         # give up on a single /metrics gather after this long (503); keep below the scraper's own timeout
  coalesce_gather: true               # serve overlapping scrapes from the same in-flight gather (bounds duplicate work; costs slight staleness)
  tls:
    cert_file: ""                     # serve the Prometheus /metrics listener over HTTPS instead of plain HTTP; set together with key_file (both-or-neither)
    key_file: ""                      # HTTPS key for prometheus.tls.cert_file
    client_ca_file: ""                # require scrapers to present a client certificate signed by this CA (mTLS); needs cert_file/key_file, composes with auth.token
    client_auth: ""                   # how hard to check the client cert: require_and_verify (default when client_ca_file set)|verify_if_given|require|request|none

# ── Profiling (OPTIONAL: all off by default, carries no Tailscale data) ─────────
profiling:
  pprof:
    enabled: false                    # mount net/http/pprof on the admin server (REQUIRES admin.enabled + admin.auth.token — heap dumps can expose in-memory secrets)
  pyroscope:
    enabled: false                    # run the Pyroscope continuous-profiling push agent
    server_address: ""                # REQUIRED when enabled, e.g. http://pyroscope:4040 or https://profiles-prod-NNN.grafana.net
    basic_auth_user: ""               # Grafana Cloud: the profiles instance ID (set via TS2OTEL_PROFILING__PYROSCOPE__BASIC_AUTH_USER)
    basic_auth_password: ""           # Grafana Cloud: a profiles:write access-policy token (..._BASIC_AUTH_PASSWORD)
    basic_auth_password_file: ""      # read the value from this file instead (Docker secrets); set the value or the file, not both; content is whitespace-trimmed
    tenant_id: ""                     # X-Scope-OrgID for multi-tenant servers (leave empty for Grafana Cloud)
    upload_rate: 60s                  # how often profiles are flushed
    tags: {}                          # extra static labels merged onto every profile, e.g. { env: prod }
    headers: {}                       # extra HTTP headers on every profile upload, e.g. { X-Api-Key: abc }; values are secrets and redact from status/logs. Reserved headers (Authorization, tenant) win over these
    tls:                              # TLS for the OUTBOUND profile-upload client (used when server_address is https)
      insecure_skip_verify: false     # keep TLS but skip server-certificate verification — a footgun; prefer ca_file
      ca_file: ""                     # PEM bundle of the CA to trust for the profiles endpoint (private CA / self-signed gateway)
      cert_file: ""                   # client certificate for mTLS to the profiles endpoint; set together with key_file (both-or-neither)
      key_file: ""                    # client key for profiling.pyroscope.tls.cert_file
    tailnet_label: "off"              # off | hashed | name — whether continuous profiles carry a tailnet dimension. A tailnet name is a CUSTOMER identifier and profiles go to a different destination from metrics/logs, so this is opt-in and NOT covered by pii_filter. hashed = a stable 12-hex SHA-256 prefix (answers "which tenant is burning CPU" for an MSP without shipping the name; pseudonymous, not anonymous — a small name space is enumerable). Emitted only for a single configured tailnet; multi-tailnet gets no tag, since there is one profiler per process. TS2OTEL_PROFILING__PYROSCOPE__TAILNET_LABEL
    span_profiles:                    # correlate sampled CPU profiles with trace spans, so a Grafana trace links straight to the profile
      enabled: false                  # REQUIRES tracing.enabled AND profiling.pyroscope.enabled. CPU profiles ONLY — Go attaches pprof labels to CPU samples, so heap/mutex/block/goroutine profiles cannot carry span identity
    credential_reload:                # rotate the password/header/TLS files this agent reads, without restarting
      enabled: false                  # governs the background poller only
      interval: 30s                   # poll period; minimum 5s. Ignored when enabled is false
  mutex_profile_fraction: 5           # runtime.SetMutexProfileFraction; on by default (applied only when pprof or pyroscope is enabled), 0 = disabled
  block_profile_rate: 100000          # runtime.SetBlockProfileRate (ns); on by default (100µs), 0 = disabled

# ── OTEL traces (third signal pillar, OFF by default) ───────────────────────────
# Emits spans for the exporter's own work: one root span per collector scrape
# cycle, a child span per Tailscale API request (with retry/auth span events), and
# one span per HEC-stream / webhook receiver request. Reuses otlp.* for the
# endpoint/protocol/headers/TLS. When enabled, trace exemplars are also attached
# to tailscale2otel.api.duration.
tracing:
  enabled: false                       # emit spans. TS2OTEL_TRACING__ENABLED
  sampler: parentbased_always_on       # head sampler: always_on|always_off|traceidratio|parentbased_always_on|parentbased_traceidratio. TS2OTEL_TRACING__SAMPLER
  sampler_arg: 1.0                     # sample ratio in [0,1] for the *traceidratio samplers (ignored otherwise). TS2OTEL_TRACING__SAMPLER_ARG
  remote_parent: trust                 # how an INBOUND traceparent's sampled bit is treated by the stream/webhook receivers: trust (today's behavior) | ignore (the local sampler alone decides, so a sender cannot force sampling) | link (start a new local root trace and link the remote one). TS2OTEL_TRACING__REMOTE_PARENT
  samplers:                            # per-workload-class head sampler; an empty sampler inherits the global one above, so an untouched block behaves exactly as before
    scrape:                            # one root span per collector scrape cycle
      sampler: ""                      # same enum as tracing.sampler. TS2OTEL_TRACING__SAMPLERS__SCRAPE__SAMPLER
      arg: 0.0                         # ratio in [0,1] for the *traceidratio samplers. TS2OTEL_TRACING__SAMPLERS__SCRAPE__ARG
    receiver:                          # one root span per HEC-stream / webhook request — usually the highest-rate class, so this is the one you turn down
      sampler: ""                      # TS2OTEL_TRACING__SAMPLERS__RECEIVER__SAMPLER
      arg: 0.0                         # TS2OTEL_TRACING__SAMPLERS__RECEIVER__ARG
    background:                        # periodic non-scrape work, e.g. the release/update check
      sampler: ""                      # TS2OTEL_TRACING__SAMPLERS__BACKGROUND__SAMPLER
      arg: 0.0                         # TS2OTEL_TRACING__SAMPLERS__BACKGROUND__ARG

# ── OTEL Resource enrichment (OPTIONAL) ─────────────────────────────────────────
# Adds standard/custom attributes to the OTEL Resource on metrics, logs AND traces.
# Bounded on purpose: Grafana Cloud promotes the whole service.* namespace to a
# per-series label, so service_namespace multiplies active-series cardinality by its
# distinct values. The app's own identity always wins, service.version stays off the
# METRICS Resource (see docs/metrics.md), and tailscale.tailnet /
# tailscale2otel.provider remain per-signal attributes and are refused here.
resource:
  service_namespace: ""                # service.namespace — promoted to a job-adjacent LABEL on every series. Keep it low-cardinality and stable across deploys. TS2OTEL_RESOURCE__SERVICE_NAMESPACE
  deployment_environment: ""           # deployment.environment.name — outside service.*, so it lands in target_info only and may vary per environment. TS2OTEL_RESOURCE__DEPLOYMENT_ENVIRONMENT
  attributes: {}                       # custom Resource attributes, e.g. { deploy.team: platform }. Max 32 entries, 256-byte keys/values; reserved keys are refused. FILE-ONLY (maps aren't settable via env)
  from_env: false                      # also read OTEL_RESOURCE_ATTRIBUTES / OTEL_SERVICE_NAME, filtered by the same rules. Off by default: it hands the ambient environment a channel onto a per-series label surface. TS2OTEL_RESOURCE__FROM_ENV

# ── Version checks (OPTIONAL: outbound "is a newer release available?" checks) ──
# Both sub-checks make external HTTPS calls and are fail-open (a failed/blocked fetch
# emits no comparison metric); the admin status page reports the blocked state. Disable
# both for air-gapped deployments. Under provider: headscale, devices.enabled defaults
# off unless explicitly set, because Headscale device versions are not comparable to
# Tailscale stable.
version_checks:
  self:
    enabled: true                     # emit tailscale2otel.update_available (running build vs latest tailscale2otel GitHub release)
  devices:
    enabled: true                     # emit per-device tailscale.device.version_skew + fleet rollups (device client version vs latest Tailscale stable). Needs the devices collector.
    outdated_minor_threshold: 3       # a device this many minor releases behind counts toward tailscale.devices.outdated
  cache_ttl: 1h                       # how long a fetched "latest version" is cached before re-fetching (minimum 5m)
  timeout: 10s                        # per-request timeout for the external version fetch

# ── Grafana annotations (OPTIONAL: the ONE outbound write) ──────────────────────
# Publishes a curated, closed set of tailnet events into a Grafana organization as
# annotations, so a dashboard can answer "what changed at 14:00" without any external
# automation. Everything else this process does is read-only polling plus OTLP push;
# this is the only thing it WRITES anywhere.
#
# Setting `url` is the whole opt-in: unset (the default) registers no writer, opens no
# client, starts no goroutine and logs nothing. Once url IS set the process FAILS TO
# START unless the token can actually write an annotation — discovering that at the
# first real event means the context an operator came looking for was never there, and
# nothing said so. The startup marker IS that write probe, so a healthy start leaves a
# real annotation rather than junk needing a delete permission to clean up.
#
# The token needs exactly one Grafana action: `annotations:create` on scope
# `annotations:type:organization` (the fixed role `fixed:annotations:writer` also works,
# but additionally grants annotations:write and annotations:delete, which are never
# used). Supply it via TS2OTEL_GRAFANA_ANNOTATIONS__TOKEN or token_file, never in
# committed YAML.
grafana_annotations:
  url: ""                              # Grafana base URL, e.g. https://mystack.grafana.net. Setting it IS the opt-in; empty = feature off entirely. TS2OTEL_GRAFANA_ANNOTATIONS__URL
  token: ""                            # Grafana service-account token (needs annotations:create and nothing else). Keep it in env/file, never in YAML. TS2OTEL_GRAFANA_ANNOTATIONS__TOKEN
  token_file: ""                       # path to a file holding the token (Docker/k8s secret mount). Value XOR file — setting both is a config error. TS2OTEL_GRAFANA_ANNOTATIONS__TOKEN_FILE
  dashboard_uid: ""                    # confine annotations to ONE dashboard. Empty (default) writes organization annotations, visible on every board and in Explore — which is the point of pushing them. TS2OTEL_GRAFANA_ANNOTATIONS__DASHBOARD_UID
  timeout: 10s                         # per-request timeout for POST /api/annotations. TS2OTEL_GRAFANA_ANNOTATIONS__TIMEOUT
  max_per_minute: 60                   # token-bucket CEILING on annotations written per process. Overage is dropped and counted, never delayed — a marker arriving after the moment it explains is worse than absent. TS2OTEL_GRAFANA_ANNOTATIONS__MAX_PER_MINUTE
  queue_size: 512                      # hand-off buffer between the collector goroutines and the single publisher. A full queue drops and counts rather than blocking collection. TS2OTEL_GRAFANA_ANNOTATIONS__QUEUE_SIZE
  rollup_interval: 5m                  # bucket width for rolled-up categories: one region annotation per interval per category per tailnet, instead of one marker per event. TS2OTEL_GRAFANA_ANNOTATIONS__ROLLUP_INTERVAL
  dedupe_retention: 48h                # how long a published annotation's dedupe key is remembered, so a restart cannot republish it. Must comfortably exceed the longest source overlap window. TS2OTEL_GRAFANA_ANNOTATIONS__DEDUPE_RETENTION
  state_file: ""                       # where the dedupe set persists. Empty = annotations.json beside checkpoint.file_path. Deliberately NOT inside the checkpoint file, which the window pollers rewrite every tick. TS2OTEL_GRAFANA_ANNOTATIONS__STATE_FILE
  extra_tags: []                       # extra tags added to every annotation, e.g. [env:prod]. Every annotation already carries tailscale2otel, category:<c> and rule:<id>. TS2OTEL_GRAFANA_ANNOTATIONS__EXTRA_TAGS
  categories:                          # the lifecycle/startup marker has no toggle on purpose: it is the write probe, and disabling it would only make a deployment go silently unverified
    config_change:
      enabled: true                    # ACL edits, device approval and churn, key lifecycle, user role changes, DNS and tailnet settings — the curated audit-log subset. Needs collectors.auditlogs. TS2OTEL_GRAFANA_ANNOTATIONS__CATEGORIES__CONFIG_CHANGE__ENABLED
      rollup: true                     # highest-volume category: rolled up by default so a busy tailnet draws a timeline rather than a picket fence. TS2OTEL_GRAFANA_ANNOTATIONS__CATEGORIES__CONFIG_CHANGE__ROLLUP
    expiry:
      enabled: true                    # a node key or auth key entering its expiry warning window — the marker that explains a device count stepping down. Needs collectors.keys / collectors.devices. TS2OTEL_GRAFANA_ANNOTATIONS__CATEGORIES__EXPIRY__ENABLED
      rollup: true                     # a fresh deployment finds every currently-expiring key at once, and one summary beats fifty markers at the same instant. TS2OTEL_GRAFANA_ANNOTATIONS__CATEGORIES__EXPIRY__ROLLUP
    policy_change:
      enabled: true                    # ACL revision and policy-diff markers from the policy snapshot family. TS2OTEL_GRAFANA_ANNOTATIONS__CATEGORIES__POLICY_CHANGE__ENABLED
      rollup: false                    # policy changes are rare and individually meaningful. TS2OTEL_GRAFANA_ANNOTATIONS__CATEGORIES__POLICY_CHANGE__ROLLUP
    inventory:
      enabled: true                    # device additions, removals and material field changes. TS2OTEL_GRAFANA_ANNOTATIONS__CATEGORIES__INVENTORY__ENABLED
      rollup: true                     # device churn can be high-volume; summarize it into one region per interval. TS2OTEL_GRAFANA_ANNOTATIONS__CATEGORIES__INVENTORY__ROLLUP
    risk:
      enabled: true                    # newly observed ACL, SSH and auto-approver risk findings. TS2OTEL_GRAFANA_ANNOTATIONS__CATEGORIES__RISK__ENABLED
      rollup: false                    # each new risk finding remains individually visible. TS2OTEL_GRAFANA_ANNOTATIONS__CATEGORIES__RISK__ROLLUP
